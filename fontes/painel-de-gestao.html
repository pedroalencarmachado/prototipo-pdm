<title>Painel de Gestão — Pé-de-Meia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Raleway:wght@600;700;800&display=swap">

<style>
:root{
  /* Paleta institucional gov.br — base do portal atual */
  --blue:#1351B4;
  --blue-dark:#0C326F;
  --blue-soft:#E8EFFA;
  --blue-line:#C5D4EB;
  --green:#168821;
  --green-soft:#E3F5E6;
  --red:#E52207;
  --red-soft:#FDEAE7;
  --orange:#C25400;
  --orange-soft:#FDF0E3;
  --yellow:#FFCD07;

  /* Roxo = a camada proposta. Teal = o que mudou após a revisão com o MEC. */
  --new:#6C2EB9;
  --new-soft:#F3EDFB;
  --new-line:#D9C7F0;

  /* cores dos ciclos — usadas no gráfico e nas etiquetas */
  --c26:#1351B4;
  --c25:#00A0A8;
  --c24:#8E44AD;

  --ink:#16202E;
  --ink-2:#48566B;
  --ink-3:#71809A;
  --line:#DCE3ED;
  --line-2:#EDF1F7;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --ground:#F1F4F9;

  --shadow:0 1px 2px rgba(22,32,46,.06), 0 4px 14px rgba(22,32,46,.05);
  --radius:6px;

  --font-ui:"Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Raleway", "Public Sans", -apple-system, "Segoe UI", sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:3px}
table{border-collapse:collapse; width:100%}
.num{font-variant-numeric:tabular-nums}
input,select{font:inherit}

/* ─────────── faixa de protótipo ─────────── */
.proto-bar{
  position:sticky; top:0; z-index:60;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 24px; font-size:12px;
}
.proto-bar strong{
  font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  background:var(--new); padding:2px 7px; border-radius:3px; font-size:11px;
}
.proto-bar .msg{color:#C3CCDA}
.proto-bar .spacer{flex:1}
.toggle{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  color:#fff; border-radius:99px; padding:4px 12px 4px 6px; font-size:12px;
  white-space:nowrap;
}
.toggle:hover{background:rgba(255,255,255,.16)}
.toggle .dot{
  width:26px; height:15px; border-radius:99px; background:rgba(255,255,255,.28);
  position:relative; transition:background .18s; flex:none;
}
.toggle .dot::after{
  content:""; position:absolute; top:2px; left:2px; width:11px; height:11px;
  border-radius:50%; background:#fff; transition:transform .18s;
}
body.mark .toggle.t-new .dot{background:#9B5DE5}
body.mark .toggle.t-new .dot::after{transform:translateX(11px)}
.seg{
  display:inline-flex; align-items:center; gap:2px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  border-radius:99px; padding:2px 3px 2px 11px; font-size:12px; white-space:nowrap;
}
.seg .rot{color:#C3CCDA; margin-right:5px}
.seg button{
  background:none; border:0; color:#fff; font:inherit; font-weight:700;
  border-radius:99px; padding:2px 10px; cursor:pointer;
}
.seg button:hover{background:rgba(255,255,255,.16)}
.seg button[aria-pressed="true"]{background:#fff; color:var(--ink)}

/* ─────────── chrome do portal ─────────── */
.topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:31px; z-index:50}
.topbar-inner{max-width:1240px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:62px}
.brand{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.06em; color:var(--blue-dark); white-space:nowrap}
.nav{display:flex; gap:4px; margin-left:auto}
.nav a{padding:8px 13px; border-radius:var(--radius); font-weight:600; font-size:14px; color:var(--blue); position:relative}
.nav a:hover{background:var(--blue-soft); text-decoration:none}
.nav a.on{background:var(--blue-soft); color:var(--blue-dark)}
.user{display:flex; align-items:center; gap:10px; padding-left:24px; border-left:1px solid var(--line); margin-left:8px}
.user .who{text-align:right; line-height:1.25}
.user .who b{display:block; font-weight:600; font-size:13px}
.user .who small{color:var(--ink-3); font-size:12px}
.user .av{width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700}

.crumbs{background:var(--surface); border-bottom:1px solid var(--line-2)}
.crumbs-inner{max-width:1240px; margin:0 auto; padding:9px 24px; font-size:12px; color:var(--ink-3); display:flex; gap:8px; align-items:center}
.crumbs-inner a{color:var(--blue)}
.crumbs-inner .sep{color:var(--blue-line)}

.page{max-width:1240px; margin:0 auto; padding:26px 24px 72px}

/* ─────────── títulos e blocos ─────────── */
.page-head{display:flex; align-items:flex-start; gap:20px; margin-bottom:22px}
.page-head h1{font-size:23px; font-weight:700}
.page-head .sub{color:var(--ink-2); font-size:14px; margin-top:3px; max-width:78ch}
.page-head .mark{margin-left:auto; font-family:var(--font-display); font-weight:800; letter-spacing:.06em; color:var(--blue-dark); font-size:16px; white-space:nowrap}

.filters{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.field{display:flex; align-items:center; gap:9px}
.field > label{color:var(--ink-2); font-size:13px}
select, .inp{
  font-size:13px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 10px; min-width:104px;
}
select:hover{border-color:var(--blue-line)}
.field.pai > label{color:var(--new); font-weight:600}
.field.pai select{border-color:var(--new-line); background:var(--new-soft); min-width:210px; font-weight:500}
.field.filho > label{color:var(--ink-2)}
.field.filho select{min-width:190px}
.field .hint{color:var(--ink-3); font-size:11.5px; margin-left:-4px}

.notice{background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--radius); padding:13px 16px; color:var(--ink-2); font-size:13px; margin-bottom:22px}
.notice b{color:var(--ink)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:24px}
.tabs button{background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; padding:10px 16px; font-size:14px; color:var(--ink-2)}
.tabs button.on{color:var(--blue-dark); border-bottom-color:var(--blue); font-weight:600}
.tabs button:hover{color:var(--blue)}

.section-title{display:flex; align-items:center; gap:10px; margin:32px 0 12px; font-size:15px; font-weight:700; font-family:var(--font-display)}
.section-title:first-child{margin-top:0}
.section-title .ico{color:var(--ink-3); font-size:15px}
.section-title .act{margin-left:auto}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:99px; border:1px solid var(--blue); color:var(--blue); background:transparent; padding:7px 16px; font-size:13px; font-weight:600}
.btn:hover{background:var(--blue-soft)}
.btn.solid{background:var(--blue); color:#fff; border-color:var(--blue)}
.btn.solid:hover{background:var(--blue-dark)}
.btn.new{border-color:var(--new); color:var(--new)}
.btn.new:hover{background:var(--new-soft)}
.btn.new.solid{background:var(--new); color:#fff}
.btn.new.solid:hover{background:#571E9B}
.btn.sm{padding:5px 12px; font-size:12px}

/* ─────────── cartões de indicador ─────────── */
.kpis{display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.kpi{padding:14px 16px 16px; border-left:1px solid var(--line-2); border-top:3px solid var(--c,var(--blue))}
.kpi:first-child{border-left:0}
.kpi .lbl{display:flex; align-items:center; gap:6px; justify-content:space-between; color:var(--ink-2); font-size:12.5px; min-height:32px}
.kpi .val{font-size:26px; font-weight:700; color:var(--c,var(--blue)); margin-top:4px}
.info{width:15px; height:15px; border-radius:50%; background:var(--ink); color:#fff; flex:none; font-size:10px; font-weight:700; display:grid; place-items:center; cursor:help}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.panel-rows{display:grid; grid-template-columns:1fr 1fr}
.cell{padding:13px 16px; border-top:1px solid var(--line-2); border-left:1px solid var(--line-2)}
.cell:nth-child(odd){border-left:0}
.cell.wide{grid-column:1 / -1; border-top:0; background:var(--surface-2)}
.cell .lbl{display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12.5px}
.cell .val{font-size:19px; font-weight:600; margin-top:2px}
.cell.wide .val{font-size:20px}

/* ─────────── tabelas ─────────── */
.tbl-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto}
table th{text-align:left; font-size:12.5px; font-weight:600; color:var(--blue); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
table td{padding:12px 14px; border-bottom:1px solid var(--line-2); vertical-align:top; font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .prim{font-weight:500}
td .sec{color:var(--ink-3); font-size:11.5px; margin-top:2px}
td.r,th.r{text-align:right}
.eye{color:var(--blue); font-size:15px; background:none; border:0; padding:2px 4px; border-radius:4px}
.eye:hover{background:var(--blue-soft)}
.empty{padding:34px 16px; text-align:center; color:var(--ink-2)}
.empty b{display:block; color:var(--ink); margin-bottom:4px}

.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap}
.pill.ok{background:var(--green-soft); color:var(--green)}
.pill.no{background:var(--red-soft); color:var(--red)}
.pill.wait{background:var(--orange-soft); color:var(--orange)}
.pill.blue{background:var(--blue-soft); color:var(--blue-dark)}
.pill.gray{background:var(--line-2); color:var(--ink-2)}
.pill.c26{background:#E8EFFA; color:var(--c26)}
.pill.c25{background:#E0F5F6; color:#00767D}
.pill.c24{background:#F3E9F8; color:var(--c24)}

.freq{text-align:center; font-variant-numeric:tabular-nums; font-weight:500}
.freq.hi{background:#E8F6EA}
.freq.mid{background:#FBF3E4}
.freq.lo{background:#FCEBE8}
.freq.acc{font-weight:700}

.searchbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.searchbox{flex:1; min-width:280px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0 14px}
.searchbox input{flex:1; border:0; background:none; padding:11px 0; font-size:13px; color:var(--ink); outline:none}
.searchbox .mag{color:var(--blue); font-size:15px}
.searchbox button.clr{border:0; background:none; color:var(--ink-3); font-size:16px; line-height:1}
.count{color:var(--ink-2); font-size:12.5px; white-space:nowrap}

.export{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px}
.export h3{font-size:15px; margin-bottom:14px}
.export .box{background:var(--surface-2); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:20px}
.export .box p{margin:3px 0 0; color:var(--ink-2); font-size:13px; max-width:62ch}
.export .box b{font-size:13.5px}
.export .box .btn{margin-left:auto; flex:none}

/* ─────────── faixa de contexto de janela ─────────── */
.window-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--new-soft); border:1px solid var(--new-line);
  border-left:4px solid var(--new); border-radius:var(--radius);
  padding:12px 16px; margin-bottom:20px; font-size:13px;
}
.window-bar .t{font-weight:600; color:var(--new)}
.window-bar .d{color:var(--ink-2)}
.window-bar .actions{margin-left:auto; display:flex; gap:8px}

/* ─────────── lista de janelas ─────────── */
.window-list{display:flex; flex-direction:column; gap:12px}
.window-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  border-left:4px solid var(--blue-line);
  display:grid; grid-template-columns:200px 1fr 210px 230px; gap:22px;
  padding:18px 20px; align-items:center; text-align:left; width:100%; font:inherit; cursor:pointer;
}
.window-card:hover{border-color:var(--blue-line); border-left-color:var(--new); box-shadow:var(--shadow)}
.window-card.hot{border-left-color:var(--new)}
/* calendário: aberto (verde) e próximos (cinza, sem clique) */
.cal-h{display:flex; align-items:baseline; gap:10px; margin:4px 0 10px; font-size:15px; font-weight:700}
.cal-h span{font-size:12.5px; font-weight:400; color:var(--ink-3)}
.window-card.fut{cursor:default; background:var(--surface-2); border-style:dashed; border-left:4px solid #C8D0DB; padding:12px 20px; color:var(--ink-3)}
.window-card.fut:hover{box-shadow:none; border-color:var(--line); border-left-color:#C8D0DB}
.window-card.fut .day{font-size:17px; color:var(--ink-2)}
.window-card.aberta{background:#F3FAF4; border-style:solid; border-left-color:var(--green); color:var(--ink)}
.window-card.aberta:hover{border-color:var(--line); border-left-color:var(--green)}
.window-card.aberta .day{color:var(--ink)}
.stj{display:inline-block; margin-top:5px; font-size:11px; font-weight:700; padding:1px 9px; border-radius:99px; background:#E4E8EE; color:var(--ink-2)}
.stj.ab{background:var(--green); color:#fff}
.wc-env b{color:var(--ink); font-weight:600}
.wc-env{font-size:13px}
.wc-dado{color:var(--ink-3); font-size:12px; margin-top:2px}
/* "Comparar processamentos" em evidência */
.tabs button.cmp-tab{color:var(--new); font-weight:600; display:inline-flex; align-items:center; gap:7px}
.tabs button.cmp-tab .nv{background:var(--new); color:#fff; font-size:10px; font-weight:700; letter-spacing:.04em; padding:1px 7px; border-radius:99px; text-transform:uppercase}
.tabs button.cmp-tab.on{border-bottom-color:var(--new); color:var(--new)}
.cmp-cta{display:flex; align-items:center; gap:14px; background:var(--new-soft); border:1px solid var(--new-line); border-radius:var(--radius); padding:12px 16px; margin-bottom:18px}
.cmp-cta .ic{width:34px; height:34px; border-radius:50%; background:var(--new); color:#fff; display:grid; place-items:center; font-size:17px; flex:none}
.cmp-cta p{margin:0; font-size:13px; color:var(--ink-2)}
.cmp-cta p b{color:var(--ink); display:block; font-size:14px}
.cmp-cta .btn{margin-left:auto; flex:none}
.wc-date .day{font-size:21px; font-weight:700; font-family:var(--font-display); line-height:1.1}
.wc-date .mon{color:var(--ink-2); font-size:12.5px; margin-top:3px}
.wc-cycles .cap, .wc-res .cap{color:var(--ink-3); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px}
.wc-cycles .pills{display:flex; gap:6px; flex-wrap:wrap}
.wc-res .big{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.wc-res .money{color:var(--green); font-weight:600; font-variant-numeric:tabular-nums; font-size:13px}
.bar{height:5px; border-radius:99px; background:var(--line-2); overflow:hidden; margin-top:7px}
.bar span{display:block; height:100%; background:var(--blue); border-radius:99px}
.window-card.hot .bar span{background:var(--new)}

/* ─────────── detalhe da janela ─────────── */
.win-head{background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--new); border-radius:var(--radius); padding:22px 24px; margin-bottom:24px}
.win-head .row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
.win-head h1{font-size:24px; font-weight:700}
.win-head .meta{display:flex; gap:28px; margin-top:16px; flex-wrap:wrap}
.win-head .meta div .k{color:var(--ink-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em}
.win-head .meta div .v{font-weight:600; font-size:13.5px; margin-top:3px; font-variant-numeric:tabular-nums}
.win-head .acts{margin-left:auto; display:flex; gap:8px}

.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.res{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column}
.res-h{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--line-2); font-weight:700; font-size:14px; font-family:var(--font-display)}
.res-h .chip{margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-2); border-radius:99px; padding:2px 9px}
.res-b{padding:6px 16px 14px; flex:1}
.res-f{padding:11px 16px; border-top:1px solid var(--line-2); background:var(--surface-2)}
.dl{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dotted var(--line)}
.dl:last-child{border-bottom:0}
.dl .k{color:var(--ink-2); font-size:13px}
.dl .v{font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; display:flex; align-items:baseline; gap:8px}
.delta{font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums}
.delta.up{background:var(--green-soft); color:var(--green)}
.delta.down{background:var(--red-soft); color:var(--red)}
.delta.flat{background:var(--line-2); color:var(--ink-3)}

.donut-row{display:flex; align-items:center; gap:24px; padding:14px 0 6px; flex-wrap:wrap}
.donut{width:132px; height:132px; border-radius:50%; flex:none; display:grid; place-items:center}
.donut .hole{width:92px; height:92px; border-radius:50%; background:var(--surface); display:grid; place-items:center; text-align:center; line-height:1.15}
.donut .hole b{font-size:12.5px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block}
.donut .hole small{font-size:10px; color:var(--ink-3)}
.legend{display:flex; flex-direction:column; gap:9px; font-size:12.5px; flex:1; min-width:210px}
.legend .lrow{display:flex; align-items:center; gap:9px}
.legend i{width:10px; height:10px; border-radius:2px; flex:none}
.legend .nm{color:var(--ink-2)}
.legend .vl{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}
.legend .money{color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:112px; text-align:right}

/* ─────────── modal de detalhe ─────────── */
.overlay{position:fixed; inset:0; background:rgba(11,18,28,.46); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:56px 20px; overflow:auto}
.modal{background:var(--surface); border-radius:8px; max-width:860px; width:100%; box-shadow:0 18px 50px rgba(11,18,28,.28)}
.modal-h{display:flex; align-items:flex-start; gap:16px; padding:20px 24px; border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px; font-weight:700}
.modal-h .sec{color:var(--ink-3); font-size:12.5px; margin-top:4px}
.modal-h button{margin-left:auto; border:0; background:none; font-size:22px; color:var(--ink-3); line-height:1}
.modal-b{padding:20px 24px 26px}
.modal-b h4{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); margin:22px 0 10px; font-family:var(--font-ui); font-weight:700}
.modal-b h4:first-child{margin-top:0}
.idgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.idgrid div .k{color:var(--ink-3); font-size:11.5px}
.idgrid div .v{font-weight:600; font-size:13.5px; margin-top:2px; font-variant-numeric:tabular-nums}

/* ─────────── marcações ─────────── */
body.mark [data-new]{outline:2px dashed var(--new); outline-offset:3px; border-radius:var(--radius); position:relative}
body.mark [data-new]::after{
  content:attr(data-new); position:absolute; top:-9px; left:10px; z-index:6;
  background:var(--new); color:#fff; font-family:var(--font-ui);
  font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;

/* ── amostra da base ──────────────────────────────────────────────────
   O Portal lista centenas de milhares de registros e mostra uma página por vez.
   Aqui acontece o mesmo: as listagens exibem uma página da amostra e informam
   ao lado o total real do recorte — é o que mantém a listagem coerente com os
   cartões e o gráfico. Os estudantes nomeados acima seguem sendo os que
   respondem às buscas por nome, CPF, NIS e matrícula. */
(function gerarAmostra(){
  let seed = 20260826;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const ate = n => Math.floor(rnd() * n);
  const d3 = () => String(100 + ate(900)), d2 = () => String(10 + ate(90));

  const locais = ALUNOS.map(a => ({escola:a.escola, inep:a.inep, mun:a.mun}));
  const cpfsUsados = new Set(ALUNOS.map(a => a.cpf));
  const matsUsadas = new Set(ALUNOS.map(a => a.mat));

  const pool = [];
  for (let i = 0; i < 60; i++){
    let cpf, mat;
    do { cpf = `${d3()}.${d3()}.${d3()}-${d2()}`; } while (cpfsUsados.has(cpf));
    do { mat = String(29000000 + ate(1500000)); } while (matsUsadas.has(mat));
    cpfsUsados.add(cpf); matsUsadas.add(mat);

    const loc = locais[ate(locais.length)];
    /* distribuição por ciclo: a maioria no ciclo corrente */
    const sorte = rnd();
    const sit = {};
    if (sorte < 0.60) sit[2026] = 'Elegível';
    else if (sorte < 0.85) { sit[2026] = 'Elegível'; sit[2025] = 'Elegível'; }
    else sit[2024] = 'Elegível';

    /* frequência sempre igual ou acima de 80% — os casos abaixo de 80 são os nomeados */
    const f = () => Math.round((82 + rnd() * 18) * 100) / 100;
    const fev = f(), mar = f(), abr = f();
    pool.push({
      mat, nome:'Estudante ' + String(2000000000 + ate(999999999)), cpf, nis:'',
      escola:loc.escola, inep:loc.inep, mun:loc.mun, sit, alt:[], amostra:true,
      freq:{fev, mar, abr, acum: Math.round((fev + mar + abr) / 3 * 100) / 100}
    });
  }
  ALUNOS.push(...pool);

  /* parcelas da amostra, seguindo as competências reais de cada janela */
  JANELAS.forEach(j => {
    j.ciclos.forEach(c => {
      const elegiveis = pool.filter(a => a.sit[c.ano]);
      c.parcelas.forEach(p => {
        for (let i = 0; i < 14 && elegiveis.length; i++){
          const a = elegiveis[ate(elegiveis.length)];
          const pago = rnd() < 0.754;                    /* mesma proporção dos cartões */
          const dia = String(10 + ate(18)).padStart(2,'0');
          const [d, m, y] = j.rotulo.split('/');
          PARCELAS.push({
            mat:a.mat, ciclo:c.ano, cod:p.cod, amostra:true,
            sit: pago ? 'Pago' : 'Aguardando Pagamento',
            proc: `${j.rotulo} 0${2 + ate(5)}:${dia}`,
            dt: pago ? `${String(+d + 1).padStart(2,'0')}/${m}/${y}` : null,
            jan:j.id
          });
        }
      });
    });
  });
})();

/* quantidades por motivo, fechando a soma exata do total (maior resto) */
function qtdMotivos(grupo, total){
  const ks = Object.keys(MOTIVOS).filter(k => MOTIVOS[k].g === grupo);
  const pe = ks.reduce((s, k) => s + MOTIVOS[k].p, 0);
  const base = ks.map(k => { const ex = total * MOTIVOS[k].p / pe; return {k, q:Math.floor(ex), r:ex - Math.floor(ex)}; });
  let falta = total - base.reduce((s, b) => s + b.q, 0);
  [...base].sort((a, b) => b.r - a.r).forEach(b => { if (falta > 0 && MOTIVOS[b.k].p > 0) { b.q++; falta--; } });
  return base;
}

function motivoDe(de, para, a, ano){
  const mk = a && ano ? motPrincipal(a, ano) : null;
  if (mk && para !== 'Elegível') return MOTIVOS[mk].nome;
  if (para === 'Elegível' && de === 'Elegibilidade indefinida') return 'Informações de matrícula confirmadas pela rede';
  if (para === 'Elegível') return 'Inscrição no CadÚnico confirmada';
  if (para === 'Não elegível') return 'Divergência de cadastro (nome ou CPF) com a base do CadÚnico';
  return 'Atualização cadastral';
}

/* busca unificada: CPF, nome, matrícula, código do estudante (e NIS, ainda aceito) */
function casa(a, termo){
  if (!termo) return true;
  const t = termo.toLowerCase().replace(/[.\-\s]/g, '');
  return [a.nome, a.cpf, a.codEst, a.nis, a.mat, a.escola, a.mun]
    .filter(Boolean)
    .some(v => String(v).toLowerCase().replace(/[.\-\s]/g, '').includes(t));
}

/* M1: etiquetas com os filtros em uso, cada uma removível, e "Limpar filtros" */
function chipsFiltros(){
  const c = [], x = (rot, js) => `<span class="fchip">${rot}${js ? `<button title="Remover este filtro" aria-label="Remover filtro: ${rot}" onclick="${js}">×</button>` : ''}</span>`;
  if (state.janela) c.push(x(`${tv('Processamento', 'Janela de processamento')}: ${jan(state.janela).rotulo}`, "setJanela('')"));
  c.push(x(state.ciclo === 'todos' ? `Ciclos: ${ciclosDisponiveis().join(', ')}` : `Ciclo ${state.ciclo}`,
    state.ciclo === '2026' ? '' : (state.janela && !anosDa(jan(state.janela)).includes(2026) ? '' : "setCiclo('2026')")));
  if (state.altF) c.push(x(`Só com situação alterada ${tv('neste processamento', 'nesta janela de processamento')}`, 'state.altF=false; render()'));
  if (state.mun) c.push(x(`Município: ${state.mun}`, "state.mun=''; render()"));
  if (state.sitF) c.push(x(`Situação: ${state.sitF}`, "state.sitF=''; state.motF=''; render()"));
  if (state.motF) c.push(x(`Motivo: ${MOTIVOS[state.motF].nome}`, "state.motF=''; render()"));
  if (state.incF) c.push(x(`Incentivo: ${state.incF}`, "state.incF=''; render()"));
  if (state.sitPagF) c.push(x(`Situação: ${state.sitPagF}`, "state.sitPagF=''; render()"));
  if (state.faixaF) c.push(x(`Frequência acumulada: ${state.faixaF === 'acima' ? 'igual ou acima de 80%' : 'abaixo de 80%'}`, "state.faixaF=''; render()"));
  if (state.busca) c.push(x(`Busca: “${state.busca.replace(/</g, '&lt;')}”`, "state.busca=''; render()"));
  const algum = state.janela || state.ciclo !== '2026' || state.altF || state.mun || state.sitF || state.motF || state.incF || state.sitPagF || state.faixaF || state.busca;
  return `<div class="fchips" data-new="filtros ativos"><span class="flb">Filtros em uso:</span>${c.join('')}
    ${algum ? `<button class="lnk2" onclick="limparFiltros(); render()">Limpar filtros</button>` : ''}</div>`;
}
/* M10 (entrevistas): a exportação diz o recorte e o que vem na planilha */
function descRecorte(){
  const p = [];
  p.push(state.janela ? `${tv('processamento de', 'janela de processamento de')} ${jan(state.janela).rotulo}` : tv('todos os processamentos', 'todas as janelas de processamento'));
  p.push(state.ciclo === 'todos' ? `ciclos ${ciclosDisponiveis().join(', ')}` : `ciclo ${state.ciclo}`);
  if (state.altF) p.push('só com situação alterada');
  if (state.mun) p.push(state.mun);
  if (state.sitF) p.push(state.sitF);
  if (state.motF) p.push(`motivo: ${MOTIVOS[state.motF].nome}`);
  if (state.incF) p.push(`incentivo ${state.incF}`);
  if (state.sitPagF) p.push(state.sitPagF);
  if (state.faixaF) p.push(state.faixaF === 'acima' ? 'frequência ≥ 80%' : 'frequência < 80%');
  if (state.busca) p.push(`busca “${state.busca.replace(/</g, '&lt;')}”`);
  return p.join(' · ');
}

/* JANELAS está em ordem decrescente (a mais recente primeiro).
   Índice MAIOR = janela mais antiga. A trava garante B sempre posterior a A. */
function setCmpA(i){
  state.cmpA = +i;
  if (state.cmpB >= state.cmpA) state.cmpB = state.cmpA - 1;  /* B tem de ser mais recente */
  render();
}
function setCmpB(i){ state.cmpB = +i; render(); }

function comparativo(){
  const a = JANELAS[state.cmpA], b = JANELAS[state.cmpB];
  const linha = (k, va, vb, money) => {
    const dif = vb - va;                                      /* evolução de A para B */
    return `<tr>
      <td>${k}</td>
      <td class="r num">${money?R$(va):N(va)}</td>
      <td class="r num"><b>${money?R$(vb):N(vb)}</b></td>
      <td class="r">${dif===0?'<span class="delta flat">=</span>':`<span class="delta ${dif>0?'up':'down'}">${dif>0?'+':'−'}${money?R$(Math.abs(dif)):N(Math.abs(dif))}</span>`}</td>
    </tr>`;
  };

  /* A pode ser qualquer janela menos a mais recente; B, qualquer uma posterior a A */
  const opsA = JANELAS.map((j, i) => ({i, j})).filter(x => x.i > 0);
  const opsB = JANELAS.map((j, i) => ({i, j})).filter(x => x.i < state.cmpA);

  return `
    <div class="filters">
      <div class="field">
        <label for="c-a">${tv('Processamento A', 'Janela de processamento A')} <span class="hint" style="margin:0">anterior</span></label>
        <select id="c-a" onchange="setCmpA(this.value)">
          ${opsA.map(x => `<option value="${x.i}" ${state.cmpA===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="c-b">${tv('Processamento B', 'Janela de processamento B')} <span class="hint" style="margin:0">posterior</span></label>
        <select id="c-b" onchange="setCmpB(this.value)">
          ${opsB.map(x => `<option value="${x.i}" ${state.cmpB===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <span class="count">só é possível comparar ${tv('um processamento com outro posterior a ele', 'uma janela de processamento com outra posterior a ela')}</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:40%">Indicador</th>
          <th class="r">A · ${a.rotulo}</th>
          <th class="r">B · ${b.rotulo}</th>
          <th class="r" style="width:160px">Variação</th>
        </tr></thead>
        <tbody>
          ${linha('Ciclos afetados', anosDa(a).length, anosDa(b).length)}
          ${linha('Matrículas processadas', somaJ(a,'processadas'), somaJ(b,'processadas'))}
          ${linha('Matrículas com situação alterada', somaJ(a,'alteradas'), somaJ(b,'alteradas'))}
          ${linha('Parcelas liberadas', parcelasJ(a), parcelasJ(b))}
          ${linha('Valor liberado', valorJ(a), valorJ(b), true)}
        </tbody>
      </table>
    </div>
    <p style="color:var(--ink-2); font-size:13px; margin-top:14px; max-width:92ch">
      A variação mostra o que mudou ${tv('do processamento', 'da janela de processamento')} <b>${a.rotulo}</b> para ${tv('o processamento', 'a janela de processamento')} <b>${b.rotulo}</b>.
      ${tv('Processamentos', 'Janelas de processamento')} que atingem mais de um ciclo liberam mais pagamento — é o caso de ${ULTIMA.rotulo}, que alcançou três ciclos.
    </p>`;
}

/* Distribuição por motivo — mesmo padrão do painel de situações do pagamento:
   grupos com a cor da situação, ícone + nome (nunca só a cor), linhas que filtram a lista. */
const GRUPO_MOT = {
  nao:{sit:'Não elegível', cor:'#48566B', ico:'✕', desc:'não atendem a um ou mais requisitos'},
  indef:{sit:'Elegibilidade indefinida', cor:'#C25400', ico:'?', desc:'dados a corrigir para concluir a avaliação'}
};
/* Pedido do Pedro (05/11): o painel de motivos sai da lista de Elegibilidade e vai para a aba
   Elegibilidade do Painel de Gestão. acao(k, G) devolve o onclick da linha, ou '' se ela não abre nada. */
function painelMotivos(tot, acao, sub){
  const pc = (q, t) => t ? (q / t * 100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%' : '0,0%';
  const grupo = g => {
    const G = GRUPO_MOT[g], t = tot[g], its = qtdMotivos(g, t).sort((a, b) => b.q - a.q || MOTIVOS[b.k].p - MOTIVOS[a.k].p);
    const com = its.filter(i => i.q > 0), sem = its.filter(i => !i.q), max = Math.max(1, ...com.map(i => i.q));
    return `<div class="sgrp" style="--gc:${G.cor}">
      <div class="sgh"><span class="sico">${G.ico}</span><b>${G.sit}</b><span class="sgd">${G.desc}</span><span class="sgq num">${N(t)}</span></div>
      ${t === 0 ? `<div class="szero">Nenhuma matrícula nesta situação no recorte.</div>` : com.map(i => {
        const M = MOTIVOS[i.k], js = acao(i.k, G);
        const corpo = `<span class="mnm">${M.nome}<small>${M.cod}</small></span>
          <span class="mtr"><span style="width:${(i.q / max * 100).toFixed(1)}%"></span></span>
          <span class="mp">${pc(i.q, t)}</span><span class="mq">${N(i.q)}</span>`;
        return js ? `<button class="mrow" title="Abrir a lista de estudantes com este motivo" onclick="${js}">${corpo}</button>`
          : `<div class="mrow">${corpo}</div>`;
      }).join('')}
      ${sem.length && t ? `<div class="szero">Sem estudantes: ${sem.map(i => MOTIVOS[i.k].nome).join(', ')}</div>` : ''}
    </div>`;
  };
  return `<div class="mpanel" data-new="motivos por situação">
    <div class="mph"><h3>Estudantes por motivo</h3>
      <span>${sub || 'percentual sobre o total de cada situação, no recorte selecionado'}</span></div>
    <div class="mgrps">${grupo('nao')}${grupo('indef')}</div>
    <div class="mnote">Uma matrícula pode ter mais de um critério; aqui ela conta pelo principal. Os demais aparecem no detalhe do estudante (👁).</div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   TELA — ELEGIBILIDADE
   Pedido das redes: a lista é o destaque. Os cartões viram filtro (M3).
   ══════════════════════════════════════════════════════════════════ */
function telaElegibilidade(){
  const j = state.janela ? jan(state.janela) : null;
  if (!j) state.altF = false;
  const anos = ciclosEmFoco(), anosC = anosRecorte();
  const r = redeAnos(anosC);

  /* Base: uma linha por matrícula-ciclo. A janela restringe às matrículas processadas
     nela; "só alteradas" (M6) restringe às que mudaram de situação nela. */
  const base = [];
  ALUNOS.forEach(a => anos.forEach(ano => {
    if (!a.sit[ano]) return;
    const m = j ? a.alt.find(x => x.jan === j.id && x.ciclo === ano) : null;
    if (state.altF && !m) return;
    base.push({a, ano, m});
  }));
  /* o motivo pertence a uma situação: trocar a situação limpa o motivo */
  if (state.motF && GRUPO_MOT[MOTIVOS[state.motF].g].sit !== state.sitF) state.motF = '';
  let lista = base.filter(x => casa(x.a, state.busca));
  if (state.mun) lista = lista.filter(x => x.a.mun === state.mun);
  if (state.sitF) lista = lista.filter(x => x.a.sit[x.ano] === state.sitF);
  if (state.motF) lista = lista.filter(x => motPrincipal(x.a, x.ano) === state.motF);

  /* total do recorte — o mesmo número dos cartões */
  const chave = {'Elegível':'eleg', 'Não elegível':'nao', 'Elegibilidade indefinida':'indef'}[state.sitF];
  let total, totMot;
  if (state.altF) {
    const cs = j.ciclos.filter(c => anosC.includes(c.ano));
    const alt = cs.reduce((s, c) => s + c.alteradas, 0), pe = cs.reduce((s, c) => s + c.paraElegivel, 0);
    totMot = {nao:alt - pe, indef:0};
    total = !state.sitF ? alt : state.sitF === 'Elegível' ? pe : state.sitF === 'Não elegível' ? alt - pe : 0;
  } else {
    totMot = {nao:r.nao, indef:r.indef};
    total = chave ? r[chave] : r.rede;
  }

/* ══════════════════════════════════════════════════════════════════
   TELA — PAGAMENTO
   Pedido das redes: lista em destaque; as situações deixam de ser 9 cartões
   coloridos (cor sem significado) e viram uma barra por categoria (pedido 3).
   ══════════════════════════════════════════════════════════════════ */
const SIT_PAG = [
  {k:'Pago', g:'ok', dica:'Parcela paga ao estudante.'},
  {k:'Depositados', g:'ok', dica:'Valor depositado na poupança do estudante; o saque segue as regras do incentivo.'},
  {k:'Em Análise MEC', g:'and', dica:'Em análise pelo MEC antes de seguir para pagamento.'},
  {k:'Em Processamento', g:'and', dica:'Sendo processada pelo agente pagador.'},
  {k:'Aguardando Pagamento', g:'and', dica:'Liberada, aguardando a data de pagamento.'},
  {k:'Bloqueados', g:'imp', dica:'Pagamento bloqueado — veja o motivo no detalhe do estudante.'},
  {k:'Rejeitados', g:'imp', dica:'Pagamento rejeitado pelo agente pagador.'},
  {k:'Suspensos', g:'imp', dica:'Pagamento suspenso.'}
];
/* a cor diz a CATEGORIA da situação, sempre com ícone e nome (nunca só a cor) */
const GRUPO_PAG = {
  ok:{rot:'Pago ou depositado', cor:'#168821', ico:'✓', desc:'chegou ao estudante'},
  and:{rot:'Em andamento', cor:'#C25400', ico:'◔', desc:'ainda vai ser pago'},
  imp:{rot:'Com impedimento', cor:'#E52207', ico:'!', desc:'precisa de ação'}
};
const SIT_FILTRAVEL = ['Pago', 'Aguardando Pagamento'];
function painelSituacao(cards){
  /* as situações sempre fecham com o total: o que não é pago, aguardando ou bloqueado
     está depositado (no consolidado da base, 96.999 parcelas que antes não apareciam) */
  const resto = cards.total - cards.pagos - cards.aguard - cards.bloq;
  const vResto = cards.vTotal - cards.vPagos - cards.vAguard - cards.bloq * 200;
  const v = {'Pago':[cards.pagos, cards.vPagos], 'Depositados':[resto, vResto], 'Aguardando Pagamento':[cards.aguard, cards.vAguard], 'Bloqueados':[cards.bloq, cards.bloq * 200]};
  const itens = SIT_PAG.map(s => ({...s, q:(v[s.k] || [0, 0])[0], val:(v[s.k] || [0, 0])[1]}));
  const pc = q => (q / cards.total * 100).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
  const grupo = g => {
    const G = GRUPO_PAG[g], its = itens.filter(i => i.g === g), com = its.filter(i => i.q > 0), sem = its.filter(i => !i.q);
    const q = its.reduce((s, i) => s + i.q, 0);
    return `<div class="sgrp" style="--gc:${G.cor}">
      <div class="sgh"><span class="sico">${G.ico}</span><b>${G.rot}</b><span class="sgd">${G.desc}</span><span class="sgq num">${pc(q)}</span></div>
      ${com.map(i => {
        const filt = SIT_FILTRAVEL.includes(i.k), on = state.sitPagF === i.k;
        const corpo = `<span class="snm">${i.k} <span class="info" title="${i.dica}">i</span></span><span class="sq num">${N(i.q)}</span><span class="sv num">${R$(i.val)}</span>`;
        return filt ? `<button class="srow ${on ? 'on' : ''}" aria-pressed="${on}" title="Mostrar só “${i.k}” na lista" onclick="state.sitPagF='${on ? '' : i.k}'; render(); rolarLista()">${corpo}</button>`
          : `<div class="srow">${corpo}</div>`;
      }).join('')}
      ${sem.length ? `<div class="szero">Sem parcelas: ${sem.map(i => i.k).join(', ')}</div>` : ''}
    </div>`;
  };
  return `<div class="spanel" data-new="situações por categoria">
    <div class="stop">
      <button class="stot ${!state.sitPagF ? 'on' : ''}" onclick="state.sitPagF=''; render()" title="Mostrar todas as situações">
        <span>Total de incentivos</span><b class="num">${N(cards.total)}</b><span class="num">${R$(cards.vTotal)}</span></button>
      <div class="sbarw">
        <div class="hbar" role="img" aria-label="Incentivos por categoria de situação">
          ${itens.filter(i => i.q > 0).map(i => `<span style="flex-grow:${i.q}; background:${GRUPO_PAG[i.g].cor}" title="${i.k}: ${N(i.q)} (${pc(i.q)})"></span>`).join('')}
        </div>
        <div class="sbleg">${Object.values(GRUPO_PAG).map(G => `<span><i style="background:${G.cor}"></i>${G.ico} ${G.rot}</span>`).join('')}</div>
      </div>
    </div>
    <div class="sgrps">${['ok', 'and', 'imp'].map(grupo).join('')}</div>
  </div>`;
}

    ${filtros()}

    <p class="kdica" data-new="instrução padronizada">Clique em um card para ver a lista de estudantes referente às parcelas.</p>
    ${painelSituacao(cards)}

    ${listHead('Parcelas', total, total === 1 ? 'parcela' : 'parcelas', pagina.length,
      (state.sitPagF ? `Situação: <b>${state.sitPagF}</b> · ` : '') + (j ? `${tv('Processamento de', 'Janela de processamento de')} ${j.rotulo}` : 'Todos os pagamentos da rede no recorte'))}
    ${searchbar(PH_BUSCA)}
    <div class="filters" style="margin-bottom:10px">
      <div class="field"><label>Filtrar por</label><select disabled><option>Bahia</option></select></div>
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-inc">Tipo de Incentivo</label>
        <select id="f-inc" onchange="state.incF=this.value; render()">
          <option value="">Todos</option>
          ${['Matrícula','Frequência','Conclusão','Enem'].map(s => `<option ${state.incF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="field"><label for="f-sitp">Situação</label>
        <select id="f-sitp" onchange="state.sitPagF=this.value; render()">

        </select></div>
    </div>
    ${chipsFiltros()}

    <div class="tbl-wrap">
      ${pagina.length === 0 ? `<div class="empty"><b>Nenhum pagamento encontrado</b>
        Revise a busca ou os filtros em uso, logo acima.</div>` : `

            const a = aluno(p.mat);
            return `<tr>
              <td><div class="prim">${a.nome}</div><div class="sec num">CPF: ${a.cpf}</div></td>

/* ══════════════════════════════════════════════════════════════════
   MODAL DE DETALHE DA MATRÍCULA
   M7 (entrevistas): trajetória do estudante — quando a situação mudou, de quê
   para quê, com o motivo, e as parcelas. Aberto pela linha de uma parcela, mostra
   essa parcela primeiro.
   ══════════════════════════════════════════════════════════════════ */
function abrirDetalhe(mat, parc){ state.modal = mat; state.modalParc = parc == null ? null : parc; renderModal(); }
function fecharDetalhe(){ state.modal = null; state.modalParc = null; renderModal(); }

function renderModal(){
  const box = document.getElementById('modal');
  if (!state.modal) { box.innerHTML = ''; return; }
  const a = aluno(state.modal);
  const ps = PARCELAS.filter(p => p.mat === a.mat);
  const pagas = ps.filter(p => p.sit === 'Pago');
  const valorP = p => MARCO[+String(p.cod).slice(4)].valor;
  const valor = pagas.reduce((s,p) => s + valorP(p), 0);
  const sel = state.modalParc != null ? PARCELAS[state.modalParc] : null;
  const pillSit = p => `<span class="pill ${p.sit==='Pago'?'ok':'wait'}">${p.sit}</span>`;

  /* linha do tempo: um marco por processamento em que algo aconteceu com o estudante */
  /* pedido das redes (04/11): do processamento mais recente para o mais antigo */
  const ids = [...new Set([...a.alt.map(x => x.jan), ...ps.map(p => p.jan)])].sort().reverse();
  const marcos = ids.map(id => {

/* ══════════════════════════════════════════════════════════════════
   PAINEL DE GESTÃO — visão gerencial (existe só neste link)

   Toda a base é derivada dos mesmos dados das telas operacionais:
   JANELAS (parcelas e valores de cada processamento × ciclo) e REDE (retrato
   do ciclo no último processamento). Os totais batem com as telas; a divisão
   por modalidade (EMR/EJA) e por município é distribuída de forma
   determinística, sempre fechando a soma exata (maior resto).
   ══════════════════════════════════════════════════════════════════ */

const PROCS = [...JANELAS].reverse();                 /* ordem cronológica: 0 = mar … 5 = ago */
const curtoD = j => j.rotulo.slice(0, 5);             /* 26/08 */
/* mês da frequência apurada em cada processamento (o pagamento sai dois meses depois) */
const MES_FREQ = {'2026-04-24':'fevereiro', '2026-05-26':'março', '2026-06-25':'abril', '2026-07-24':'maio', '2026-08-26':'junho'};
const INCS = ['Matrícula', 'Frequência', 'Conclusão', 'Enem'];
/* paletas conferidas com o validador de cor (contraste, daltonismo, separação) */
const COR_INC = {'Matrícula':'#D97A1E', 'Frequência':'#3F4FB8', 'Conclusão':'#C2417A', 'Enem':'#7A8B1E'};
const COR_MOD = {EMR:'#1351B4', EJA:'#C2417A'};
const COR_CIC = {2026:'#1351B4', 2025:'#00A0A8', 2024:'#8E44AD'};
const COR_SIT = {eleg:'#168821', outras:'#C25400', nao:'#48566B'};
const COR_FREQ = {acima:'#168821', abaixo:'#E52207', ni:'#9AA5B4'};


/* recortes territoriais: 12 maiores redes + demais (a Bahia tem 417 municípios) */
const MUNS = [
  {id:'Salvador', p:.170}, {id:'Feira de Santana', p:.046}, {id:'Vitória da Conquista', p:.034},
  {id:'Camaçari', p:.023}, {id:'Juazeiro', p:.020}, {id:'Itabuna', p:.017},
  {id:'Lauro de Freitas', p:.015}, {id:'Ilhéus', p:.014}, {id:'Jequié', p:.013},
  {id:'Teixeira de Freitas', p:.012}, {id:'Barreiras', p:.012}, {id:'Irecê', p:.007}
];
const DEMAIS = 'Demais municípios (405)';
MUNS.push({id:DEMAIS, p:1 - MUNS.reduce((s, m) => s + m.p, 0), demais:true});
const MODS = [{id:'EMR', nome:'Ensino Médio Regular', p:.918}, {id:'EJA', nome:'Educação de Jovens e Adultos', p:.082}];
const UNIDADES = [];
MODS.forEach(m => MUNS.forEach(u => UNIDADES.push({mod:m.id, mun:u.id, w:m.p * u.p})));

/* ruído determinístico: mesma entrada, mesmo número, sempre */
function ruido(...k){
  let h = 2166136261;
  for (const ch of k.join('|')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}
/* reparte um total inteiro por pesos, fechando a soma exata */
function aloca(total, pesos){
  const s = pesos.reduce((a, b) => a + b, 0);
  const bruto = pesos.map(p => total * p / s);
  const base = bruto.map(Math.floor);
  const resto = total - base.reduce((a, b) => a + b, 0);
  bruto.map((v, i) => ({i, f:v - base[i]})).sort((a, b) => b.f - a.f).slice(0, resto).forEach(x => base[x.i]++);
  return base;
}
/* o "jeito" de cada unidade, e as histórias que os insights vão encontrar */
function fator(u, pi, met){
  let f = .94 + ruido(u.mod, u.mun, met) * .12;
  const eja = u.mod === 'EJA';
  const MOD = {eleg:[1.01, .95], nao:[.97, 1.35], indef:[.9, 2.2], pend:[.95, 1.6], acima:[1.006, .93], freqPag:[1.01, .86],
               abaixo:[.86, 2.6], ni:[.9, 2.0], concPag:[1.02, .75], enemPag:[1.02, .75]};
  if (MOD[met]) f *= MOD[met][eja ? 1 : 0];
  if (u.mun === 'Jequié' && met === 'ni') f *= [1, 1, 1, 1, 9, 7][pi];                 /* envio falhou em jul e ago */
  if (u.mun === 'Jequié' && met === 'acima') f *= [1, 1, 1, 1, .93, .95][pi];
  if (u.mun === 'Juazeiro' && met === 'abaixo') f *= [1, 1, 1.2, 1.5, 1.85, 2.3][pi];   /* queda contínua */
  if (u.mun === 'Juazeiro' && (met === 'acima' || met === 'freqPag')) f *= [1, 1, .99, .975, .96, .94][pi];
  if (u.mun === 'Camaçari' && met === 'abaixo') f *= [1, 1, .85, .7, .6, .5][pi];       /* melhora contínua */
  if (u.mun === 'Camaçari' && met === 'acima') f *= [1, 1, 1.005, 1.01, 1.015, 1.02][pi];
  return f;
}

const GB = (function montarBase(){
  const dist = (total, met, pi) => aloca(total, UNIDADES.map(u => u.w * fator(u, pi, met)));

  /* Matrículas: parte do retrato final (REDE) e volta no tempo com as alterações
     de cada processamento (alteradas / paraElegivel de JANELAS). */
  const PEND = {2026:[3410, 2180, 1150, 420, 0, 0]};
  const matr = {};
  [2026, 2025, 2024].forEach(ano => {
    matr[ano] = {};
    const idx = PROCS.map((j, pi) => ({pi, c:j.ciclos.find(c => c.ano === ano)})).filter(x => x.c);
    const rede = REDE[ano].rede;
    let cur = {eleg:REDE[ano].eleg, pend:REDE[ano].pend, indef:REDE[ano].indef};
    for (let k = idx.length - 1; k >= 0; k--){
      const {pi, c} = idx[k];
      const tot = {...cur, nao:rede - cur.eleg - cur.pend - cur.indef};
      matr[ano][pi] = {};
      ['eleg', 'pend', 'indef', 'nao'].forEach(m => matr[ano][pi][m] = dist(tot[m], m, pi));
      /* M4 (entrevistas): a situação alterada aberta em "passaram a elegível" × "deixaram de ser" */
      matr[ano][pi].paraEl = dist(c.paraElegivel, 'eleg', pi);
      matr[ano][pi].deixou = dist(c.alteradas - c.paraElegivel, 'nao', pi);
      if (k > 0){
        const pendAnt = (PEND[ano] || [])[idx[k - 1].pi] || 0;
        cur = {eleg:cur.eleg - c.paraElegivel + (c.alteradas - c.paraElegivel) - (pendAnt - cur.pend),
               pend:pendAnt, indef:cur.indef + Math.round(c.paraElegivel * .5)};
      }
    }
  });

  /* Frequência do ciclo 2026, apurada de abril a agosto. O último ponto é o
     mesmo dos cartões da tela Início (313.613 · 27.834 · 823). */
  const PCT = [null, .889, .902, .909, .901, null];
  const NI = [null, 2410, 1380, 1020, 3950, 823];
  const freq = {};
  PROCS.forEach((j, pi) => {
    if (!MES_FREQ[j.id]) return;
    let acima, abaixo, ni;
    if (pi === PROCS.length - 1) { acima = 313613; abaixo = 27834; ni = 823; }
    else {
      const apur = matr[2026][pi].eleg.reduce((a, b) => a + b, 0);
      ni = NI[pi]; acima = Math.round(apur * PCT[pi]); abaixo = apur - acima - ni;
    }
    freq[pi] = {acima:dist(acima, 'acima', pi), abaixo:dist(abaixo, 'abaixo', pi), ni:dist(ni, 'ni', pi)};
  });

  /* Pagamento: exatamente as parcelas de JANELAS, repartidas por unidade */
  const MET = {'Matrícula':'matPag', 'Frequência':'freqPag', 'Conclusão':'concPag', 'Enem':'enemPag'};
  const pag = [];
  PROCS.forEach((j, pi) => j.ciclos.forEach(c => c.parcelas.forEach(p => {
    const inc = incDe(p.cod);
    pag.push({pi, ano:c.ano, inc, unit:p.valor / p.qtd, qtd:dist(p.qtd, MET[inc], pi)});
  })));
  return {matr, freq, pag};
})();

/* ── leitura da base no recorte ─────────────────────────────────── */
function gSel(mod = state.gMod, mun = state.gMun){
  return UNIDADES.map((u, i) => i).filter(i => (mod === 'geral' || UNIDADES[i].mod === mod) && (!mun || UNIDADES[i].mun === mun));
}
const somaS = (arr, sel) => sel.reduce((s, i) => s + arr[i], 0);
function gMatr(ano, pi, sel){
  const m = GB.matr[ano][pi]; if (!m) return null;
  const r = {eleg:somaS(m.eleg, sel), pend:somaS(m.pend, sel), indef:somaS(m.indef, sel), nao:somaS(m.nao, sel)};
  r.rede = r.eleg + r.pend + r.indef + r.nao;
  r.pct = r.rede ? r.eleg / r.rede * 100 : 0;
  r.paraEl = somaS(m.paraEl, sel); r.deixou = somaS(m.deixou, sel);
  return r;
}
function gFreq(pi, sel){
  const f = GB.freq[pi]; if (!f) return null;
  const r = {acima:somaS(f.acima, sel), abaixo:somaS(f.abaixo, sel), ni:somaS(f.ni, sel)};
  r.apur = r.acima + r.abaixo + r.ni;
  r.pct = r.apur ? r.acima / r.apur * 100 : 0;
  r.pctAb = r.apur ? r.abaixo / r.apur * 100 : 0;
  r.pctNi = r.apur ? r.ni / r.apur * 100 : 0;
  return r;
}
function gPag(pi, ano, sel){
  const r = {qtd:0, valor:0, inc:{}};
  INCS.forEach(k => r.inc[k] = {qtd:0, valor:0});
  GB.pag.filter(p => p.pi === pi && (ano === 'todos' || p.ano === ano)).forEach(p => {
    const q = somaS(p.qtd, sel);
    r.qtd += q; r.valor += q * p.unit; r.inc[p.inc].qtd += q; r.inc[p.inc].valor += q * p.unit;
  });
  return r;
}
const procsDoCiclo = ano => PROCS.map((j, pi) => pi).filter(pi => PROCS[pi].ciclos.some(c => c.ano === ano));
const procsFreq = () => PROCS.map((j, pi) => pi).filter(pi => GB.freq[pi]);

/* Processamento de referência: o escolhido no filtro ou, sem filtro, o último do ciclo.
   Indicadores, insights e tabelas-resumo leem tudo ATÉ a referência ("como estava
   naquela data"); os gráficos mostram a série inteira do ciclo, com a referência destacada. */
function gRefPi(){
  const ps = procsDoCiclo(+state.gCiclo);
  const i = state.gProc ? PROCS.findIndex(j => j.id === state.gProc) : -1;
  return ps.includes(i) ? i : ps[ps.length - 1];
}
const ateRef = pis => pis.filter(pi => pi <= gRefPi());
const psC = ano => ateRef(procsDoCiclo(ano));          /* processamentos do ciclo até a referência */
const psF = () => ateRef(procsFreq());                 /* apurações de frequência até a referência */
/* posição da referência numa série (o último ponto até ela); -1 se a série começa depois */
function destDe(pis){ const r = gRefPi(); let k = -1; pis.forEach((pi, i) => { if (pi <= r) k = i; }); return k; }
const refRot = () => PROCS[gRefPi()].rotulo;
const tagRef = () => `<span class="tag hl">${state.gProc ? 'selecionado' : 'mais recente'}</span>`;
function gSetProc(v){
  state.gProc = v;
  if (v && !anosDa(jan(v)).includes(+state.gCiclo)) state.gCiclo = String(anosDa(jan(v))[0]);
  state.gInsPag = 0; render();
}
function gSetCiclo(v){
  state.gCiclo = v;
  if (state.gProc && !anosDa(jan(state.gProc)).includes(+v)) state.gProc = '';
  state.gInsPag = 0; render();
}

/* ── formatos ───────────────────────────────────────────────────── */
const pct1 = v => v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const tP = () => tv('Processamento', 'Janela de processamento');
const tp = () => tv('processamento', 'janela de processamento');
const tps = () => tv('processamentos', 'janelas de processamento');
function gEixo(v, fmt){
  if (fmt === 'pct') return v.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
  const pre = fmt === 'brl' ? 'R$ ' : '', a = Math.abs(v);
  if (a >= 1e6) return pre + (v / 1e6).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mi';
  if (a >= 1e3) return pre + (v / 1e3).toLocaleString('pt-BR', {maximumFractionDigits:0}) + ' mil';
  return pre + v.toLocaleString('pt-BR');
}
const gFmt = (v, fmt) => v == null ? '—' : fmt === 'pct' ? pct1(v) : fmt === 'brl' ? R$(v) : N(v);
/* rótulos de dados (pedido do MEC: as redes tiram print dos gráficos para apresentações) */
function gRot(v, fmt, curtoDentro){
  if (fmt === 'pct') return pct1(v);
  const a = Math.abs(v), pre = fmt === 'brl' && !curtoDentro ? 'R$ ' : '';
  if (fmt === 'brl' || curtoDentro){
    if (a >= 1e6) return pre + (v / 1e6).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' mi';
    if (a >= 1e3) return pre + Math.round(v / 1e3) + ' mil';
  }
  return pre + N(v);
}
/* texto sobre a cor da barra: branco em cor escura, tinta escura em cor clara */
function tintaSobre(hex){
  const h = hex.replace('#', ''), c = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255)
    .map(u => u <= .03928 ? u / 12.92 : Math.pow((u + .055) / 1.055, 2.4));
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] > .36 ? '#16202E' : '#fff';
}
/* variações: "bom" pinta de verde; inverso = subir é ruim (ex.: abaixo de 80%) */
function dPP(v, inverso){
  if (v == null || isNaN(v)) return '';
  const r = Math.round(v * 10) / 10;
  if (!r) return '<span class="delta flat">=</span>';
  const bom = inverso ? r < 0 : r > 0;
  return `<span class="delta ${bom ? 'up' : 'down'}">${r > 0 ? '+' : '−'}${Math.abs(r).toLocaleString('pt-BR', {minimumFractionDigits:1})} p.p.</span>`;
}
function dN(v, money, inverso){
  if (v == null) return '<span class="delta flat">—</span>';
  if (!v) return '<span class="delta flat">=</span>';
  const bom = inverso ? v < 0 : v > 0;
  return `<span class="delta ${bom ? 'up' : 'down'}">${v > 0 ? '+' : '−'}${money ? R$(Math.abs(v)) : N(Math.abs(v))}</span>`;
}
function dPct(a, b){
  if (!a) return '';
  const v = (b - a) / a * 100, r = Math.round(v * 10) / 10;
  if (!r) return '<span class="delta flat">=</span>';
  return `<span class="delta ${r > 0 ? 'up' : 'down'}">${r > 0 ? '+' : '−'}${Math.abs(r).toLocaleString('pt-BR', {minimumFractionDigits:1})}%</span>`;
}

/* ── gráficos em SVG (sem biblioteca: o arquivo continua único) ──── */
function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
/* barra com a ponta arredondada e a base reta, apoiada na linha de base */
function barra(x, yb, w, h, r, cor){
  if (h <= .4) return '';
  r = Math.min(r, h, w / 2);
  const f = n => n.toFixed(1);
  return `<path d="M${f(x)},${f(yb)}V${f(yb - h + r)}Q${f(x)},${f(yb - h)} ${f(x + r)},${f(yb - h)}H${f(x + w - r)}Q${f(x + w)},${f(yb - h)} ${f(x + w)},${f(yb - h + r)}V${f(yb)}Z" fill="${cor}"/>`;
}
function gChart(o){
  const W = o.w || 560, H = o.h || 250, ml = 60, mr = 18, mt = 26, mb = 30;
  const rot = o.rotulos !== false, lw = t => t.length * 6.3;
  const iw = W - ml - mr, ih = H - mt - mb, n = o.cats.length;
  const barras = o.tipo === 'barras', emp = barras && o.empilhado;
  let vals = [];
  if (emp) vals = o.cats.map((_, i) => o.series.reduce((s, se) => s + (se.v[i] || 0), 0));
  else o.series.forEach(se => se.v.forEach(v => { if (v != null) vals.push(v); }));
  if (!vals.length) vals = [0];
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (barras || o.zero) lo = Math.min(0, lo);
  else {
    const pad = (hi - lo) * .35 || Math.abs(hi) * .04 || 1;
    lo -= pad; hi += pad;
    if (o.fmt === 'pct') { lo = Math.max(0, lo); hi = Math.min(100, hi); }
    if (lo < 0 && Math.min(...vals) >= 0) lo = 0;
  }
  if (hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step;
  const ticks = []; for (let t = lo; t <= hi + step / 1e6; t += step) ticks.push(+t.toFixed(6));
  const y = v => mt + ih - (v - lo) / (hi - lo) * ih;
  const bw = iw / n, x = i => ml + bw * i + bw / 2;
  let g = '';

  /* coluna destacada = processamento de referência (o último, se nada for escolhido) */
  const di = o.destaque === false ? -1 : (o.dest == null ? n - 1 : o.dest);
  if (di >= 0) g += `<rect x="${ml + bw * di}" y="${mt}" width="${bw}" height="${ih}" fill="#E8EFFA" opacity=".6"/>`;
  ticks.forEach(t => {
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#EDF1F7"/>`;
    g += `<text x="${ml - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" class="ax">${gEixo(t, o.fmt)}</text>`;
  });

  if (barras && emp){
    const w = Math.min(46, bw * .56);
    o.cats.forEach((_, i) => {
      const vis = o.series.filter(se => se.v[i] > 0);
      let acc = 0;
      vis.forEach((se, k) => {
        const y0 = y(acc) - (k ? 2 : 0);            /* 2px de respiro entre os segmentos */
        acc += se.v[i];
        const h = Math.max(0, y0 - y(acc));
        g += k === vis.length - 1 ? barra(x(i) - w / 2, y0, w, h, 4, se.cor)
          : (h > .4 ? `<rect x="${(x(i) - w / 2).toFixed(1)}" y="${(y0 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${se.cor}"/>` : '');
        const t = rot && vis.length > 1 ? gRot(se.v[i], o.fmt, true) : '';
        if (t && h >= 15 && lw(t) * .9 <= w - 2)
          g += `<text x="${x(i).toFixed(1)}" y="${(y0 - h / 2 + 3.8).toFixed(1)}" text-anchor="middle" class="dli" fill="${tintaSobre(se.cor)}">${t}</text>`;
      });
      if (rot && vis.length) g += `<text x="${x(i).toFixed(1)}" y="${(y(acc) - 7).toFixed(1)}" text-anchor="middle" class="dl">${gRot(acc, o.fmt)}</text>`;
    });
  } else if (barras){
    const ns = o.series.length, gap = 2, w = Math.min(24, (bw * .72 - gap * (ns - 1)) / ns);
    o.cats.forEach((_, i) => o.series.forEach((se, k) => {
      const v = se.v[i]; if (!v) return;
      const xx = x(i) - (ns * w + (ns - 1) * gap) / 2 + k * (w + gap);
      g += barra(xx, y(0), w, y(0) - y(v), 4, se.cor);
      if (rot) g += `<text x="${(xx + w / 2).toFixed(1)}" y="${(y(v) - 6).toFixed(1)}" text-anchor="middle" class="dl">${gRot(v, o.fmt, ns > 1)}</text>`;
    }));
  } else {
    o.series.forEach(se => {
      let d = '', pen = false;
      se.v.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      g += `<path d="${d}" fill="none" stroke="${se.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      se.v.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${se.cor}" stroke="#fff" stroke-width="2"/>`; });
    });
    if (rot) o.cats.forEach((_, i) => {
      /* por categoria, de cima para baixo: acima do ponto; se esbarrar no anterior, abaixo; senão, omite */
      const pts = o.series.map(se => se.v[i]).map((v, k) => ({v, k}))
        .filter(p => p.v != null && !(o.series.length > 1 && p.v === 0)).sort((a, b) => y(a.v) - y(b.v));
      const usados = [];
      pts.forEach(p => {
        const t = o.fmtRot ? o.fmtRot(p.v) : gRot(p.v, o.fmt), py = y(p.v);
        const ok = ty => ty > 10 && ty < mt + ih + 12 && usados.every(u => Math.abs(u - ty) >= 13);
        const ty = [py - 10, py + 19].find(ok);
        if (ty == null) return;
        usados.push(ty);
        g += `<text x="${x(i).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" class="dl">${t}</text>`;
      });
    });
  }
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y(lo)}" y2="${y(lo)}" stroke="#C5D4EB"/>`;
  o.cats.forEach((c, i) => g += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle" class="ax${i === di ? ' on' : ''}">${c.rot}</text>`);

  /* camada de hover: uma faixa por categoria, maior que a marca */
  o.cats.forEach((c, i) => {
    const linhas = o.series.map(se => se.v[i] == null ? ''
      : `<div class="tr"><i style="background:${se.cor}"></i><span>${se.nome}</span><b>${gFmt(se.v[i], o.fmt)}</b></div>`).join('');
    const tot = emp && o.series.length > 1
      ? `<div class="tr tot"><span>Total</span><b>${gFmt(o.series.reduce((s, se) => s + (se.v[i] || 0), 0), o.fmt)}</b></div>` : '';
    const tip = `<div class="th">${c.tip}</div>${linhas}${tot}${c.nota ? `<div class="tn">${c.nota}</div>` : ''}`;
    g += `<g class="hcol" data-tip="${esc(tip)}">
      <rect class="bd" x="${(ml + bw * i).toFixed(1)}" y="${mt}" width="${bw.toFixed(1)}" height="${ih + mb}"/>
      ${barras ? '' : `<line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${mt}" y2="${mt + ih}" stroke="#48566B"/>`}</g>`;
  });
  return `<svg class="gsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${g}</svg>`;
}
function spark(v, cor){
  const W = 96, H = 28, p = 4, vs = v.filter(x => x != null);
  if (vs.length < 2) return '';
  const lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1;
  const pts = v.map((x, i) => x == null ? null : [p + i * (W - 2 * p) / (v.length - 1), H - p - (x - lo) / r * (H - 2 * p)]).filter(Boolean);
  const u = pts[pts.length - 1];
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <polyline points="${pts.map(q => q.map(k => k.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${cor}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${u[0].toFixed(1)}" cy="${u[1].toFixed(1)}" r="3" fill="${cor}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
function legenda(itens){

}

/* ── insights (simulação de geração por IA) ─────────────────────── */
const TIPOS = {
  alerta:{rot:'Alerta', ico:'!', ord:0}, atencao:{rot:'Atenção', ico:'●', ord:1},
  info:{rot:'Informativo', ico:'i', ord:2}, positivo:{rot:'Positivo', ico:'✓', ord:3}
};
function nomeRecorte(){
  const mod = state.gMod === 'geral' ? 'EMR + EJA' : state.gMod;
  return `ciclo ${state.gCiclo} · ${mod} · ${state.gMun || 'rede estadual'} · até ${refRot()}`;
}
function serieFreqMun(mun, sel){
  return psF().map(pi => gFreq(pi, sel || gSel(state.gMod, mun)));
}
/* Os insights leem só o que existia até o processamento de referência. */
function gInsights(){
  const ano = +state.gCiclo, sel = gSel(), ps = psC(ano), fps = psF();
  const L = ps[ps.length - 1], P = ps[ps.length - 2], jl = PROCS[L];
  const onde = state.gMun ? ` em ${state.gMun}` : '';
  const out = [];
  const munsReais = MUNS.filter(m => !m.demais && (!state.gMun || m.id === state.gMun));

  /* 1. queda contínua da frequência num município */
  if (ano === 2026 && fps.length >= 4){
    let pior = null;
    munsReais.forEach(m => {
      const s = serieFreqMun(m.id);
      let k = 0; for (let i = s.length - 1; i > 0 && s[i].pct < s[i - 1].pct - .05; i--) k++;
      if (k >= 3 && (!pior || k > pior.k || (k === pior.k && s[0].pct - s[s.length - 1].pct > pior.queda)))
        pior = {m, s, k, queda:s[s.length - 1 - k].pct - s[s.length - 1].pct};
    });
    if (pior){
      const s = pior.s, a = s[s.length - 1 - pior.k], b = s[s.length - 1];
      out.push({id:'queda-' + pior.m.id, tipo:'alerta',
        tit:`${pior.m.id}: frequência em queda há ${pior.k} ${tps()} seguidos`,
        txt:`A parcela de matrículas com frequência igual ou acima de 80% caiu de <b>${pct1(a.pct)}</b> para <b>${pct1(b.pct)}</b>
          (${dPP(b.pct - a.pct)}). Estudantes abaixo de 80% passaram de ${N(a.abaixo)} para <b>${N(b.abaixo)}</b>. Vale acionar as escolas do município antes da próxima apuração.`,
        base:[`Frequência ≥ 80% em ${pior.m.id}, ${tps()} de ${fps.map(pi => curtoD(PROCS[pi])).join(', ')}: ${s.map(x => pct1(x.pct)).join(' → ')}`,
              `Abaixo de 80%: ${s.map(x => N(x.abaixo)).join(' → ')}`, `Regra: queda em 3 ou mais ${tps()} consecutivos`],
        acao:{rot:`Ver ${pior.m.id} no painel`, js:`state.gMun='${pior.m.id}'; state.gAba='frequencia'; state.gInsPag=0; render()`}});
    }
  }

  /* 2. frequência não informada concentrada num município */
  if (ano === 2026 && fps.length >= 2){
    const fl = fps[fps.length - 1], fp = fps[fps.length - 2];
    const rede = gFreq(fl, gSel(state.gMod, ''));
    let top = null;
    munsReais.forEach(m => {
      const a = gFreq(fp, gSel(state.gMod, m.id)), b = gFreq(fl, gSel(state.gMod, m.id));
      const x = b.pctNi / (rede.pctNi || 1);
      if (x >= 3 && a.pctNi / (rede.pctNi || 1) >= 3 && (!top || x > top.x)) top = {m, a, b, x};
    });
    if (top) out.push({id:'ni-' + top.m.id, tipo:'atencao',
      tit:`${top.m.id}: frequência não informada ${Math.round(top.x)}× acima da média`,
      txt:`Pelo segundo ${tp()} seguido, ${top.m.id} concentra frequência <b>não informada</b>: ${pct1(top.b.pctNi)} das matrículas
        (${N(top.b.ni)}), contra ${pct1(rede.pctNi)} na rede. O padrão sugere <b>falha no envio de dados pelas escolas</b>, e não ausência dos estudantes.`,
      base:[`Não informada em ${top.m.id}: ${pct1(top.a.pctNi)} em ${PROCS[fp].rotulo} e ${pct1(top.b.pctNi)} em ${PROCS[fl].rotulo}`,
            `Média da rede em ${PROCS[fl].rotulo}: ${pct1(rede.pctNi)}`, 'Regra: 3× a média em dois ' + tps() + ' seguidos'],
      acao:{rot:'Ver ranking de municípios', js:`state.gAba='municipios'; state.gOrd='ni'; render()`}});
  }

  /* 4. processamento que pagou outros ciclos */
  if (jl.ciclos.length > 1){
    const outros = jl.ciclos.map(c => c.ano).filter(a => a !== ano);
    const vO = outros.reduce((s, a) => s + gPag(L, a, sel).valor, 0), vC = gPag(L, ano, sel).valor;
    const quem = state.gProc ? tv(`O processamento de ${jl.rotulo}`, `A janela de processamento de ${jl.rotulo}`)
                             : tv('O último processamento', 'A última janela de processamento');
    out.push({id:'multi', tipo:'info',
      tit:`${quem} pagou também ${outros.length > 1 ? 'os ciclos' : 'o ciclo'} ${outros.join(' e ')}`,
      txt:`Em ${jl.rotulo}, além de ${curto(vC)} para o ciclo ${ano}, foram liberados <b>${curto(vO)}</b> para ${outros.length > 1 ? 'os ciclos' : 'o ciclo'} ${outros.join(' e ')}${onde}.
        Com o filtro só no ciclo ${ano}, esse valor não aparece — é ${pct1(vO / (vO + vC) * 100)} do que saiu ${tv('neste processamento', 'nesta janela de processamento')}.`,
      base:jl.ciclos.map(c => `Ciclo ${c.ano}: ${R$(gPag(L, c.ano, sel).valor)}`),
      acao:{rot:`Abrir ${tv('o processamento', 'a janela de processamento')} de ${jl.rotulo}`, js:`ir('#/janela/${jl.id}')`}});
  }

  /* 5. variação do valor liberado entre os dois últimos processamentos */
  if (P != null && ano === 2026){
    const a = gPag(P, 'todos', sel), b = gPag(L, 'todos', sel);
    const d = b.valor - a.valor;
    const porCiclos = PROCS[L].ciclos.length > PROCS[P].ciclos.length;
    out.push({id:'valor', tipo:'info',
      tit:`${curtoD(PROCS[L])} liberou ${curto(Math.abs(d))} ${d >= 0 ? 'a mais' : 'a menos'} que ${curtoD(PROCS[P])}`,
      txt:`Somando todos os ciclos${onde}, ${PROCS[L].rotulo} liberou <b>${R$(b.valor)}</b>, contra ${R$(a.valor)} em ${PROCS[P].rotulo}
        (${dPct(a.valor, b.valor)}).${porCiclos ? ` A diferença vem sobretudo de ciclos anteriores pagos agora, e não de mais estudantes no ciclo ${ano}.` : ''}`,
      base:[`Valor em ${PROCS[P].rotulo}: ${R$(a.valor)}`, `Valor em ${PROCS[L].rotulo}: ${R$(b.valor)}`],
      acao:{rot:'Ver aba Ciclos', js:`state.gAba='ciclos'; render()`}});
  }

  /* 6. elegibilidade e pendência bancária */
  if (ps.length > 1){
    const m = ps.map(pi => gMatr(ano, pi, sel)), a = m[0], b = m[m.length - 1];
    const zerou = m.findIndex((x, i) => i > 0 && x.pend === 0 && m[0].pend > 0);
    const dp = Math.round((b.pct - a.pct) * 10) / 10;
    out.push({id:'eleg', tipo:dp >= 0 ? 'positivo' : 'atencao',
      tit:`Elegibilidade ${dp >= 0 ? 'subiu' : 'caiu'} ${N(Math.abs(dp))} p.p. no ciclo ${ano}`,
      txt:`Desde ${PROCS[ps[0]].rotulo}, ${b.eleg >= a.eleg ? 'mais' : 'menos'} <b>${N(Math.abs(b.eleg - a.eleg))}</b> matrículas elegíveis${onde} (${pct1(a.pct)} → <b>${pct1(b.pct)}</b>).
        ${zerou > 0 ? `A pendência bancária, que era de ${N(a.pend)}, está <b>zerada desde ${PROCS[ps[zerou]].rotulo}</b>.` : ''}`,
      base:[`Elegíveis: ${m.map(x => pct1(x.pct)).join(' → ')}`, `Pendência bancária: ${m.map(x => N(x.pend)).join(' → ')}`],
      acao:{rot:'Ver aba Elegibilidade', js:`state.gAba='elegibilidade'; render()`}});
  }

  return out.sort((a, b) => TIPOS[a.tipo].ord - TIPOS[b.tipo].ord);
}

/* ── filtros, indicadores e abas ────────────────────────────────── */
function gFiltros(){
  const seg = (chave, ops) => `<div class="gseg" role="group">${ops.map(([v, t, dica]) =>
    `<button aria-pressed="${state[chave] === v}" ${dica ? `title="${dica}"` : ''} onclick="state.${chave}='${v}'; state.gInsPag=0; render()">${t}</button>`).join('')}</div>`;
  /* processamento (pai) × ciclo (filho), dependentes nos dois sentidos — como nas listagens */
  const opsP = JANELAS.filter(j => anosDa(j).includes(+state.gCiclo));

function gKpis(){

/* Motivos no recorte do painel (ciclo, modalidade, município, processamento de referência).
   A linha abre a lista de Elegibilidade já filtrada só quando os números são os mesmos dela:

    ? `irCom('#/elegibilidade', {ciclo:'${ano}', sitF:'${G.sit}', motF:'${k}'})` : '';

function gAbaCiclos(){

          <td>${pillCiclo(a)}</td><td class="r num">${N(m.rede)}</td><td class="r num">${N(m.eleg)}</td><td class="r num">${pct1(m.pct)}</td>
          <td style="white-space:normal; min-width:150px">${ps.map(pi => curtoD(PROCS[pi])).join(' · ')} <span style="color:var(--ink-3)">(${ps.length})</span></td>

      </tbody>
    </table></div>
    ${gExport('Retrato por ciclo')}`;

function gAbaMunicipios(){
  const ano = +state.gCiclo, ps = psC(ano), L = ps[ps.length - 1];
  const fps = psF(), temF = ano === 2026 && fps.length > 0, fl = fps[fps.length - 1], fp = fps[fps.length - 2];
  const redeNi = temF ? gFreq(fl, gSel(state.gMod, '')).pctNi : 0;
  const naAmostra = new Set(ALUNOS.map(a => a.mun));
  let rows = MUNS.map(mu => {
    const sel = gSel(state.gMod, mu.id), m = gMatr(ano, L, sel);
    const s = temF ? fps.map(pi => gFreq(pi, sel)) : [];
    const v = ps.reduce((t, pi) => t + gPag(pi, ano, sel).valor, 0);
    let k = 0; for (let i = s.length - 1; i > 0 && s[i].pct < s[i - 1].pct - .05; i--) k++;   /* quedas seguidas */
    return {mu, m, s, v, k, f:s[s.length - 1], d:s.length > 1 ? s[s.length - 1].pct - s[s.length - 2].pct : null};
  });
  const ORD = {
    queda:(a, b) => (a.d || 0) - (b.d || 0), ni:(a, b) => (b.f ? b.f.pctNi : 0) - (a.f ? a.f.pctNi : 0),
    freq:(a, b) => (a.f ? a.f.pct : 0) - (b.f ? b.f.pct : 0), valor:(a, b) => b.v - a.v, nome:(a, b) => a.mu.id.localeCompare(b.mu.id, 'pt-BR')
  };
  const ordem = !temF && ['queda', 'ni', 'freq'].includes(state.gOrd) ? 'valor' : state.gOrd;
  rows = rows.filter(r => !r.mu.demais).sort(ORD[ordem]).concat(rows.filter(r => r.mu.demais));
  return `
    <div class="gbar"><h3>Ranking de municípios — ciclo ${ano}</h3>
      <span class="act"><label class="flbl" for="g-ord" style="font-size:13px; color:var(--ink-2)">Ordenar por</label>
        <select id="g-ord" onchange="state.gOrd=this.value; render()">
          ${(temF ? [['queda', 'Maior queda de frequência'], ['ni', 'Maior frequência não informada'], ['freq', 'Menor frequência ≥ 80%']] : [])
            .concat([['valor', 'Maior valor liberado'], ['nome', 'Nome']]).map(([v, t]) => `<option value="${v}" ${ordem === v ? 'selected' : ''}>${t}</option>`).join('')}
        </select></span></div>
    <div class="tbl-wrap"><table class="gtbl cmp">
      <thead><tr><th>Município</th><th class="r">Matrículas na rede</th><th class="r">% elegível</th>
        ${temF ? `<th class="r">Frequência ≥ 80%</th><th class="r">Δ vs. anterior</th><th>Tendência (${curtoD(PROCS[fps[0]])} a ${curtoD(PROCS[fl])})</th><th class="r">Não informada</th>` : ''}
        <th class="r" title="Soma das parcelas do ciclo ${ano} liberadas ${tv('nos processamentos', 'nas janelas de processamento')} até ${refRot()}">Valor liberado acumulado</th><th></th></tr></thead>
      <tbody>${rows.map(r => {
        const alerta = temF && ((r.d != null && r.d <= -1) || r.k >= 3), aten = temF && fps.length > 1 && r.f.pctNi >= redeNi * 3;
        return `<tr class="${r.mu.demais ? 'dim' : ''} ${state.gMun === r.mu.id ? 'sel' : ''}">
          <td><b>${r.mu.id}</b>${alerta ? '<span class="tag al">▼ queda</span>' : ''}${aten ? '<span class="tag at">● não informada</span>' : ''}</td>
          <td class="r num">${N(r.m.rede)}</td><td class="r num">${pct1(r.m.pct)}</td>
          ${temF ? `<td class="r num"><b>${pct1(r.f.pct)}</b></td><td class="r">${r.d == null ? semDelta : dPP(r.d)}</td>
            <td>${spark(r.s.map(x => x.pct), alerta ? '#E52207' : '#3F4FB8')}</td><td class="r num">${pct1(r.f.pctNi)}</td>` : ''}
          <td class="r num" title="${R$(r.v)}">${curto(r.v)}</td>
          <td class="r"><div class="acoes-col">${r.mu.demais ? '' : `<button class="lnk" onclick="state.gMun='${r.mu.id}'; state.gAba='${temF ? 'frequencia' : 'elegibilidade'}'; state.gInsPag=0; render(); scrollTo({top:0})" title="Aplica este município como filtro do painel">Filtrar</button>`}
            ${naAmostra.has(r.mu.id) && temF ? `<button class="lnk" title="Abre a listagem de Frequência filtrada por este município" onclick="irCom('#/frequencia', {mun:'${r.mu.id}', ciclo:'2026', janela:'${state.gProc}'})">Ver estudantes</button>` : ''}</div></td></tr>`;
      }).join('')}</tbody>
    </table></div>
    ${temF && fp != null ? `<p class="gctx" style="margin-top:10px">▼ queda = frequência ≥ 80% caiu 1 p.p. ou mais desde ${tv('o processamento anterior', 'a janela de processamento anterior')} (${PROCS[fp].rotulo}), ou caiu em 3 ou mais ${tps()} seguidos. ● não informada = 3× ou mais a média da rede (${pct1(redeNi)}).</p>` : ''}
    ${gExport('Indicadores por município')}`;
}

const GABAS = [
  ['elegibilidade', 'Elegibilidade', gAbaElegibilidade], ['frequencia', 'Frequência', gAbaFrequencia], ['pagamento', 'Pagamento', gAbaPagamento],
  ['ciclos', 'Ciclos', gAbaCiclos], ['municipios', 'Municípios', gAbaMunicipios]
];
function telaGestao(){
  const ano = +state.gCiclo, ps = procsDoCiclo(ano);
  const aba = GABAS.find(a => a[0] === state.gAba) || GABAS[0];
  return {
    crumbs:[{txt:'Painel de Gestão'}],
    html:`
    <div class="page-head">
      <div><h1>Painel de Gestão</h1>
        <div class="sub">A evolução dos indicadores da rede ao longo dos ${tps()}, para acompanhar tendências, comparar recortes e decidir onde agir.
          Complementa as telas de consulta — cada número leva à tela onde estão os estudantes.</div></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>
    ${gFiltros()}
    <div class="gctx">Rede estadual — Bahia · ciclo <b>${ano}</b> · <b>${ps.length}</b> ${ps.length === 1 ? tp() : tps()}
      ${ps.length > 1 ? `de ${PROCS[ps[0]].rotulo} a ${PROCS[ps[ps.length - 1]].rotulo}` : `em ${PROCS[ps[0]].rotulo}`}
      · ${state.gMod === 'geral' ? 'EMR + EJA' : MODS.find(m => m.id === state.gMod).nome}
      · indicadores e insights ${state.gProc ? `<b>${tv('no processamento', 'na janela de processamento')} de ${refRot()}</b> <button class="btn sm" style="padding:1px 9px; margin-left:4px" onclick="gSetProc('')">voltar ao mais recente</button>` : `${tv('no último processamento', 'na última janela de processamento')} (${refRot()})`}${state.gMun ? ` · <b>${state.gMun}</b> <button class="btn sm" style="padding:1px 9px; margin-left:4px" onclick="state.gMun=''; state.gInsPag=0; render()">limpar município</button>` : ''}</div>
    ${gKpis()}
    ${gInsightsHTML()}
    <div class="tabs" data-new="abas do painel">
      ${GABAS.map(([id, nome]) => `<button class="${aba[0] === id ? 'on' : ''}" onclick="state.gAba='${id}'; render()">${nome}</button>`).join('')}
    </div>
    ${aba[2]()}`
  };
}

function render(){
  const telas = {
    inicio: telaInicio,
    elegibilidade: telaElegibilidade,
    frequencia: telaFrequencia,
    pagamento: telaPagamento,
    processamentos: telaProcessamentos,
    janela: telaJanela,
    gestao: telaGestao
  };
  const t = (telas[state.rota] || telaInicio)();

  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('crumbs').innerHTML = crumbsHTML(t.crumbs);
  document.getElementById('app').innerHTML = t.html + `
    <div class="foot">
      <span>Protótipo de proposta — Painel de Gestão</span><span>·</span>
      <span>Dados ilustrativos, ancorados nas telas atuais do Portal do Usuário</span><span>·</span>
      <span>Painel de Gestão: Revisão 2 — novembro de 2026</span><span>·</span>
      <span>Demais telas: base da Revisão 5 do protótipo de ${nomeProc().toLowerCase()}</span>
    </div>`;
  renderModal();
}

lerHash();
</script>

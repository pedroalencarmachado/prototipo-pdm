        <td class="r">${i ? dPP(x.pct - f[i - 1].pct) : '<span class="delta flat">—</span>'}</td>
        <td class="r">${i ? dN(x.abaixo - f[i - 1].abaixo, false, true) : '<span class="delta flat">—</span>'}</td>
        <td class="r">${i ? dN(x.ni - f[i - 1].ni, false, true) : '<span class="delta flat">—</span>'}</td></tr>`).join('')}</tbody>
    </table></div>
    ${gExport('Frequência por ' + tp())}`;
}

function gAbaPagamento(){
  const ano = +state.gCiclo, sel = gSel(), ps = procsDoCiclo(ano);
  const pg = ps.map(pi => gPag(pi, ano, sel)), cats = catsDe(ps);
  const incs = INCS.filter(k => pg.some(p => p.inc[k].qtd));
  const ser = incs.map(k => ({nome:k, cor:COR_INC[k], v:pg.map(p => p.inc[k].qtd || null)}));
  let acc = 0;
  return `
    <div class="gnote">Parcelas e valores liberados <b>ao ciclo ${ano}</b>. ${tv('Um processamento', 'Uma janela de processamento')} pode liberar parcelas de outros ciclos ao mesmo tempo — para ver tudo o que saiu em cada ${tp()}, use a aba <b>Ciclos</b>.</div>
    <div class="gcards">
      ${gCard('Parcelas liberadas por incentivo', `por ${tp()} · ciclo ${ano}`,
        legenda(ser, state.gEventos) + gChart({tipo:state.gTipo, empilhado:true, cats, series:ser, fmt:'num', eventos:state.gEventos,
          aria:'Parcelas por incentivo em cada ' + tp()}))}
      ${gCard('Valor liberado', `em reais, por ${tp()} · ciclo ${ano}`,
        legenda([{nome:'Valor liberado', cor:'#7A8B1E'}], state.gEventos) + gChart({tipo:'linhas', cats, fmt:'brl', eventos:state.gEventos, rotuloFinal:true, zero:true,
          fmtRot:curto, series:[{nome:'Valor liberado', cor:'#7A8B1E', v:pg.map(p => p.valor)}], aria:'Valor liberado por ' + tp()}))}
    </div>
    <div class="gbar"><h3>Tabela comparativa — Pagamentos</h3>
      <span class="act"><button class="btn sm" onclick="state.ciclo='${ano}'; state.janela=''; ir('#/pagamento')">Abrir Visualizar Pagamentos →</button></span></div>
    <div class="tbl-wrap"><table class="gtbl">
      <thead><tr><th>${tP()}</th>${INCS.map(k => `<th class="r">${k}</th>`).join('')}<th class="r">Total de parcelas</th>
        <th class="r">Valor liberado</th><th class="r">Δ Valor</th><th class="r">Acumulado no ciclo</th></tr></thead>
      <tbody>${pg.map((p, i) => { acc += p.valor; return `<tr class="${i === pg.length - 1 ? 'hl' : ''}">
        <td>${PROCS[ps[i]].rotulo}${i === pg.length - 1 ? rotUlt : ''}</td>
        ${INCS.map(k => `<td class="r num">${p.inc[k].qtd ? N(p.inc[k].qtd) : '<span style="color:var(--ink-3)">—</span>'}</td>`).join('')}
        <td class="r num">${N(p.qtd)}</td><td class="r num"><b>${R$(p.valor)}</b></td>
        <td class="r">${i ? dN(p.valor - pg[i - 1].valor, true) : '<span class="delta flat">—</span>'}</td>
        <td class="r num">${R$(acc)}</td></tr>`; }).join('')}</tbody>
    </table></div>
    <p class="gctx" style="margin-top:10px">“—” = incentivo sem parcela liberada ${tv('naquele processamento', 'naquela janela de processamento')}.</p>
    ${gExport('Pagamentos por ' + tp())}`;
}

function gAbaCiclos(){
  const sel = gSel(), anos = [2026, 2025, 2024], pis = PROCS.map((j, i) => i), cats = catsDe(pis);
  const ser = anos.map(a => ({nome:'Ciclo ' + a, cor:COR_CIC[a], v:pis.map(pi => gPag(pi, a, sel).valor || null)}));
  const cum = anos.map(a => { let s = 0; return {nome:'Ciclo ' + a, cor:COR_CIC[a], v:pis.map(pi => s += gPag(pi, a, sel).valor)}; });
  const totGeral = anos.reduce((s, a) => s + pis.reduce((t, pi) => t + gPag(pi, a, sel).valor, 0), 0);
  const ult = PROCS[PROCS.length - 1];
  return `
    <div class="gnote">Esta aba mostra <b>todos os ciclos</b> lado a lado — o filtro de ciclo não se aplica aqui. A leitura por ${tp()} mostra quando cada ciclo recebeu pagamento.</div>
    <div class="gcards">
      ${gCard('Valor liberado por ciclo afetado', `por ${tp()} · todos os ciclos`,
        legenda(ser, state.gEventos) + gChart({tipo:state.gTipo, empilhado:true, cats, series:ser, fmt:'brl', eventos:state.gEventos,
          aria:'Valor liberado por ciclo em cada ' + tp()}))}
      ${gCard('Valor acumulado em 2026, por ciclo', `soma dos ${tps()} até cada data`,
        legenda(cum, state.gEventos) + gChart({tipo:'linhas', cats, series:cum, fmt:'brl', zero:true, eventos:state.gEventos,
          aria:'Valor acumulado por ciclo'}))}
    </div>
    <div class="gbar"><h3>Retrato por ciclo</h3>
      <span class="act"><button class="btn new sm" onclick="ir('#/janela/${ult.id}')">${tv('Ver o processamento de', 'Ver a janela de processamento de')} ${ult.rotulo} →</button></span></div>
    <div class="tbl-wrap"><table class="gtbl">
      <thead><tr><th>Ciclo</th><th class="r">Matrículas na rede</th><th class="r">Elegível</th><th class="r">% elegível</th>
        <th>Afetado ${tv('nos processamentos de', 'nas janelas de processamento de')}</th><th class="r">Parcelas liberadas em 2026</th><th class="r">Valor liberado em 2026</th><th class="r">Participação no valor</th></tr></thead>
      <tbody>${anos.map(a => {
        const ps = procsDoCiclo(a), m = gMatr(a, ps[ps.length - 1], sel);
        const q = ps.reduce((s, pi) => s + gPag(pi, a, sel).qtd, 0), v = ps.reduce((s, pi) => s + gPag(pi, a, sel).valor, 0);
        return `<tr class="${String(a) === state.gCiclo ? 'sel' : ''}">
          <td>${pillCiclo(a)}</td><td class="r num">${N(m.rede)}</td><td class="r num">${N(m.eleg)}</td><td class="r num">${pct1(m.pct)}</td>
          <td style="white-space:normal; min-width:150px">${ps.map(pi => curtoD(PROCS[pi])).join(' · ')} <span style="color:var(--ink-3)">(${ps.length})</span></td>
          <td class="r num">${N(q)}</td><td class="r num"><b>${R$(v)}</b></td><td class="r num">${pct1(v / totGeral * 100)}</td></tr>`; }).join('')}
      </tbody>
    </table></div>
    ${gExport('Retrato por ciclo')}`;
}

function gAbaMunicipios(){
  const ano = +state.gCiclo, ps = procsDoCiclo(ano), L = ps[ps.length - 1];
  const temF = ano === 2026, fps = procsFreq(), fl = fps[fps.length - 1], fp = fps[fps.length - 2];
  const redeNi = temF ? gFreq(fl, gSel(state.gMod, '')).pctNi : 0;
  const naAmostra = new Set(ALUNOS.map(a => a.mun));
  let rows = MUNS.map(mu => {
    const sel = gSel(state.gMod, mu.id), m = gMatr(ano, L, sel);
    const s = temF ? fps.map(pi => gFreq(pi, sel)) : [];
    const v = ps.reduce((t, pi) => t + gPag(pi, ano, sel).valor, 0);
    let k = 0; for (let i = s.length - 1; i > 0 && s[i].pct < s[i - 1].pct - .05; i--) k++;   /* quedas seguidas */
    return {mu, m, s, v, k, f:s[s.length - 1], d:temF ? s[s.length - 1].pct - s[s.length - 2].pct : 0};
  });
  const ORD = {
    queda:(a, b) => a.d - b.d, ni:(a, b) => (b.f ? b.f.pctNi : 0) - (a.f ? a.f.pctNi : 0),
    freq:(a, b) => (a.f ? a.f.pct : 0) - (b.f ? b.f.pct : 0), valor:(a, b) => b.v - a.v, nome:(a, b) => a.mu.id.localeCompare(b.mu.id, 'pt-BR')
  };
  const ordem = !temF && ['queda', 'ni', 'freq'].includes(state.gOrd) ? 'valor' : state.gOrd;
  rows = rows.filter(r => !r.mu.demais).sort(ORD[ordem]).concat(rows.filter(r => r.mu.demais));
  return `
    <div class="gnote">Os ${MUNS.length - 1} municípios com as maiores redes estaduais, mais o agregado dos demais. ${state.gMun ? `<b>${state.gMun}</b> está destacado. ` : ''}O filtro de município não se aplica a esta aba; o de modalidade e o de ciclo, sim.</div>
    <div class="gbar"><h3>Ranking de municípios — ciclo ${ano}</h3>
      <span class="act"><label class="flbl" for="g-ord" style="font-size:13px; color:var(--ink-2)">Ordenar por</label>
        <select id="g-ord" onchange="state.gOrd=this.value; render()">
          ${(temF ? [['queda', 'Maior queda de frequência'], ['ni', 'Mais frequência não informada'], ['freq', 'Menor frequência ≥ 80%']] : [])
            .concat([['valor', 'Maior valor liberado'], ['nome', 'Nome']]).map(([v, t]) => `<option value="${v}" ${ordem === v ? 'selected' : ''}>${t}</option>`).join('')}
        </select></span></div>
    <div class="tbl-wrap"><table class="gtbl cmp">
      <thead><tr><th>Município</th><th class="r">Matrículas na rede</th><th class="r">% elegível</th>
        ${temF ? `<th class="r">Frequência ≥ 80%</th><th class="r">Δ vs. anterior</th><th>Tendência (${curtoD(PROCS[fps[0]])} a ${curtoD(PROCS[fl])})</th><th class="r">Não informada</th>` : ''}
        <th class="r">Valor liberado ao ciclo</th><th></th></tr></thead>
      <tbody>${rows.map(r => {
        const alerta = temF && (r.d <= -1 || r.k >= 3), aten = temF && r.f.pctNi >= redeNi * 3;
        return `<tr class="${r.mu.demais ? 'dim' : ''} ${state.gMun === r.mu.id ? 'sel' : ''}">
          <td><b>${r.mu.id}</b>${alerta ? '<span class="tag al">▼ queda</span>' : ''}${aten ? '<span class="tag at">● não informada</span>' : ''}</td>
          <td class="r num">${N(r.m.rede)}</td><td class="r num">${pct1(r.m.pct)}</td>
          ${temF ? `<td class="r num"><b>${pct1(r.f.pct)}</b></td><td class="r">${dPP(r.d)}</td>
            <td>${spark(r.s.map(x => x.pct), alerta ? '#E52207' : '#3F4FB8')}</td><td class="r num">${pct1(r.f.pctNi)}</td>` : ''}
          <td class="r num" title="${R$(r.v)}">${curto(r.v)}</td>
          <td class="r" style="white-space:nowrap">${r.mu.demais ? '' : `<button class="lnk" onclick="state.gMun='${r.mu.id}'; state.gAba='${temF ? 'frequencia' : 'matriculas'}'; render(); scrollTo({top:0})" title="Aplica este município como filtro do painel">Filtrar</button>`}
            ${naAmostra.has(r.mu.id) && temF ? `<button class="lnk" title="Abre a listagem de Frequência filtrada por este município" onclick="state.mun='${r.mu.id}'; state.ciclo='2026'; state.janela=''; state.busca=''; state.faixaF=''; ir('#/frequencia')">Estudantes</button>` : ''}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    ${temF ? `<p class="gctx" style="margin-top:10px">▼ queda = frequência ≥ 80% caiu 1 p.p. ou mais desde ${tv('o processamento anterior', 'a janela de processamento anterior')} (${PROCS[fp].rotulo}), ou caiu em 3 ou mais ${tps()} seguidos. ● não informada = 3× ou mais a média da rede (${pct1(redeNi)}).</p>` : ''}
    ${gExport('Indicadores por município')}`;
}

function gAbaModalidades(){
  const ano = +state.gCiclo, ps = procsDoCiclo(ano), cats = catsDe(ps);
  const mods = ['EMR', 'EJA'], S = mod => gSel(mod, state.gMun);
  const temF = ano === 2026, fps = procsFreq(), catsF = catsDe(fps);
  const serie = (fn, pis) => mods.map(mod => ({nome:mod, cor:COR_MOD[mod], v:pis.map(pi => fn(pi, S(mod)))}));
  const sEleg = serie((pi, s) => gMatr(ano, pi, s).pct, ps);
  const sFreq = temF ? serie((pi, s) => gFreq(pi, s).pct, fps) : [];
  const sVal = serie((pi, s) => { const m = gMatr(ano, pi, s); return m.eleg ? gPag(pi, ano, s).valor / m.eleg : 0; }, ps);
  const L = ps[ps.length - 1];
  const r = mods.map(mod => {
    const s = S(mod), m = gMatr(ano, L, s), f = temF ? gFreq(fps[fps.length - 1], s) : null;
    return {m, f, v:ps.reduce((t, pi) => t + gPag(pi, ano, s).valor, 0)};
  });
  const totRede = r[0].m.rede + r[1].m.rede, totV = r[0].v + r[1].v;
  const linha = (k, a, b, dif) => `<tr><td>${k}</td><td class="r num">${a}</td><td class="r num">${b}</td><td class="r">${dif || ''}</td></tr>`;
  const leg = legenda(mods.map(m => ({nome:m === 'EMR' ? 'EMR — Ensino Médio Regular' : 'EJA — Educação de Jovens e Adultos', cor:COR_MOD[m]})), false);
  return `
    <div class="gnote">EMR e EJA lado a lado${state.gMun ? `, em <b>${state.gMun}</b>` : ''}. O seletor de modalidade não se aplica a esta aba.</div>
    ${leg}
    <div class="gcards tres" style="margin-top:8px">
      ${gCard('% elegível', `ciclo ${ano}`, gChart({tipo:'linhas', cats, series:sEleg, fmt:'pct', w:380, h:250, aria:'Percentual elegível por modalidade'}))}
      ${temF ? gCard('Frequência ≥ 80%', '% das matrículas com frequência apurada', gChart({tipo:'linhas', cats:catsF, series:sFreq, fmt:'pct', w:380, h:250, aria:'Frequência por modalidade'}))
        : gCard('Frequência ≥ 80%', '', `<div class="gempty" style="margin-top:10px">Não apurada para o ciclo ${ano} em 2026.</div>`)}
      ${gCard('Valor liberado por matrícula elegível', `R$ por elegível, em cada ${tp()}`, gChart({tipo:'linhas', cats, series:sVal, fmt:'brl', w:380, h:250, zero:true, aria:'Valor por elegível por modalidade'}))}
    </div>
    <div class="gbar"><h3>Comparativo no último ${tp()} (${PROCS[L].rotulo})</h3></div>
    <div class="tbl-wrap"><table class="gtbl">
      <thead><tr><th>Indicador</th><th class="r">EMR</th><th class="r">EJA</th><th class="r">Diferença (EJA − EMR)</th></tr></thead>
      <tbody>
        ${linha('Matrículas na rede', `${N(r[0].m.rede)} <span style="color:var(--ink-3)">(${pct1(r[0].m.rede / totRede * 100)})</span>`, `${N(r[1].m.rede)} <span style="color:var(--ink-3)">(${pct1(r[1].m.rede / totRede * 100)})</span>`)}
        ${linha('% elegível', pct1(r[0].m.pct), pct1(r[1].m.pct), dPP(r[1].m.pct - r[0].m.pct))}
        ${temF ? linha('Frequência ≥ 80%', pct1(r[0].f.pct), pct1(r[1].f.pct), dPP(r[1].f.pct - r[0].f.pct)) : ''}
        ${temF ? linha('Frequência abaixo de 80%', pct1(r[0].f.pctAb), pct1(r[1].f.pctAb), dPP(r[1].f.pctAb - r[0].f.pctAb, true)) : ''}
        ${temF ? linha('Frequência não informada', pct1(r[0].f.pctNi), pct1(r[1].f.pctNi), dPP(r[1].f.pctNi - r[0].f.pctNi, true)) : ''}
        ${linha('Valor liberado ao ciclo em 2026', `${R$(r[0].v)} <span style="color:var(--ink-3)">(${pct1(r[0].v / totV * 100)})</span>`, `${R$(r[1].v)} <span style="color:var(--ink-3)">(${pct1(r[1].v / totV * 100)})</span>`)}
        ${linha('Valor por matrícula elegível', R$(r[0].v / r[0].m.eleg), R$(r[1].v / r[1].m.eleg))}
      </tbody>
    </table></div>
    ${gExport('Comparativo EMR × EJA')}`;
}

const GABAS = [
  ['matriculas', 'Matrículas', gAbaMatriculas], ['frequencia', 'Frequência', gAbaFrequencia], ['pagamento', 'Pagamento', gAbaPagamento],
  ['ciclos', 'Ciclos', gAbaCiclos], ['municipios', 'Municípios', gAbaMunicipios], ['modalidades', 'EMR × EJA', gAbaModalidades]
];
function telaGestao(){
  const ano = +state.gCiclo, ps = procsDoCiclo(ano);
  const aba = GABAS.find(a => a[0] === state.gAba) || GABAS[0];
  return {
    crumbs:[{txt:'Painel de Gestão'}],
    html:`
    <div class="page-head">
      <div><h1>Painel de Gestão</h1>
        <div class="sub">A evolução dos indicadores da rede ao longo dos ${tps()}, para acompanhar tendências, comparar recortes e decidir onde agir.
          Complementa as telas de consulta — cada número leva à tela onde estão os estudantes.</div></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>
    ${gFiltros()}
    <div class="gctx">Rede estadual — Bahia · ciclo <b>${ano}</b> · <b>${ps.length}</b> ${ps.length === 1 ? tp() : tps()}
      ${ps.length > 1 ? `de ${PROCS[ps[0]].rotulo} a ${PROCS[ps[ps.length - 1]].rotulo}` : `em ${PROCS[ps[0]].rotulo}`}
      · ${state.gMod === 'geral' ? 'EMR + EJA' : MODS.find(m => m.id === state.gMod).nome}${state.gMun ? ` · <b>${state.gMun}</b> <button class="btn sm" style="padding:1px 9px; margin-left:4px" onclick="state.gMun=''; render()">limpar município</button>` : ''}</div>
    ${gKpis()}
    ${gInsightsHTML()}
    <div class="tabs" data-new="abas do painel">
      ${GABAS.map(([id, nome]) => `<button class="${aba[0] === id ? 'on' : ''}" onclick="state.gAba='${id}'; render()">${nome}</button>`).join('')}
    </div>
    ${aba[2]()}`
  };
}

function render(){
  const telas = {
    inicio: telaInicio,
    elegibilidade: telaElegibilidade,
    frequencia: telaFrequencia,
    pagamento: telaPagamento,
    processamentos: telaProcessamentos,
    janela: telaJanela,
    gestao: telaGestao
  };
  const t = (telas[state.rota] || telaInicio)();

  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('crumbs').innerHTML = crumbsHTML(t.crumbs);
  document.getElementById('app').innerHTML = t.html + `
    <div class="foot">
      <span>Protótipo de proposta — Painel de Gestão</span><span>·</span>
      <span>Dados ilustrativos, ancorados nas telas atuais do Portal do Usuário</span><span>·</span>
      <span>Painel de Gestão: Revisão 1 — novembro de 2026</span><span>·</span>
      <span>Demais telas: base da Revisão 5 do protótipo de ${nomeProc().toLowerCase()}</span>
    </div>`;
  renderModal();
}

lerHash();
</script>

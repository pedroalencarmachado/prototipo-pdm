<title>Janelas de Processamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Raleway:wght@600;700;800&display=swap">

<style>
:root{
  /* Paleta institucional gov.br — base do portal atual */
  --blue:#1351B4;
  --blue-dark:#0C326F;
  --blue-soft:#E8EFFA;
  --blue-line:#C5D4EB;
  --green:#168821;
  --green-soft:#E3F5E6;
  --red:#E52207;
  --red-soft:#FDEAE7;
  --orange:#C25400;
  --orange-soft:#FDF0E3;
  --yellow:#FFCD07;

  /* Roxo = a camada proposta. Teal = o que mudou após a revisão com o MEC. */
  --new:#6C2EB9;
  --new-soft:#F3EDFB;
  --new-line:#D9C7F0;

  /* cores dos ciclos — usadas no gráfico e nas etiquetas */
  --c26:#1351B4;
  --c25:#00A0A8;
  --c24:#8E44AD;

  --ink:#16202E;
  --ink-2:#48566B;
  --ink-3:#71809A;
  --line:#DCE3ED;
  --line-2:#EDF1F7;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --ground:#F1F4F9;

  --shadow:0 1px 2px rgba(22,32,46,.06), 0 4px 14px rgba(22,32,46,.05);
  --radius:6px;

  --font-ui:"Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Raleway", "Public Sans", -apple-system, "Segoe UI", sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:3px}
table{border-collapse:collapse; width:100%}
.num{font-variant-numeric:tabular-nums}
input,select{font:inherit}

/* ─────────── faixa de protótipo ─────────── */
.proto-bar{
  position:sticky; top:0; z-index:60;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 24px; font-size:12px;
}
.proto-bar strong{
  font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  background:var(--new); padding:2px 7px; border-radius:3px; font-size:11px;
}
.proto-bar .msg{color:#C3CCDA}
.proto-bar .spacer{flex:1}
.toggle{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  color:#fff; border-radius:99px; padding:4px 12px 4px 6px; font-size:12px;
  white-space:nowrap;
}
.toggle:hover{background:rgba(255,255,255,.16)}
.toggle .dot{
  width:26px; height:15px; border-radius:99px; background:rgba(255,255,255,.28);
  position:relative; transition:background .18s; flex:none;
}
.toggle .dot::after{
  content:""; position:absolute; top:2px; left:2px; width:11px; height:11px;
  border-radius:50%; background:#fff; transition:transform .18s;
}
body.mark .toggle.t-new .dot{background:#9B5DE5}
body.mark .toggle.t-new .dot::after{transform:translateX(11px)}
.seg{
  display:inline-flex; align-items:center; gap:2px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  border-radius:99px; padding:2px 3px 2px 11px; font-size:12px; white-space:nowrap;
}
.seg .rot{color:#C3CCDA; margin-right:5px}
.seg button{
  background:none; border:0; color:#fff; font:inherit; font-weight:700;
  border-radius:99px; padding:2px 10px; cursor:pointer;
}
.seg button:hover{background:rgba(255,255,255,.16)}
.seg button[aria-pressed="true"]{background:#fff; color:var(--ink)}

/* ─────────── chrome do portal ─────────── */
.topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:31px; z-index:50}
.topbar-inner{max-width:1240px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:62px}
.brand{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.06em; color:var(--blue-dark); white-space:nowrap}
.nav{display:flex; gap:4px; margin-left:auto}
.nav a{padding:8px 13px; border-radius:var(--radius); font-weight:600; font-size:14px; color:var(--blue); position:relative}
.nav a:hover{background:var(--blue-soft); text-decoration:none}
.nav a.on{background:var(--blue-soft); color:var(--blue-dark)}
.user{display:flex; align-items:center; gap:10px; padding-left:24px; border-left:1px solid var(--line); margin-left:8px}
.user .who{text-align:right; line-height:1.25}
.user .who b{display:block; font-weight:600; font-size:13px}
.user .who small{color:var(--ink-3); font-size:12px}
.user .av{width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700}

.crumbs{background:var(--surface); border-bottom:1px solid var(--line-2)}
.crumbs-inner{max-width:1240px; margin:0 auto; padding:9px 24px; font-size:12px; color:var(--ink-3); display:flex; gap:8px; align-items:center}
.crumbs-inner a{color:var(--blue)}
.crumbs-inner .sep{color:var(--blue-line)}

.page{max-width:1240px; margin:0 auto; padding:26px 24px 72px}

/* ─────────── títulos e blocos ─────────── */
.page-head{display:flex; align-items:flex-start; gap:20px; margin-bottom:22px}
.page-head h1{font-size:23px; font-weight:700}
.page-head .sub{color:var(--ink-2); font-size:14px; margin-top:3px; max-width:78ch}
.page-head .mark{margin-left:auto; font-family:var(--font-display); font-weight:800; letter-spacing:.06em; color:var(--blue-dark); font-size:16px; white-space:nowrap}

.filters{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.field{display:flex; align-items:center; gap:9px}
.field > label{color:var(--ink-2); font-size:13px}
select, .inp{
  font-size:13px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 10px; min-width:104px;
}
select:hover{border-color:var(--blue-line)}
.field.pai > label{color:var(--new); font-weight:600}
.field.pai select{border-color:var(--new-line); background:var(--new-soft); min-width:210px; font-weight:500}
.field.filho > label{color:var(--ink-2)}
.field.filho select{min-width:190px}
.field .hint{color:var(--ink-3); font-size:11.5px; margin-left:-4px}

.notice{background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--radius); padding:13px 16px; color:var(--ink-2); font-size:13px; margin-bottom:22px}
.notice b{color:var(--ink)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:24px}
.tabs button{background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; padding:10px 16px; font-size:14px; color:var(--ink-2)}
.tabs button.on{color:var(--blue-dark); border-bottom-color:var(--blue); font-weight:600}
.tabs button:hover{color:var(--blue)}

.section-title{display:flex; align-items:center; gap:10px; margin:32px 0 12px; font-size:15px; font-weight:700; font-family:var(--font-display)}
.section-title:first-child{margin-top:0}
.section-title .ico{color:var(--ink-3); font-size:15px}
.section-title .act{margin-left:auto}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:99px; border:1px solid var(--blue); color:var(--blue); background:transparent; padding:7px 16px; font-size:13px; font-weight:600}
.btn:hover{background:var(--blue-soft)}
.btn.solid{background:var(--blue); color:#fff; border-color:var(--blue)}
.btn.solid:hover{background:var(--blue-dark)}
.btn.new{border-color:var(--new); color:var(--new)}
.btn.new:hover{background:var(--new-soft)}
.btn.new.solid{background:var(--new); color:#fff}
.btn.new.solid:hover{background:#571E9B}
.btn.sm{padding:5px 12px; font-size:12px}

/* ─────────── cartões de indicador ─────────── */
.kpis{display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.kpi{padding:14px 16px 16px; border-left:1px solid var(--line-2); border-top:3px solid var(--c,var(--blue))}
.kpi:first-child{border-left:0}
.kpi .lbl{display:flex; align-items:center; gap:6px; justify-content:space-between; color:var(--ink-2); font-size:12.5px; min-height:32px}
.kpi .val{font-size:26px; font-weight:700; color:var(--c,var(--blue)); margin-top:4px}
.info{width:15px; height:15px; border-radius:50%; background:var(--ink); color:#fff; flex:none; font-size:10px; font-weight:700; display:grid; place-items:center; cursor:help}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.panel-rows{display:grid; grid-template-columns:1fr 1fr}
.cell{padding:13px 16px; border-top:1px solid var(--line-2); border-left:1px solid var(--line-2)}
.cell:nth-child(odd){border-left:0}
.cell.wide{grid-column:1 / -1; border-top:0; background:var(--surface-2)}
.cell .lbl{display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12.5px}
.cell .val{font-size:19px; font-weight:600; margin-top:2px}
.cell.wide .val{font-size:20px}

/* ─────────── tabelas ─────────── */
.tbl-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto}
table th{text-align:left; font-size:12.5px; font-weight:600; color:var(--blue); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
table td{padding:12px 14px; border-bottom:1px solid var(--line-2); vertical-align:top; font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .prim{font-weight:500}
td .sec{color:var(--ink-3); font-size:11.5px; margin-top:2px}
td.r,th.r{text-align:right}
.eye{color:var(--blue); font-size:15px; background:none; border:0; padding:2px 4px; border-radius:4px}
.eye:hover{background:var(--blue-soft)}
.empty{padding:34px 16px; text-align:center; color:var(--ink-2)}
.empty b{display:block; color:var(--ink); margin-bottom:4px}

.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap}
.pill.ok{background:var(--green-soft); color:var(--green)}
.pill.no{background:var(--red-soft); color:var(--red)}
.pill.wait{background:var(--orange-soft); color:var(--orange)}
.pill.blue{background:var(--blue-soft); color:var(--blue-dark)}
.pill.gray{background:var(--line-2); color:var(--ink-2)}
.pill.c26{background:#E8EFFA; color:var(--c26)}
.pill.c25{background:#E0F5F6; color:#00767D}
.pill.c24{background:#F3E9F8; color:var(--c24)}

.freq{text-align:center; font-variant-numeric:tabular-nums; font-weight:500}
.freq.hi{background:#E8F6EA}
.freq.mid{background:#FBF3E4}
.freq.lo{background:#FCEBE8}
.freq.acc{font-weight:700}

.searchbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.searchbox{flex:1; min-width:280px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0 14px}
.searchbox input{flex:1; border:0; background:none; padding:11px 0; font-size:13px; color:var(--ink); outline:none}
.searchbox .mag{color:var(--blue); font-size:15px}
.searchbox button.clr{border:0; background:none; color:var(--ink-3); font-size:16px; line-height:1}
.count{color:var(--ink-2); font-size:12.5px; white-space:nowrap}

.export{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px}
.export h3{font-size:15px; margin-bottom:14px}
.export .box{background:var(--surface-2); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:20px}
.export .box p{margin:3px 0 0; color:var(--ink-2); font-size:13px; max-width:62ch}
.export .box b{font-size:13.5px}
.export .box .btn{margin-left:auto; flex:none}

/* ─────────── faixa de contexto de janela ─────────── */
.window-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--new-soft); border:1px solid var(--new-line);
  border-left:4px solid var(--new); border-radius:var(--radius);
  padding:12px 16px; margin-bottom:20px; font-size:13px;
}
.window-bar .t{font-weight:600; color:var(--new)}
.window-bar .d{color:var(--ink-2)}
.window-bar .actions{margin-left:auto; display:flex; gap:8px}

/* ─────────── lista de janelas ─────────── */
.window-list{display:flex; flex-direction:column; gap:12px}
.window-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  border-left:4px solid var(--blue-line);
  display:grid; grid-template-columns:200px 1fr 210px 230px; gap:22px;
  padding:18px 20px; align-items:center; text-align:left; width:100%; font:inherit; cursor:pointer;
}
.window-card:hover{border-color:var(--blue-line); border-left-color:var(--new); box-shadow:var(--shadow)}
.window-card.hot{border-left-color:var(--new)}
.wc-date .day{font-size:21px; font-weight:700; font-family:var(--font-display); line-height:1.1}
.wc-date .mon{color:var(--ink-2); font-size:12.5px; margin-top:3px}
.wc-cycles .cap, .wc-res .cap{color:var(--ink-3); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px}
.wc-cycles .pills{display:flex; gap:6px; flex-wrap:wrap}
.wc-res .big{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.wc-res .money{color:var(--green); font-weight:600; font-variant-numeric:tabular-nums; font-size:13px}
.bar{height:5px; border-radius:99px; background:var(--line-2); overflow:hidden; margin-top:7px}
.bar span{display:block; height:100%; background:var(--blue); border-radius:99px}
.window-card.hot .bar span{background:var(--new)}

/* ─────────── detalhe da janela ─────────── */
.win-head{background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--new); border-radius:var(--radius); padding:22px 24px; margin-bottom:24px}
.win-head .row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
.win-head h1{font-size:24px; font-weight:700}
.win-head .meta{display:flex; gap:28px; margin-top:16px; flex-wrap:wrap}
.win-head .meta div .k{color:var(--ink-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em}
.win-head .meta div .v{font-weight:600; font-size:13.5px; margin-top:3px; font-variant-numeric:tabular-nums}
.win-head .acts{margin-left:auto; display:flex; gap:8px}

.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.res{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column}
.res-h{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--line-2); font-weight:700; font-size:14px; font-family:var(--font-display)}
.res-h .chip{margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-2); border-radius:99px; padding:2px 9px}
.res-b{padding:6px 16px 14px; flex:1}
.res-f{padding:11px 16px; border-top:1px solid var(--line-2); background:var(--surface-2)}
.dl{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dotted var(--line)}
.dl:last-child{border-bottom:0}
.dl .k{color:var(--ink-2); font-size:13px}
.dl .v{font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; display:flex; align-items:baseline; gap:8px}
.delta{font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums}
.delta.up{background:var(--green-soft); color:var(--green)}
.delta.down{background:var(--red-soft); color:var(--red)}
.delta.flat{background:var(--line-2); color:var(--ink-3)}

.donut-row{display:flex; align-items:center; gap:24px; padding:14px 0 6px; flex-wrap:wrap}
.donut{width:132px; height:132px; border-radius:50%; flex:none; display:grid; place-items:center}
.donut .hole{width:92px; height:92px; border-radius:50%; background:var(--surface); display:grid; place-items:center; text-align:center; line-height:1.15}
.donut .hole b{font-size:12.5px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block}
.donut .hole small{font-size:10px; color:var(--ink-3)}
.legend{display:flex; flex-direction:column; gap:9px; font-size:12.5px; flex:1; min-width:210px}
.legend .lrow{display:flex; align-items:center; gap:9px}
.legend i{width:10px; height:10px; border-radius:2px; flex:none}
.legend .nm{color:var(--ink-2)}
.legend .vl{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}
.legend .money{color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:112px; text-align:right}

/* ─────────── modal de detalhe ─────────── */
.overlay{position:fixed; inset:0; background:rgba(11,18,28,.46); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:56px 20px; overflow:auto}
.modal{background:var(--surface); border-radius:8px; max-width:860px; width:100%; box-shadow:0 18px 50px rgba(11,18,28,.28)}
.modal-h{display:flex; align-items:flex-start; gap:16px; padding:20px 24px; border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px; font-weight:700}
.modal-h .sec{color:var(--ink-3); font-size:12.5px; margin-top:4px}
.modal-h button{margin-left:auto; border:0; background:none; font-size:22px; color:var(--ink-3); line-height:1}
.modal-b{padding:20px 24px 26px}
.modal-b h4{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); margin:22px 0 10px; font-family:var(--font-ui); font-weight:700}
.modal-b h4:first-child{margin-top:0}
.idgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.idgrid div .k{color:var(--ink-3); font-size:11.5px}
.idgrid div .v{font-weight:600; font-size:13.5px; margin-top:2px; font-variant-numeric:tabular-nums}

/* ─────────── marcações ─────────── */
body.mark [data-new]{outline:2px dashed var(--new); outline-offset:3px; border-radius:var(--radius); position:relative}
body.mark [data-new]::after{
  content:attr(data-new); position:absolute; top:-9px; left:10px; z-index:6;
  background:var(--new); color:#fff; font-family:var(--font-ui);
  font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:1px 6px; border-radius:3px; white-space:nowrap; pointer-events:none;
}

.foot{margin-top:44px; padding-top:18px; border-top:1px solid var(--line); color:var(--ink-3); font-size:12px; display:flex; gap:16px; flex-wrap:wrap}

@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-left:1px solid var(--line-2)}
  .grid-2,.res-grid{grid-template-columns:1fr}
  .window-card{grid-template-columns:1fr; gap:14px}
  .idgrid{grid-template-columns:repeat(2,1fr)}
  .nav{width:100%; overflow-x:auto}
  .topbar-inner{height:auto; flex-wrap:wrap; padding:12px 16px; gap:12px}
  .user{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<div class="proto-bar">
  <strong>Protótipo</strong>
  <span class="msg">Proposta de evolução do Portal do Usuário · dados ilustrativos · não é o portal oficial</span>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Versão do roteiro" title="A: menu Processamentos · B: menu Janelas">
    <span class="rot">Roteiro</span>
    <button type="button" id="rtA" data-roteiro="a" aria-pressed="true">A</button>
    <button type="button" id="rtB" data-roteiro="b" aria-pressed="false">B</button>
  </div>
  <button class="toggle t-new" id="tgNew" aria-pressed="false">
    <span class="dot" aria-hidden="true"></span> Destacar o que é novo
  </button>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">PÉ·DE·MEIA</div>
    <nav class="nav" id="nav"></nav>
    <div class="user">
      <div class="who"><b>User 01725314460</b><small>Gestor Estadual · Bahia</small></div>
      <div class="av">UO</div>
    </div>
  </div>
</header>

<div class="crumbs"><div class="crumbs-inner" id="crumbs"></div></div>

<main class="page" id="app"></main>
<div id="modal"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   DADOS ILUSTRATIVOS
   Ancorados nos números das telas atuais do Portal. Não representam

    const loc = locais[ate(locais.length)];

    else sit[2024] = 'Elegível';

    /* frequência sempre igual ou acima de 80% — os casos abaixo de 80 são os nomeados */
    const f = () => Math.round((82 + rnd() * 18) * 100) / 100;
    const fev = f(), mar = f(), abr = f();
    pool.push({
      mat, nome:'Estudante ' + String(2000000000 + ate(999999999)), cpf, nis:'',
      escola:loc.escola, inep:loc.inep, mun:loc.mun, sit, alt:[], amostra:true,
      freq:{fev, mar, abr, acum: Math.round((fev + mar + abr) / 3 * 100) / 100}
    });
  }
  ALUNOS.push(...pool);

  /* parcelas da amostra, seguindo as competências reais de cada janela */
  JANELAS.forEach(j => {
    j.ciclos.forEach(c => {
      const elegiveis = pool.filter(a => a.sit[c.ano]);
      c.parcelas.forEach(p => {
        for (let i = 0; i < 14 && elegiveis.length; i++){
          const a = elegiveis[ate(elegiveis.length)];
          const pago = rnd() < 0.754;                    /* mesma proporção dos cartões */
          const dia = String(10 + ate(18)).padStart(2,'0');
          const [d, m, y] = j.rotulo.split('/');
          PARCELAS.push({
            mat:a.mat, ciclo:c.ano, cod:p.cod, amostra:true,
            sit: pago ? 'Pago' : 'Aguardando Pagamento',
            proc: `${j.rotulo} 0${2 + ate(5)}:${dia}`,
            dt: pago ? `${String(+d + 1).padStart(2,'0')}/${m}/${y}` : null,
            jan:j.id
          });
        }
      });
    });
  });
})();

/* ── versão do roteiro ──────────────────────────────────────────────

   processamento" e o menu Janelas. Vem do endereço (?roteiro=a ou ?roteiro=b),

  document.querySelectorAll('[data-roteiro]').forEach(b =>

  b.addEventListener('click', () => { setRoteiro(b.dataset.roteiro); render(); }));
{

}

function setJanela(v){
  state.janela = v;

  render();
}
function setCiclo(v){

  render();
}
function janelasDisponiveis(){
  if (state.ciclo === 'todos') return JANELAS;
  return JANELAS.filter(j => anosDa(j).includes(+state.ciclo));
}
function ciclosDisponiveis(){
  if (state.janela) return anosDa(jan(state.janela));

}

/* JANELAS está em ordem decrescente (a mais recente primeiro).
   Índice MAIOR = janela mais antiga. A trava garante B sempre posterior a A. */
function setCmpA(i){
  state.cmpA = +i;
  if (state.cmpB >= state.cmpA) state.cmpB = state.cmpA - 1;  /* B tem de ser mais recente */
  render();
}
function setCmpB(i){ state.cmpB = +i; render(); }

function comparativo(){
  const a = JANELAS[state.cmpA], b = JANELAS[state.cmpB];
  const linha = (k, va, vb, money) => {
    const dif = vb - va;                                      /* evolução de A para B */
    return `<tr>
      <td>${k}</td>
      <td class="r num">${money?R$(va):N(va)}</td>
      <td class="r num"><b>${money?R$(vb):N(vb)}</b></td>
      <td class="r">${dif===0?'<span class="delta flat">=</span>':`<span class="delta ${dif>0?'up':'down'}">${dif>0?'+':'−'}${money?R$(Math.abs(dif)):N(Math.abs(dif))}</span>`}</td>
    </tr>`;
  };

  /* A pode ser qualquer janela menos a mais recente; B, qualquer uma posterior a A */
  const opsA = JANELAS.map((j, i) => ({i, j})).filter(x => x.i > 0);
  const opsB = JANELAS.map((j, i) => ({i, j})).filter(x => x.i < state.cmpA);

  return `
    <div class="filters">
      <div class="field">
        <label for="c-a">Janela A <span class="hint" style="margin:0">anterior</span></label>
        <select id="c-a" onchange="setCmpA(this.value)">
          ${opsA.map(x => `<option value="${x.i}" ${state.cmpA===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label for="c-b">Janela B <span class="hint" style="margin:0">posterior</span></label>
        <select id="c-b" onchange="setCmpB(this.value)">
          ${opsB.map(x => `<option value="${x.i}" ${state.cmpB===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <span class="count">só é possível comparar uma janela com outra posterior a ela</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:40%">Indicador</th>
          <th class="r">A · ${a.rotulo}</th>
          <th class="r">B · ${b.rotulo}</th>
          <th class="r" style="width:160px">Variação</th>
        </tr></thead>
        <tbody>
          ${linha('Ciclos afetados', anosDa(a).length, anosDa(b).length)}
          ${linha('Matrículas processadas', somaJ(a,'processadas'), somaJ(b,'processadas'))}
          ${linha('Matrículas com situação alterada', somaJ(a,'alteradas'), somaJ(b,'alteradas'))}
          ${linha('Parcelas liberadas', parcelasJ(a), parcelasJ(b))}
          ${linha('Valor liberado', valorJ(a), valorJ(b), true)}
        </tbody>
      </table>
    </div>
    <p style="color:var(--ink-2); font-size:13px; margin-top:14px; max-width:92ch">
      A variação mostra o que mudou da janela <b>${a.rotulo}</b> para a janela <b>${b.rotulo}</b>.
      Janelas que atingem mais de um ciclo liberam mais pagamento — é o caso de ${ULTIMA.rotulo}, que alcançou três ciclos.
    </p>`;
}

    return {ano:c.ano, pct, seg, parcelas:parcelasC(c), valor:valorC(c)};

/* ══════════════════════════════════════════════════════════════════
   TELA — ELEGIBILIDADE
   ══════════════════════════════════════════════════════════════════ */
function telaElegibilidade(){
  const j = state.janela ? jan(state.janela) : null;
  const anos = ciclosEmFoco();
  const r = redeDe(state.ciclo);

  /* Base: uma linha por matrícula-ciclo. A janela NÃO altera as colunas da tabela —
     ela apenas restringe a lista às matrículas processadas naquela janela. */
  let base = [];
  ALUNOS.forEach(a => {
    anos.forEach(ano => {
      if (!a.sit[ano]) return;
      base.push({a, ano});
    });
  });
  let lista = base.filter(x => casa(x.a, state.busca));
  if (state.mun) lista = lista.filter(x => x.a.mun === state.mun);
  if (state.sitF) lista = lista.filter(x => x.a.sit[x.ano] === state.sitF);
  /* total do recorte: com janela, as matrículas processadas nela; senão, a rede */
  const totalDecl = (state.busca || state.mun || state.sitF) ? lista.length
    : (j ? j.ciclos.filter(c => anos.includes(c.ano)).reduce((t,c) => t + c.processadas, 0) : r.rede);
  const pagina = lista.slice(0, LIM);

  return {
    crumbs:[{txt:'Status de elegibilidade'}],
    html:`

      ${kpi('Não elegível', r.nao, 'var(--ink)', 'Matrículas que não atendem às condições.')}

      <div class="box">
        <div><b>Planilha completa</b>
        <p>Faça a solicitação do download da planilha completa para visualizar os status dos estudantes da rede${j?` <b>na janela de ${j.rotulo}</b>`:''}.</p></div>
        <button class="btn solid" onclick="alert('Protótipo: a solicitação apareceria em Visualizar Solicitações.')">⬓ Solicitar Planilha</button>
      </div>
      <p style="margin:14px 0 0"><a href="#/elegibilidade">↺ Visualizar Solicitações</a></p>
    </div>

    ${searchbar('Pesquisar por Nome, CPF, NIS ou Matrícula', pagina.length, totalDecl)}
    <div class="filters" style="margin-bottom:14px">
      <div class="field"><label>Filtrar por</label><select disabled><option>Bahia</option></select></div>
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-sit">Situação</label>
        <select id="f-sit" onchange="state.sitF=this.value; render()">
          <option value="">Todas</option>
          ${['Elegível','Não elegível','Elegibilidade indefinida'].map(s => `<option ${state.sitF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
    </div>

    <div class="tbl-wrap">
      ${lista.length === 0 ? `<div class="empty"><b>Nenhuma matrícula encontrada</b>

/* ══════════════════════════════════════════════════════════════════
   TELA — PAGAMENTO
   ══════════════════════════════════════════════════════════════════ */
function telaPagamento(){
  const j = state.janela ? jan(state.janela) : null;
  const anos = ciclosEmFoco();

  let base = PARCELAS.filter(p => anos.includes(p.ciclo));
  if (j) base = base.filter(p => p.jan === j.id);

  let lista = base.filter(p => casa(aluno(p.mat), state.busca));
  if (state.mun) lista = lista.filter(p => aluno(p.mat).mun === state.mun);
  if (state.incF) lista = lista.filter(p => incDe(p.cod) === state.incF);
  if (state.sitPagF) lista = lista.filter(p => p.sit === state.sitPagF);

  /* cartões de situação: da janela quando houver, senão o consolidado do Portal */
  let cards;
  if (j) {
    const sel = state.ciclo === 'todos' ? j.ciclos : j.ciclos.filter(c => c.ano === +state.ciclo);
    const qtd = sel.reduce((s,c) => s + parcelasC(c), 0);
    const val = sel.reduce((s,c) => s + valorC(c), 0);
    const pagos = Math.round(qtd * 0.754);
    cards = {total:qtd, vTotal:val, pagos, vPagos:Math.round(val*0.754), aguard:qtd-pagos, vAguard:val-Math.round(val*0.754), bloq:0};
  } else {
    cards = {total:1396680, vTotal:343279400, pagos:979964, vPagos:195992800, aguard:319714, vAguard:63942800, bloq:3};
  }

  /* Total do recorte: o mesmo número dos cartões e do gráfico. Com filtro de
     situação aplicado, usa o total daquela situação — é o que mantém a lista
     coerente com o que o gráfico mostra. */
  const totalDecl = (state.busca || state.mun || state.incF) ? lista.length
    : state.sitPagF === 'Pago' ? cards.pagos
    : state.sitPagF === 'Aguardando Pagamento' ? cards.aguard
    : cards.total;
  const pagina = lista.slice(0, LIM);

  /* gráfico: por ciclo quando há janela; por situação no consolidado */
  let donut, legenda;
  if (j) {
    const sel = state.ciclo === 'todos' ? j.ciclos : j.ciclos.filter(c => c.ano === +state.ciclo);
    const tv = sel.reduce((s,c) => s + valorC(c), 0);
    let acc = 0;
    const fs = sel.map(c => {
      const pct = valorC(c) / tv * 100; const seg = `${CORC[c.ano]} ${acc}% ${acc+pct}%`; acc += pct;
      return {ano:c.ano, pct, seg, valor:valorC(c)};
    });
    donut = `conic-gradient(${fs.map(f => f.seg).join(', ')})`;
    legenda = fs.map(f => `<div class="lrow"><i style="background:${CORC[f.ano]}"></i>
      <span class="nm">Ciclo ${f.ano}</span><span class="vl">${f.pct.toFixed(1)}%</span>
      <span class="money">${R$(f.valor)}</span></div>`).join('');
  } else {
    const pct = cards.pagos / cards.total * 100;
    donut = `conic-gradient(var(--green) 0 ${pct}%, #9B5DE5 ${pct}% 100%)`;
    legenda = `<div class="lrow"><i style="background:var(--green)"></i><span class="nm">Pagos</span><span class="vl">${pct.toFixed(1)}%</span></div>
      <div class="lrow"><i style="background:#9B5DE5"></i><span class="nm">Aguardando Pagamento</span><span class="vl">${(100-pct).toFixed(1)}%</span></div>`;
  }

  return {
    crumbs:[{txt:'Visualizar pagamentos'}],
    html:`
    <div class="page-head">
      <div><h1>Visualizar Pagamentos</h1></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>

    <div class="tabs">
      <button class="on">Ensino Médio Regular</button>
      <button>Educação de Jovens e Adultos (EJA)</button>
    </div>

    ${filtros()}
    ${windowBar()}

    <div class="panel" style="overflow:hidden">
      <div style="background:var(--blue); color:#fff; padding:11px 18px; font-weight:600; font-size:13.5px">▥ Visão geral</div>
      <div style="display:grid; grid-template-columns:1.35fr 1fr">
        <div>
          <div style="background:#F0F5FC; color:var(--blue-dark); padding:9px 18px; font-size:12.5px; font-weight:600; border-bottom:1px solid var(--line-2)">Incentivos</div>
          <div class="panel-rows">
            <div class="cell wide" style="background:var(--surface)">
              <div class="lbl">Total <span class="info">i</span></div>
              <div style="display:flex; align-items:baseline; justify-content:space-between; gap:14px">
                <div class="val num" style="font-size:26px; font-weight:700">${N(cards.total)}</div>
                <div class="num" style="color:var(--ink-2)">${R$(cards.vTotal)}</div>
              </div>
            </div>
            ${cellPag('Pagos', cards.pagos, cards.vPagos, 'var(--green)')}
            ${cellPag('Depositados', 0, 0, '#2670E8')}
            ${cellPag('Em Análise Mec', 0, 0, 'var(--blue-dark)')}
            ${cellPag('Em Processamento', 0, 0, 'var(--ink-3)')}
            ${cellPag('Aguardando Pagamento', cards.aguard, cards.vAguard, '#9B5DE5')}
            ${cellPag('Bloqueados', cards.bloq, cards.bloq*200, 'var(--yellow)')}
            ${cellPag('Rejeitados', 0, 0, 'var(--red)')}
            ${cellPag('Suspensos', 0, 0, '#E9B949')}
          </div>
        </div>
        <div style="border-left:1px solid var(--line-2)">
          <div style="background:#F0F5FC; color:var(--blue-dark); padding:9px 18px; font-size:12.5px; font-weight:600; border-bottom:1px solid var(--line-2)">
            ${j ? 'Valor liberado por ciclo' : 'Percentual de incentivos por situação'}
          </div>
          <div style="display:flex; align-items:center; justify-content:center; gap:24px; padding:30px 20px; flex-wrap:wrap">
            <div class="donut" style="width:150px; height:150px; background:${donut}">
              <div class="hole" style="width:92px; height:92px">
                <b style="font-size:14px">${j ? curto(cards.vTotal) : N(cards.total)}</b>
                <small>${j ? 'liberados' : 'incentivos'}</small>
              </div>
            </div>
            <div class="legend">${legenda}</div>
          </div>
        </div>
      </div>
    </div>

    ${j ? `<div class="section-title"><span class="ico">▤</span> Parcelas desta janela, por ciclo</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:110px">Ciclo</th><th>Incentivo</th><th class="r">Parcelas</th><th class="r">Valor</th></tr></thead>
        <tbody>
          ${j.ciclos.filter(c => anos.includes(c.ano)).flatMap(c => c.parcelas.map(p => `<tr>
            <td>${pillCiclo(c.ano)}</td>
            <td><div class="prim">${incDe(p.cod)}</div>${p.faixa ? `<div class="sec">nove parcelas do ciclo ${c.ano}</div>` : ''}</td>
            <td class="r num">${N(p.qtd)}</td>
            <td class="r num">${R$(p.valor)}</td>
          </tr>`)).join('')}
        </tbody>
      </table>
    </div>` : ''}

    <div class="export" style="margin-top:26px">
      <h3>Exportar Dados de Pagamentos</h3>
      <div class="box">
        <div><b>Planilha completa</b>
        <p>Faça a solicitação do download da planilha completa para visualizar os pagamentos realizados aos estudantes da rede${j?` <b>na janela de ${j.rotulo}</b>`:''}.</p></div>
        <button class="btn solid" onclick="alert('Protótipo: a solicitação apareceria em Visualizar Solicitações.')">⬓ Solicitar Planilha</button>
      </div>
      <p style="margin:14px 0 0"><a href="#/pagamento">↺ Visualizar Solicitações</a></p>
    </div>

    ${searchbar('Pesquisar por Nome, CPF, NIS ou Matrícula', pagina.length, totalDecl)}
    <div class="filters" style="margin-bottom:14px">
      <div class="field"><label>Filtrar por</label><select disabled><option>Bahia</option></select></div>
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-inc">Tipo de Incentivo</label>
        <select id="f-inc" onchange="state.incF=this.value; render()">
          <option value="">Todos</option>
          ${['Matrícula','Frequência','Conclusão','Enem'].map(s => `<option ${state.incF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="field"><label for="f-sitp">Situação</label>
        <select id="f-sitp" onchange="state.sitPagF=this.value; render()">
          <option value="">Todas</option>
          ${['Pago','Aguardando Pagamento'].map(s => `<option ${state.sitPagF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
    </div>

    <div class="tbl-wrap">
      ${pagina.length === 0 ? `<div class="empty"><b>Nenhum pagamento encontrado</b>
        Revise a busca ou os filtros aplicados.</div>` : `
      <table>
        <thead><tr>
          <th>Estudante</th>
          <th>Unidade de Ensino e código INEP</th>
          <th>Incentivo</th>
          <th>Ciclo</th>
          <th>Processado em</th>
          ${!state.janela?'<th data-new="coluna nova">Janela</th>':''}
          <th>Situação do Incentivo</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${pagina.map(p => {
            const a = aluno(p.mat);
            return `<tr>
              <td><div class="prim">${a.nome}</div><div class="sec num">CPF: ${a.cpf}</div></td>
              <td><div style="font-size:12.5px">${a.escola}</div><div class="sec">Código INEP: ${a.inep}</div></td>
              <td><div class="prim">${incDe(p.cod)}</div></td>
              <td>${pillCiclo(p.ciclo)}</td>
              <td class="num">${p.proc}</td>
              ${!state.janela?`<td class="num"><a href="#/janela/${p.jan}">${jan(p.jan).rotulo}</a></td>`:''}
              <td><span class="pill ${p.sit==='Pago'?'ok':'wait'}">${p.sit}</span>${p.dt?`<div class="sec">Data do Pagamento: ${p.dt}</div>`:''}</td>
              <td class="r"><button class="eye" title="Ver detalhes" onclick="abrirDetalhe('${p.mat}')">👁</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>`
  };
}
function cellPag(lbl, qtd, valor, cor){
  return `<div class="cell" style="border-top:3px solid ${cor}">
    <div class="lbl">${lbl} <span class="info">i</span></div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px">
      <div class="val num">${N(qtd)}</div>
      <div class="num" style="color:var(--ink-2); font-size:12.5px">${R$(valor)}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   MODAL DE DETALHE DA MATRÍCULA
   ══════════════════════════════════════════════════════════════════ */
function abrirDetalhe(mat){ state.modal = mat; renderModal(); }
function fecharDetalhe(){ state.modal = null; renderModal(); }

function renderModal(){
  const box = document.getElementById('modal');
  if (!state.modal) { box.innerHTML = ''; return; }
  const a = aluno(state.modal);
  const ps = PARCELAS.filter(p => p.mat === a.mat);
  const pagas = ps.filter(p => p.sit === 'Pago');
  const valor = pagas.reduce((s,p) => s + MARCO[+String(p.cod).slice(4)].valor, 0);

  box.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) fecharDetalhe()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Detalhes da matrícula">
      <div class="modal-h">
        <div>
          <h3>${a.nome}</h3>
          <div class="sec num">Matrícula SGP ${a.mat} · CPF ${a.cpf}${a.nis?` · NIS ${a.nis}`:''}</div>
        </div>
        <button title="Fechar" onclick="fecharDetalhe()">×</button>
      </div>
      <div class="modal-b">
        <h4>Identificação</h4>
        <div class="idgrid">
          <div><div class="k">Unidade de Ensino</div><div class="v" style="font-size:12.5px; font-variant-numeric:normal">${a.escola}</div></div>
          <div><div class="k">Código INEP</div><div class="v">${a.inep}</div></div>
          <div><div class="k">Município</div><div class="v" style="font-variant-numeric:normal">${a.mun}</div></div>
          <div><div class="k">Frequência acumulada</div><div class="v" style="color:${a.freq.acum>=80?'var(--green)':'var(--red)'}">${pct(a.freq.acum)}</div></div>
        </div>

        <h4>Situação por ciclo</h4>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Ciclo</th><th>Situação no Pé-de-Meia</th><th>Situação anterior</th><th>Alterada na janela</th></tr></thead>
            <tbody>
              ${Object.keys(a.sit).sort((x,y)=>y-x).map(ano => {
                const m = a.alt.find(x => x.ciclo === +ano);
                return `<tr>
                  <td>${pillCiclo(+ano)}</td>
                  <td><span class="pill ${a.sit[ano]==='Elegível'?'ok':'no'}">${a.sit[ano]}</span></td>
                  <td>${m?`<span class="pill ${m.de==='Não elegível'?'no':'wait'}">${m.de}</span>`:'<span class="sec">sem alteração</span>'}</td>
                  <td>${m?`<a href="#/janela/${m.jan}" onclick="fecharDetalhe()">${jan(m.jan).rotulo}</a>`:'–'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <h4>Pagamentos — ${N(ps.length)} ${ps.length===1?'parcela':'parcelas'}, ${R$(valor)} ${pagas.length===ps.length?'pagos':'já pagos'}</h4>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Ciclo</th><th>Incentivo</th><th>Janela</th><th>Situação</th></tr></thead>
            <tbody>
              ${ps.length === 0 ? '<tr><td colspan="4" class="sec">Nenhuma parcela liberada.</td></tr>' :
                ps.map(p => `<tr>
                  <td>${pillCiclo(p.ciclo)}</td>
                  <td>${incDe(p.cod)}</td>
                  <td><a href="#/janela/${p.jan}" onclick="fecharDetalhe()">${jan(p.jan).rotulo}</a></td>
                  <td><span class="pill ${p.sit==='Pago'?'ok':'wait'}">${p.sit}</span>${p.dt?`<div class="sec">em ${p.dt}</div>`:''}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════ */
function render(){
  const telas = {
    inicio: telaInicio,
    elegibilidade: telaElegibilidade,
    frequencia: telaFrequencia,
    pagamento: telaPagamento,
    processamentos: telaProcessamentos,
    janela: telaJanela
  };
  const t = (telas[state.rota] || telaInicio)();

  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('crumbs').innerHTML = crumbsHTML(t.crumbs);
  document.getElementById('app').innerHTML = t.html + `
    <div class="foot">
      <span>Protótipo de proposta — Janelas de Processamento</span><span>·</span>
      <span>Dados ilustrativos, ancorados nas telas atuais do Portal do Usuário</span><span>·</span>
      <span>Revisão 4 — outubro de 2026</span>
    </div>`;
  renderModal();
}

lerHash();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prototipo navegavel - proposta de Janelas de Processamento para o Portal do Usuario do Programa Pe-de-Meia. Dados ilustrativos.">
<title>Janelas de Processamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Raleway:wght@600;700;800&display=swap">

<style>
:root{
  /* Paleta institucional gov.br — base do portal atual */
  --blue:#1351B4;
  --blue-dark:#0C326F;
  --blue-soft:#E8EFFA;
  --blue-line:#C5D4EB;
  --green:#168821;
  --green-soft:#E3F5E6;
  --red:#E52207;
  --red-soft:#FDEAE7;
  --orange:#C25400;
  --orange-soft:#FDF0E3;
  --yellow:#FFCD07;

  /* Roxo = a camada proposta. Teal = o que mudou após a revisão com o MEC. */
  --new:#6C2EB9;
  --new-soft:#F3EDFB;
  --new-line:#D9C7F0;

  /* cores dos ciclos — usadas no gráfico e nas etiquetas */
  --c26:#1351B4;
  --c25:#00A0A8;
  --c24:#8E44AD;

  --ink:#16202E;
  --ink-2:#48566B;
  --ink-3:#71809A;
  --line:#DCE3ED;
  --line-2:#EDF1F7;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --ground:#F1F4F9;

  --shadow:0 1px 2px rgba(22,32,46,.06), 0 4px 14px rgba(22,32,46,.05);
  --radius:6px;

  --font-ui:"Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Raleway", "Public Sans", -apple-system, "Segoe UI", sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:3px}
table{border-collapse:collapse; width:100%}
.num{font-variant-numeric:tabular-nums}
input,select{font:inherit}

/* ─────────── faixa de protótipo ─────────── */
.proto-bar{
  position:sticky; top:0; z-index:60;
  background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 24px; font-size:12px;
}
.proto-bar strong{
  font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  background:var(--new); padding:2px 7px; border-radius:3px; font-size:11px;
}
.proto-bar .msg{color:#C3CCDA}
.proto-bar .spacer{flex:1}
.toggle{
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  color:#fff; border-radius:99px; padding:4px 12px 4px 6px; font-size:12px;
  white-space:nowrap;
}
.toggle:hover{background:rgba(255,255,255,.16)}
.toggle .dot{
  width:26px; height:15px; border-radius:99px; background:rgba(255,255,255,.28);
  position:relative; transition:background .18s; flex:none;
}
.toggle .dot::after{
  content:""; position:absolute; top:2px; left:2px; width:11px; height:11px;
  border-radius:50%; background:#fff; transition:transform .18s;
}
body.mark .toggle.t-new .dot{background:#9B5DE5}
body.mark .toggle.t-new .dot::after{transform:translateX(11px)}
.seg{
  display:inline-flex; align-items:center; gap:2px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.22);
  border-radius:99px; padding:2px 3px 2px 11px; font-size:12px; white-space:nowrap;
}
.seg .rot{color:#C3CCDA; margin-right:5px}
.seg button{
  background:none; border:0; color:#fff; font:inherit; font-weight:700;
  border-radius:99px; padding:2px 10px; cursor:pointer;
}
.seg button:hover{background:rgba(255,255,255,.16)}
.seg button[aria-pressed="true"]{background:#fff; color:var(--ink)}

/* ─────────── chrome do portal ─────────── */
.topbar{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:31px; z-index:50}
.topbar-inner{max-width:1240px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:62px}
.brand{font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.06em; color:var(--blue-dark); white-space:nowrap}
.nav{display:flex; gap:4px; margin-left:auto}
.nav a{padding:8px 13px; border-radius:var(--radius); font-weight:600; font-size:14px; color:var(--blue); position:relative}
.nav a:hover{background:var(--blue-soft); text-decoration:none}
.nav a.on{background:var(--blue-soft); color:var(--blue-dark)}
.user{display:flex; align-items:center; gap:10px; padding-left:24px; border-left:1px solid var(--line); margin-left:8px}
.user .who{text-align:right; line-height:1.25}
.user .who b{display:block; font-weight:600; font-size:13px}
.user .who small{color:var(--ink-3); font-size:12px}
.user .av{width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700}

.crumbs{background:var(--surface); border-bottom:1px solid var(--line-2)}
.crumbs-inner{max-width:1240px; margin:0 auto; padding:9px 24px; font-size:12px; color:var(--ink-3); display:flex; gap:8px; align-items:center}
.crumbs-inner a{color:var(--blue)}
.crumbs-inner .sep{color:var(--blue-line)}

.page{max-width:1240px; margin:0 auto; padding:26px 24px 72px}

/* ─────────── títulos e blocos ─────────── */
.page-head{display:flex; align-items:flex-start; gap:20px; margin-bottom:22px}
.page-head h1{font-size:23px; font-weight:700}
.page-head .sub{color:var(--ink-2); font-size:14px; margin-top:3px; max-width:78ch}
.page-head .mark{margin-left:auto; font-family:var(--font-display); font-weight:800; letter-spacing:.06em; color:var(--blue-dark); font-size:16px; white-space:nowrap}

.filters{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.field{display:flex; align-items:center; gap:9px}
.field > label{color:var(--ink-2); font-size:13px}
select, .inp{
  font-size:13px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--radius); padding:7px 10px; min-width:104px;
}
select:hover{border-color:var(--blue-line)}
.field.pai > label{color:var(--new); font-weight:600}
.field.pai select{border-color:var(--new-line); background:var(--new-soft); min-width:210px; font-weight:500}
.field.filho > label{color:var(--ink-2)}
.field.filho select{min-width:190px}
.field .hint{color:var(--ink-3); font-size:11.5px; margin-left:-4px}

.notice{background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--radius); padding:13px 16px; color:var(--ink-2); font-size:13px; margin-bottom:22px}
.notice b{color:var(--ink)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:24px}
.tabs button{background:none; border:0; border-bottom:3px solid transparent; margin-bottom:-1px; padding:10px 16px; font-size:14px; color:var(--ink-2)}
.tabs button.on{color:var(--blue-dark); border-bottom-color:var(--blue); font-weight:600}
.tabs button:hover{color:var(--blue)}

.section-title{display:flex; align-items:center; gap:10px; margin:32px 0 12px; font-size:15px; font-weight:700; font-family:var(--font-display)}
.section-title:first-child{margin-top:0}
.section-title .ico{color:var(--ink-3); font-size:15px}
.section-title .act{margin-left:auto}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:99px; border:1px solid var(--blue); color:var(--blue); background:transparent; padding:7px 16px; font-size:13px; font-weight:600}
.btn:hover{background:var(--blue-soft)}
.btn.solid{background:var(--blue); color:#fff; border-color:var(--blue)}
.btn.solid:hover{background:var(--blue-dark)}
.btn.new{border-color:var(--new); color:var(--new)}
.btn.new:hover{background:var(--new-soft)}
.btn.new.solid{background:var(--new); color:#fff}
.btn.new.solid:hover{background:#571E9B}
.btn.sm{padding:5px 12px; font-size:12px}

/* ─────────── cartões de indicador ─────────── */
.kpis{display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.kpi{padding:14px 16px 16px; border-left:1px solid var(--line-2)}
.kpi .sub{color:var(--ink-3); font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums}
.kpi:first-child{border-left:0}
.kpi .lbl{display:flex; align-items:center; gap:6px; justify-content:space-between; color:var(--ink-2); font-size:12.5px; min-height:32px}
.kpi .val{font-size:26px; font-weight:700; color:var(--c,var(--blue)); margin-top:4px}
.info{width:15px; height:15px; border-radius:50%; background:var(--ink); color:#fff; flex:none; font-size:10px; font-weight:700; display:grid; place-items:center; cursor:help}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.panel-rows{display:grid; grid-template-columns:1fr 1fr}
.cell{padding:13px 16px; border-top:1px solid var(--line-2); border-left:1px solid var(--line-2)}
.cell:nth-child(odd){border-left:0}
.cell.wide{grid-column:1 / -1; border-top:0; background:var(--surface-2)}
.cell .lbl{display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:12.5px}
.cell .val{font-size:19px; font-weight:600; margin-top:2px}
.cell.wide .val{font-size:20px}

/* ─────────── tabelas ─────────── */
.tbl-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto}
table th{text-align:left; font-size:12.5px; font-weight:600; color:var(--blue); padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
table td{padding:12px 14px; border-bottom:1px solid var(--line-2); vertical-align:top; font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .prim{font-weight:500}
td .sec{color:var(--ink-3); font-size:11.5px; margin-top:2px}
td.r,th.r{text-align:right}
.eye{color:var(--blue); font-size:15px; background:none; border:0; padding:2px 4px; border-radius:4px}
.eye:hover{background:var(--blue-soft)}
.empty{padding:34px 16px; text-align:center; color:var(--ink-2)}
.empty b{display:block; color:var(--ink); margin-bottom:4px}

.pill{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap}
.pill.ok{background:var(--green-soft); color:var(--green)}
.pill.no{background:var(--red-soft); color:var(--red)}
.pill.wait{background:var(--orange-soft); color:var(--orange)}
.pill.blue{background:var(--blue-soft); color:var(--blue-dark)}
.pill.gray{background:var(--line-2); color:var(--ink-2)}
.pill.c26{background:#E8EFFA; color:var(--c26)}
.pill.c25{background:#E0F5F6; color:#00767D}
.pill.c24{background:#F3E9F8; color:var(--c24)}

.freq{text-align:center; font-variant-numeric:tabular-nums; font-weight:500}
.freq.hi{background:#E8F6EA}
.freq.mid{background:#FBF3E4}
.freq.lo{background:#FCEBE8}
.freq.acc{font-weight:700}

.searchbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.searchbox{flex:1; min-width:280px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0 14px}
.searchbox input{flex:1; border:0; background:none; padding:11px 0; font-size:13px; color:var(--ink); outline:none}
.searchbox .mag{color:var(--blue); font-size:15px}
.searchbox button.clr{border:0; background:none; color:var(--ink-3); font-size:16px; line-height:1}
.count{color:var(--ink-2); font-size:12.5px; white-space:nowrap}

.export{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:24px}
.export h3{font-size:15px; margin-bottom:14px}
.export .box{background:var(--surface-2); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; gap:20px}
.export .box p{margin:3px 0 0; color:var(--ink-2); font-size:13px; max-width:62ch}
.export .box b{font-size:13.5px}
.export .box .btn{margin-left:auto; flex:none}

/* ─────────── faixa de contexto de janela ─────────── */
.window-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--new-soft); border:1px solid var(--new-line);
  border-left:4px solid var(--new); border-radius:var(--radius);
  padding:12px 16px; margin-bottom:20px; font-size:13px;
}
.window-bar .t{font-weight:600; color:var(--new)}
.window-bar .d{color:var(--ink-2)}
.window-bar .actions{margin-left:auto; display:flex; gap:8px}

/* ─────────── lista de janelas ─────────── */
.window-list{display:flex; flex-direction:column; gap:12px}
.window-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  border-left:4px solid var(--blue-line);
  display:grid; grid-template-columns:200px 1fr 210px 230px; gap:22px;
  padding:18px 20px; align-items:center; text-align:left; width:100%; font:inherit; cursor:pointer;
}
.window-card:hover{border-color:var(--blue-line); border-left-color:var(--new); box-shadow:var(--shadow)}
.window-card.hot{border-left-color:var(--new)}
.wc-date .day{font-size:21px; font-weight:700; font-family:var(--font-display); line-height:1.1}
.wc-date .mon{color:var(--ink-2); font-size:12.5px; margin-top:3px}
.wc-cycles .cap, .wc-res .cap{color:var(--ink-3); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px}
.wc-cycles .pills{display:flex; gap:6px; flex-wrap:wrap}
.wc-res .big{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
.wc-res .money{color:var(--green); font-weight:600; font-variant-numeric:tabular-nums; font-size:13px}
.bar{height:5px; border-radius:99px; background:var(--line-2); overflow:hidden; margin-top:7px}
.bar span{display:block; height:100%; background:var(--blue); border-radius:99px}
.window-card.hot .bar span{background:var(--new)}
.wc-date .day::first-letter{text-transform:uppercase}
/* calendário: aberto (verde) e próximos (cinza, sem clique) */
.cal-h{display:flex; align-items:baseline; gap:10px; margin:4px 0 10px; font-size:15px; font-weight:700}
.cal-h span{font-size:12.5px; font-weight:400; color:var(--ink-3)}
.fut-list{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.window-card.fut{cursor:default; background:var(--surface-2); border-style:dashed; border-left:4px solid #C8D0DB; padding:12px 18px; color:var(--ink-3); grid-template-columns:1fr}
.window-card.fut:hover{box-shadow:none; border-color:var(--line); border-left-color:#C8D0DB}
.window-card.fut .day{font-size:17px; color:var(--ink-2)}
.window-card.aberta{background:#F3FAF4; border-style:solid; border-left-color:var(--green); color:var(--ink)}
.window-card.aberta:hover{border-color:var(--line); border-left-color:var(--green)}
.window-card.aberta .day{color:var(--ink)}
.stj{display:inline-block; margin-top:5px; font-size:11px; font-weight:700; padding:1px 9px; border-radius:99px; background:#E4E8EE; color:var(--ink-2)}
.stj.ab{background:var(--green); color:#fff}
.wc-env b{color:var(--ink); font-weight:600}
.wc-env{font-size:13px}
/* link para o calendário operacional */
.cal-link{display:flex; align-items:center; gap:10px; background:var(--blue-soft); border:1px solid var(--blue-line); border-radius:var(--radius); padding:10px 14px; margin-bottom:16px; font-size:13px; color:var(--ink-2)}
.cal-link a{font-weight:600}
/* "Comparar processamentos" em evidência */
.tabs button.cmp-tab{color:var(--new); font-weight:600; display:inline-flex; align-items:center; gap:7px}
.tabs button.cmp-tab .nv{background:var(--new); color:#fff; font-size:10px; font-weight:700; letter-spacing:.04em; padding:1px 7px; border-radius:99px; text-transform:uppercase}
.tabs button.cmp-tab.on{border-bottom-color:var(--new); color:var(--new)}
.cmp-cta{display:flex; align-items:center; gap:14px; background:var(--new-soft); border:1px solid var(--new-line); border-radius:var(--radius); padding:12px 16px; margin-bottom:18px}
.cmp-cta .ic{width:34px; height:34px; border-radius:50%; background:var(--new); color:#fff; display:grid; place-items:center; font-size:17px; flex:none}
.cmp-cta p{margin:0; font-size:13px; color:var(--ink-2)}
.cmp-cta p b{color:var(--ink); display:block; font-size:14px}
.cmp-cta .btn{margin-left:auto; flex:none}
.cmp-sel{display:flex; align-items:stretch; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.cmp-sel .cmp-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; display:flex; flex-direction:column; gap:6px; min-width:230px}
.cmp-sel .cmp-box label{font-size:12px; font-weight:700; color:var(--new); text-transform:uppercase; letter-spacing:.05em}
.cmp-sel .cmp-box select{min-width:200px; font-weight:600; background:#fff}
.cmp-sel .cmp-arrow{display:grid; place-items:center; color:var(--new); font-size:20px; font-weight:700}
.cmp-sel .count{align-self:center}

/* ─────────── detalhe da janela ─────────── */
.win-head{background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--new); border-radius:var(--radius); padding:22px 24px; margin-bottom:24px}
.win-head .row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
.win-head h1{font-size:24px; font-weight:700}
.win-head .meta{display:flex; gap:28px; margin-top:16px; flex-wrap:wrap}
.win-head .meta div .k{color:var(--ink-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em}
.win-head .meta div .v{font-weight:600; font-size:13.5px; margin-top:3px; font-variant-numeric:tabular-nums}
.win-head .acts{margin-left:auto; display:flex; gap:8px}

.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.res{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column}
.res-h{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--line-2); font-weight:700; font-size:14px; font-family:var(--font-display)}
.res-h .chip{margin-left:auto; font-size:11px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-2); border-radius:99px; padding:2px 9px}
.res-b{padding:6px 16px 14px; flex:1}
.res-f{padding:11px 16px; border-top:1px solid var(--line-2); background:var(--surface-2)}
.dl{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px dotted var(--line)}
.dl:last-child{border-bottom:0}
.dl .k{color:var(--ink-2); font-size:13px}
.dl .v{font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; display:flex; align-items:baseline; gap:8px}
.delta{font-size:11.5px; font-weight:700; border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums}
.delta.up{background:var(--green-soft); color:var(--green)}
.delta.down{background:var(--red-soft); color:var(--red)}
.delta.flat{background:var(--line-2); color:var(--ink-3)}

.donut-row{display:flex; align-items:center; gap:24px; padding:14px 0 6px; flex-wrap:wrap}
.donut{width:132px; height:132px; border-radius:50%; flex:none; display:grid; place-items:center}
.donut .hole{width:92px; height:92px; border-radius:50%; background:var(--surface); display:grid; place-items:center; text-align:center; line-height:1.15}
.donut .hole b{font-size:12.5px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block}
.donut .hole small{font-size:10px; color:var(--ink-3)}
.legend{display:flex; flex-direction:column; gap:9px; font-size:12.5px; flex:1; min-width:210px}
.legend .lrow{display:flex; align-items:center; gap:9px}
.legend i{width:10px; height:10px; border-radius:2px; flex:none}
.legend .nm{color:var(--ink-2)}
.legend .vl{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}
.legend .money{color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:112px; text-align:right}

/* ─────────── modal de detalhe ─────────── */
.overlay{position:fixed; inset:0; background:rgba(11,18,28,.46); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:56px 20px; overflow:auto}
.modal{background:var(--surface); border-radius:8px; max-width:860px; width:100%; box-shadow:0 18px 50px rgba(11,18,28,.28)}

/* ══════════════════════════════════════════════════════════════════

const N = n => n.toLocaleString('pt-BR');
const R$ = v => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const curto = v => v >= 1e6 ? 'R$ ' + (v/1e6).toFixed(1).replace('.',',') + ' mi'
  : v >= 1e3 ? 'R$ ' + Math.round(v/1e3) + ' mil' : R$(v);
function foco(id){ const e = document.getElementById(id); if (e) { e.focus(); const n = e.value.length; try { e.setSelectionRange(n, n); } catch(_){} } }
const pct = v => v.toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:2}) + '%';
const MES = ['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* os 12 marcos do calendário operacional */

const CORC = {2026:'var(--c26)', 2025:'var(--c25)', 2024:'var(--c24)'};

/* ── janelas de processamento ───────────────────────────────────── */
const JANELAS = [

const jan = id => JANELAS.find(j => j.id === id);
const ULTIMA = JANELAS[0];
const anosDa = j => j.ciclos.map(c => c.ano);
const somaJ = (j, campo) => j.ciclos.reduce((s, c) => s + (c[campo] || 0), 0);
const parcelasJ = j => j.ciclos.reduce((s, c) => s + c.parcelas.reduce((a, p) => a + p.qtd, 0), 0);
const valorJ = j => j.ciclos.reduce((s, c) => s + c.parcelas.reduce((a, p) => a + p.valor, 0), 0);
const parcelasC = c => c.parcelas.reduce((a, p) => a + p.qtd, 0);
const valorC = c => c.parcelas.reduce((a, p) => a + p.valor, 0);

/* reparte um total inteiro por pesos, fechando a soma exata (maior resto) */
function aloca(total, pesos){
  const s = pesos.reduce((a, b) => a + b, 0);
  if (!s) return pesos.map(() => 0);
  const bruto = pesos.map(p => total * p / s);
  const base = bruto.map(Math.floor);
  const resto = total - base.reduce((a, b) => a + b, 0);
  bruto.map((v, i) => ({i, f:v - base[i]})).sort((a, b) => b.f - a.f).slice(0, resto).forEach(x => base[x.i]++);
  return base;
}

/* ── próximos processamentos (calendário) ───────────────────────────
   Sugestão de um operador, aplicada no Painel de Gestão e trazida para cá (MEC, 13/11):
   a janela com envio de dados aberto e as próximas. Períodos de envio conferidos com o
   calendário operacional do Programa (MEC, 17/11). */
const FUTUROS = [
  {rotulo:'setembro/2026', envio:'11/08 a 04/09/2026', aberto:true},
  {rotulo:'outubro/2026', envio:'08/09 a 02/10/2026'},
  {rotulo:'novembro/2026', envio:'06/10 a 06/11/2026'},
  {rotulo:'dezembro/2026', envio:'10/11 a 04/12/2026'}
];

/* ── frequência: o mês que cada processamento apura (o pagamento sai dois meses depois) ── */
const MESES_F = ['fev', 'mar', 'abr', 'mai', 'jun'];
const NOME_MES = {fev:'fevereiro', mar:'março', abr:'abril', mai:'maio', jun:'junho'};
const APURA = {'2026-04-24':'fev', '2026-05-26':'mar', '2026-06-25':'abr', '2026-07-24':'mai', '2026-08-26':'jun'};
const JAN_DO_MES = Object.fromEntries(Object.entries(APURA).map(([id, m]) => [m, id]));
/* meses de frequência já apurados até um processamento (sem processamento: todos) */
const mesesAte = jid => MESES_F.filter(m => !jid || JAN_DO_MES[m] <= jid);

/* ── modalidade: Visão geral (EMR + EJA), Ensino Médio Regular, EJA ──
   Pedido do MEC (13/11): a aba "Visão geral" soma EMR e EJA em todas as telas.
   Os totais da base são da rede inteira; a parte de cada modalidade é derivada
   com pesos fixos e fecha a soma exata (EMR + EJA = Visão geral). */
const MODS = [
  {id:'geral', nome:'Visão geral'},
  {id:'EMR', nome:'Ensino Médio Regular'},
  {id:'EJA', nome:'Educação de Jovens e Adultos (EJA)'}
];
const PART_EMR = {rede:.918, eleg:.925, pend:.9, indef:.86, alt:.9, parc:.93, abaixo:.82, ni:.85};
function emMod(x, met, mod){
  mod = mod || state.mod;
  if (mod === 'geral' || !x) return x;
  const e = Math.round(x * PART_EMR[met]);
  return mod === 'EMR' ? e : x - e;
}
const naMod = a => state.mod === 'geral' || a.mod === state.mod;
/* ciclo de uma janela, no recorte de modalidade */
function cMod(c){
  return {
    ano:c.ano,
    processadas:emMod(c.processadas, 'rede'),
    alteradas:emMod(c.alteradas, 'alt'),
    paraElegivel:emMod(c.paraElegivel, 'alt'),
    parcelas:c.parcelas.map(p => { const q = emMod(p.qtd, 'parc'); return {...p, qtd:q, valor:q * p.valor / p.qtd}; })
  };
}
const jMod = j => ({...j, ciclos:j.ciclos.map(cMod)});

/* ── retrato da rede por ciclo ─────────────────────────────────────
   REDE é a situação no último processamento. Pedido do MEC (13/11): os totais
   mudam conforme o processamento escolhido. O retrato de cada processamento volta
   no tempo a partir de REDE, desfazendo as alterações de cada um (alteradas /
   paraElegivel de JANELAS): metade das que passaram a ser elegíveis vinha de
   elegibilidade indefinida e metade de não elegível; as que deixaram de ser
   elegíveis voltam a elegível; a pendência bancária do ciclo 2026 cai até zerar em julho.
   Por isso a elegibilidade indefinida cai de um processamento para o outro. */
const REDE = {
  2026:{rede:445793, eleg:341399, pend:0, indef:66, nao:104328},
  2025:{rede:442108, eleg:338906, pend:0, indef:91, nao:103111},
  2024:{rede:431208, eleg:329744, pend:0, indef:120, nao:101344}
};
const PEND = {2026:{'2026-03-25':3410, '2026-04-24':2180, '2026-05-26':1150, '2026-06-25':420}};
const RETRATO = {};
[2026, 2025, 2024].forEach(ano => {
  RETRATO[ano] = {};
  const js = JANELAS.filter(j => anosDa(j).includes(ano));      /* do mais recente ao mais antigo */
  const rede = REDE[ano].rede;
  let cur = {eleg:REDE[ano].eleg, pend:REDE[ano].pend, indef:REDE[ano].indef};
  js.forEach((j, k) => {
    RETRATO[ano][j.id] = {rede, eleg:cur.eleg, pend:cur.pend, indef:cur.indef, nao:rede - cur.eleg - cur.pend - cur.indef};
    const c = j.ciclos.find(x => x.ano === ano), ant = js[k + 1];
    if (ant) {
      const pendAnt = (PEND[ano] || {})[ant.id] || 0;
      cur = {eleg:cur.eleg - c.paraElegivel + (c.alteradas - c.paraElegivel) - (pendAnt - cur.pend),
             pend:pendAnt, indef:cur.indef + Math.round(c.paraElegivel / 2)};
    }
  });
});
/* situação de um ciclo num processamento (sem processamento: o último);
   se o ciclo não passou por ele, vale o último retrato anterior */
function retratoAno(ano, jid){
  const ids = Object.keys(RETRATO[ano]).sort().reverse();
  const id = !jid ? ids[0] : ids.find(x => x <= jid);
  return id ? RETRATO[ano][id] : {rede:0, eleg:0, pend:0, indef:0, nao:0};
}
function retrato(anos, jid){
  return anos.reduce((t, ano) => {
    const r = retratoAno(ano, jid);
    const rede = emMod(r.rede, 'rede'), eleg = emMod(r.eleg, 'eleg'), pend = emMod(r.pend, 'pend'), indef = emMod(r.indef, 'indef');
    return {rede:t.rede + rede, eleg:t.eleg + eleg, pend:t.pend + pend, indef:t.indef + indef, nao:t.nao + rede - eleg - pend - indef};
  }, {rede:0, eleg:0, pend:0, indef:0, nao:0});
}

/* ── frequência das matrículas elegíveis ───────────────────────────
   Ciclo 2026: frequência de fevereiro a junho, informada de abril a agosto; a janela
   de março só tratou a matrícula. Com uma janela escolhida, a situação depois dela; sem
   janela, a atual (igual à da última janela). Elegíveis = ≥ 80% + < 80% + não informada,
   sempre fechando com o cartão "Elegível" do mesmo recorte. Ciclos 2025 e 2024 já
   terminaram: proporções fixas do retrato final. */
const FREQ26 = {
  '2026-04-24':{pct:.889, ni:2410, ni3:0},
  '2026-05-26':{pct:.902, ni:1380, ni3:0},
  '2026-06-25':{pct:.909, ni:1020, ni3:610},
  '2026-07-24':{pct:.901, ni:3950, ni3:702},
  '2026-08-26':{abaixo:27834, ni:823, ni3:795}
};
function freqResumo(anos, jid){
  const t = {eleg:0, acima:0, abaixo:0, ni:0, ni3:0, semFreq:false};
  anos.forEach(ano => {
    const eleg = retratoAno(ano, jid).eleg;
    let abaixo, ni, ni3;
    if (ano === 2026) {
      const fid = Object.keys(FREQ26).sort().reverse().find(id => !jid || id <= jid);
      if (!fid) { t.semFreq = true; return; }
      const f = FREQ26[fid];
      ni = f.ni; ni3 = f.ni3;
      abaixo = f.abaixo != null ? f.abaixo : eleg - Math.round(eleg * f.pct) - ni;
    } else {
      abaixo = Math.round(eleg * .074); ni = Math.round(eleg * .0021); ni3 = Math.round(ni * .9);
    }
    const eM = emMod(eleg, 'eleg'), abM = emMod(abaixo, 'abaixo'), niM = emMod(ni, 'ni');
    t.eleg += eM; t.abaixo += abM; t.ni += niM; t.ni3 += Math.min(niM, emMod(ni3, 'ni')); t.acima += eM - abM - niM;
  });
  return t;
}

/* ── pagamentos do recorte ─────────────────────────────────────────
   Com processamento: as parcelas dele (75,4% pagas, as bloqueadas da amostra e o
   restante aguardando). Sem processamento: o consolidado — no ciclo 2026, os números
   do Portal (pagos 979.964, aguardando 319.714, 3 bloqueadas; o restante, depositado);
   nos ciclos 2025 e 2024, a soma dos processamentos de cada um. */
const PAGO = .754;
const INCS = ['Matrícula', 'Frequência', 'Conclusão', 'Enem'];
function pagResumo(anos, jid){
  const r = {total:0, vTotal:0, pagos:0, vPagos:0, aguard:0, vAguard:0, bloq:0, vBloq:0, depos:0, vDepos:0, inc:{}};
  INCS.forEach(k => r.inc[k] = {qtd:0, pagos:0});
  const bloqueadas = (jj, ano) => PARCELAS.filter(p => p.sit === 'Bloqueado' && p.ciclo === ano && (!jj || p.jan === jj) && naMod(aluno(p.mat))).length;
  anos.forEach(ano => {
    const js = JANELAS.filter(j => anosDa(j).includes(ano) && (!jid || j.id === jid));
    const cs = js.map(j => ({j, c:cMod(j.ciclos.find(c => c.ano === ano))}));
    if (!jid && ano === 2026) {
      const q = cs.reduce((s, x) => s + parcelasC(x.c), 0), v = cs.reduce((s, x) => s + valorC(x.c), 0);
      cs.forEach(x => x.c.parcelas.forEach(p => r.inc[incDe(p.cod)].qtd += p.qtd));
      const pM = emMod(339755, 'parc'), pF = emMod(640209, 'parc'), ag = emMod(319714, 'parc'), bl = bloqueadas('', ano);
      r.inc['Matrícula'].pagos += pM; r.inc['Frequência'].pagos += pF;
      r.total += q; r.vTotal += v;
      r.pagos += pM + pF; r.vPagos += (pM + pF) * 200;
      r.aguard += ag; r.vAguard += ag * 200;
      r.bloq += bl; r.vBloq += bl * 200;
      r.depos += q - pM - pF - ag - bl; r.vDepos += (q - pM - pF - ag - bl) * 200;
      return;
    }
    cs.forEach(({j, c}) => {
      const q = parcelasC(c), v = valorC(c), u = q ? v / q : 0;
      const pg = Math.round(q * PAGO), bl = bloqueadas(j.id, ano), ag = q - pg - bl;
      const porInc = aloca(pg, c.parcelas.map(p => p.qtd));
      c.parcelas.forEach((p, i) => { r.inc[incDe(p.cod)].qtd += p.qtd; r.inc[incDe(p.cod)].pagos += porInc[i]; });
      r.total += q; r.vTotal += v; r.pagos += pg; r.vPagos += pg * u;
      r.aguard += ag; r.vAguard += ag * u; r.bloq += bl; r.vBloq += bl * u;
    });
  });
  return r;
}

/* ── amostra da base ──────────────────────────────────────────────────
   O Portal lista centenas de milhares de registros e mostra uma página por vez.
   Aqui acontece o mesmo: as listagens exibem uma página da amostra e informam
   ao lado o total real do recorte — é o que mantém a listagem coerente com os
   cartões e o gráfico. Os estudantes nomeados acima seguem sendo os que
   respondem às buscas por nome, CPF, NIS e matrícula. */
(function gerarAmostra(){
  let seed = 20260826;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const ate = n => Math.floor(rnd() * n);
  const d3 = () => String(100 + ate(900)), d2 = () => String(10 + ate(90));

  const locais = ALUNOS.map(a => ({escola:a.escola, inep:a.inep, mun:a.mun}));
  const cpfsUsados = new Set(ALUNOS.map(a => a.cpf));
  const matsUsadas = new Set(ALUNOS.map(a => a.mat));

  const pool = [];
  for (let i = 0; i < 60; i++){
    let cpf, mat;
    do { cpf = `${d3()}.${d3()}.${d3()}-${d2()}`; } while (cpfsUsados.has(cpf));
    do { mat = String(29000000 + ate(1500000)); } while (matsUsadas.has(mat));
    cpfsUsados.add(cpf); matsUsadas.add(mat);

    const loc = locais[ate(locais.length)];
    /* distribuição por ciclo: a maioria no ciclo corrente */
    const sorte = rnd();
    const sit = {};
    if (sorte < 0.60) sit[2026] = 'Elegível';
    else if (sorte < 0.85) { sit[2026] = 'Elegível'; sit[2025] = 'Elegível'; }
    else sit[2024] = 'Elegível';

    /* frequência sempre igual ou acima de 80% — os casos abaixo de 80 são os nomeados */
    const f = () => Math.round((82 + rnd() * 18) * 100) / 100;
    const fev = f(), mar = f(), abr = f(), mai = f(), jun = f();
    pool.push({
      mat, nome:'Estudante ' + String(2000000000 + ate(999999999)), cpf, nis:'',
      mod: rnd() < .1 ? 'EJA' : 'EMR',
      escola:loc.escola, inep:loc.inep, mun:loc.mun, sit, alt:[], amostra:true,
      freq:{fev, mar, abr, mai, jun}
    });
  }
  ALUNOS.push(...pool);

  /* parcelas da amostra, seguindo as competências reais de cada janela */
  JANELAS.forEach(j => {
    j.ciclos.forEach(c => {
      const elegiveis = pool.filter(a => a.sit[c.ano]);
      c.parcelas.forEach(p => {
        for (let i = 0; i < 14 && elegiveis.length; i++){
          const a = elegiveis[ate(elegiveis.length)];
          const pago = rnd() < 0.754;                    /* mesma proporção dos cartões */
          const dia = String(10 + ate(18)).padStart(2,'0');
          const [y, m, d] = j.id.split('-');
          PARCELAS.push({
            mat:a.mat, ciclo:c.ano, cod:p.cod, amostra:true,
            sit: pago ? 'Pago' : 'Aguardando Pagamento',
            proc: `${d}/${m}/${y} 0${2 + ate(5)}:${dia}`,
            dt: pago ? `${String(+d + 1).padStart(2,'0')}/${m}/${y}` : null,
            jan:j.id
          });
        }
      });
    });
  });
})();

   ESTADO — janela é o filtro pai, ciclo é o filho
   ══════════════════════════════════════════════════════════════════ */

const state = {
  rota:'inicio', arg:null,
  roteiro:'b',          /* Revisão 7: só a versão B ("janela de processamento"); tv() continua por compatibilidade */
  janela:'', ciclo:'2026',
  mod:'geral',          /* aba: Visão geral (EMR + EJA), EMR ou EJA */
  busca:'', mun:'', sitF:'', motF:'', incF:'', sitPagF:'', faixaF:'',
  altF:false,           /* só matrículas com situação alterada no processamento escolhido */
  manter:false,         /* true quando a navegação vem de um atalho que leva o recorte junto */
  aba:'lista', modal:null,
  cmpA:1, cmpB:0        /* comparação: A = janela anterior, B = posterior */
};

const ROTAS = [
  {id:'inicio', nome:'Início'},
  {id:'elegibilidade', nome:'Elegibilidade'},
  {id:'frequencia', nome:'Frequência'},
  {id:'pagamento', nome:'Pagamento'},
  {id:'processamentos', nome:'Processamentos', novo:true}
];

function ir(hash){ location.hash = hash; }
/* Texto conforme a versão do roteiro: tv('versão A — processamento', 'versão B — janela de processamento'). */
function tv(a, b){ return state.roteiro === 'b' ? b : a; }
function nomeProc(){ return tv('Processamentos', 'Janelas de Processamento'); }
/* "Concluída" concorda com janela; na versão A, com processamento */
function statusJ(j){ return j.status === 'Concluída' ? tv('Concluído', 'Concluída') : j.status; }
const noProc = () => tv('no processamento de', 'na janela de processamento de');

function lerHash(){
  const h = location.hash.replace(/^#\/?/, '') || 'inicio';
  const [r, a] = h.split('/');
  const nova = ROTAS.some(x => x.id === r) || r === 'janela' ? r : 'inicio';
  /* Pedido do MEC (13/11): trocar de tela pelo menu limpa os filtros; um atalho (irCom) os leva junto */
  if (nova !== state.rota && !state.manter) limparFiltros();
  state.manter = false;
  state.rota = nova;
  state.arg = a || null;
  if (state.rota === 'janela' && !jan(state.arg)) { state.rota = 'processamentos'; state.arg = null; }
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', lerHash);

document.getElementById('tgNew').addEventListener('click', e => {
  const on = document.body.classList.toggle('mark');
  e.currentTarget.setAttribute('aria-pressed', String(on));
});

/* ── versão do roteiro ──────────────────────────────────────────────
   A usa o termo "processamento" (menu Processamentos); B usa "janela de
   processamento" (menu Janelas de Processamento) em todos os rótulos, títulos e
   textos da proposta — ver tv(). Vem do endereço (?roteiro=a ou ?roteiro=b),
   ou da última escolha na chave da faixa; sem nada, fica A. */
function setRoteiro(v){
  state.roteiro = v === 'b' ? 'b' : 'a';
  try { localStorage.setItem('pdm-roteiro', state.roteiro); } catch (e) {}
  document.querySelectorAll('[data-roteiro]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.roteiro === state.roteiro)));
  document.title = nomeProc();
}
document.querySelectorAll('[data-roteiro]').forEach(b =>
  b.addEventListener('click', () => { setRoteiro(b.dataset.roteiro); render(); }));
setRoteiro('b');   /* Revisão 7: só a versão B */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) fecharDetalhe(); });

/* ── filtros dependentes ────────────────────────────────────────── */
function setJanela(v){
  state.janela = v;
  if (v && state.ciclo !== 'todos' && !anosDa(jan(v)).includes(+state.ciclo)) state.ciclo = 'todos';
  if (!v) state.altF = false;
  render();
}
function setCiclo(v){
  state.ciclo = v;
  if (v !== 'todos' && state.janela && !anosDa(jan(state.janela)).includes(+v)) { state.janela = ''; state.altF = false; }
  render();
}
function janelasDisponiveis(){
  if (state.ciclo === 'todos') return JANELAS;
  return JANELAS.filter(j => anosDa(j).includes(+state.ciclo));
}
function ciclosDisponiveis(){
  if (state.janela) return anosDa(jan(state.janela));
  return [2026, 2025, 2024];
}
/* ciclos efetivamente em foco — usado pelas listagens.
   Buscar uma pessoa por nome, CPF, NIS ou matrícula atravessa os ciclos:
   quem procura um estudante quer encontrá-lo, não importa o ano. */
function ciclosEmFoco(){
  if (state.busca) return ciclosDisponiveis();
  return state.ciclo === 'todos' ? ciclosDisponiveis() : [+state.ciclo];
}
function buscaAmpliada(){ return !!state.busca && state.ciclo !== 'todos'; }
/* ciclos do recorte para os cartões (a busca não amplia os cartões) */
function anosRecorte(){ return state.ciclo === 'todos' ? ciclosDisponiveis() : [+state.ciclo]; }

/* ── filtros não ficam presos entre telas (pedido do MEC, 13/11) ─────
   Trocar de tela pelo menu volta os filtros ao padrão. Chegar por um atalho
   ("Ver…", um bloco, um botão de uma tela) leva o recorte junto — irCom(). */
const FILTROS_PADRAO = {janela:'', ciclo:'2026', mod:'geral', busca:'', mun:'', sitF:'', motF:'', incF:'', sitPagF:'', faixaF:'', altF:false};
function limparFiltros(){ Object.assign(state, FILTROS_PADRAO); }
function irCom(hash, filtros){
  const mod = state.mod;                       /* a aba de modalidade vai junto */
  limparFiltros();
  state.mod = mod;
  Object.assign(state, filtros || {});
  if (location.hash === hash) { render(); window.scrollTo({top:0, behavior:'instant'}); }
  else { state.manter = true; ir(hash); }
}

/* quantidades por motivo, fechando a soma exata do total (maior resto) */
function qtdMotivos(grupo, total){
  const ks = Object.keys(MOTIVOS).filter(k => MOTIVOS[k].g === grupo);
  const pe = ks.reduce((s, k) => s + MOTIVOS[k].p, 0);
  const base = ks.map(k => { const ex = total * MOTIVOS[k].p / pe; return {k, q:Math.floor(ex), r:ex - Math.floor(ex)}; });
  let falta = total - base.reduce((s, b) => s + b.q, 0);
  [...base].sort((a, b) => b.r - a.r).forEach(b => { if (falta > 0 && MOTIVOS[b.k].p > 0) { b.q++; falta--; } });
  return base;
}

/* ── situação de uma matrícula num processamento ────────────────────
   Sem processamento, a situação atual. Com processamento, a situação como ficou
   depois dele: as alterações posteriores são desfeitas (vale o "de" de cada uma). */
function sitEm(a, ano, jid){
  let s = a.sit[ano];
  if (!s || !jid) return s;
  a.alt.filter(x => x.ciclo === ano && x.jan > jid).sort((x, y) => y.jan.localeCompare(x.jan)).forEach(x => { s = x.de; });
  return s;
}
/* motivos da situação nesse momento (o primeiro é o principal) */
function motEm(a, ano, jid){
  const s = sitEm(a, ano, jid);
  if (!s || s === 'Elegível') return [];
  if (s === a.sit[ano]) return (a.mot && a.mot[ano]) || [];
  const x = a.alt.filter(x => x.ciclo === ano && x.jan > jid).sort((x, y) => x.jan.localeCompare(y.jan))[0];
  return x && x.mot ? [x.mot] : [];
}
/* por que a situação mudou num processamento (pedido do MEC: o motivo dentro do 👁) */
function motivoAlt(a, m){
  const para = sitEm(a, m.ciclo, m.jan);
  if (para === 'Elegível') {
    if (m.mot) return MOTIVOS[m.mot].nome;
    return m.de === 'Elegibilidade indefinida' ? 'Informações de matrícula confirmadas pela rede' : 'Inscrição no CadÚnico confirmada';
  }
  const ks = motEm(a, m.ciclo, m.jan);
  if (ks.length) return MOTIVOS[ks[0]].nome;
  return 'Divergência de cadastro com a base do CadÚnico';
}

/* ── informativo (i) — abre ao passar o mouse ou ao clicar ───────────
   O balão é único e fica fora das tabelas, para não ser cortado pela rolagem. */
const TIPS = [];
let tipFixo = null;
function itip(html, rot){
  const i = TIPS.push(html) - 1;
  return `<button type="button" class="itip" data-tip="${i}" aria-label="${rot || 'Ver o motivo'}">i</button>`;
}
function mostrarTip(b){
  const box = document.getElementById('tipbox');
  box.innerHTML = TIPS[+b.dataset.tip] || '';
  box.classList.add('on');
  const r = b.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
  let y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
  box.style.left = x + 'px'; box.style.top = y + 'px';
}
function esconderTip(){
  const box = document.getElementById('tipbox');
  if (box) box.classList.remove('on');
  document.querySelectorAll('.itip.on').forEach(b => b.classList.remove('on'));
}
const alvoTip = e => e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
document.addEventListener('mouseover', e => { const b = alvoTip(e); if (b && !tipFixo) mostrarTip(b); });
document.addEventListener('mouseout', e => {
  const b = alvoTip(e);
  if (b && !tipFixo && !(e.relatedTarget && b.contains(e.relatedTarget))) esconderTip();
});
document.addEventListener('click', e => {
  const b = alvoTip(e);
  if (b) {
    e.preventDefault();
    if (tipFixo === b) { tipFixo = null; esconderTip(); }
    else { esconderTip(); tipFixo = b; b.classList.add('on'); mostrarTip(b); }
    return;
  }
  if (tipFixo) { tipFixo = null; esconderTip(); }
}, true);
document.addEventListener('focusin', e => { const b = alvoTip(e); if (b) mostrarTip(b); });
document.addEventListener('focusout', () => { if (!tipFixo) esconderTip(); });
window.addEventListener('scroll', () => { tipFixo = null; esconderTip(); }, true);

  return `<div class="field"><label for="f-mun">Município</label>
    <select id="f-mun" onchange="state.mun=this.value; render()">
      <option value="">Todos</option>
      ${muns.map(m => `<option ${state.mun===m?'selected':''}>${m}</option>`).join('')}
    </select></div>`;
}

/* JANELAS está em ordem decrescente (a mais recente primeiro).
   Índice MAIOR = janela mais antiga. A trava garante B sempre posterior a A. */
function setCmpA(i){
  state.cmpA = +i;
  if (state.cmpB >= state.cmpA) state.cmpB = state.cmpA - 1;  /* B tem de ser mais recente */
  render();
}
function setCmpB(i){ state.cmpB = +i; render(); }

function comparativo(){
  const a = jMod(JANELAS[state.cmpA]), b = jMod(JANELAS[state.cmpB]);
  const linha = (k, va, vb, money, sub) => {
    const dif = vb - va;                                      /* evolução de A para B */
    return `<tr>
      <td${sub ? ' style="padding-left:28px; color:var(--ink-2)"' : ''}>${k}</td>
      <td class="r num">${money?R$(va):N(va)}</td>
      <td class="r num"><b>${money?R$(vb):N(vb)}</b></td>
      <td class="r">${dif===0?'<span class="delta flat">=</span>':`<span class="delta ${dif>0?'up':'down'}">${dif>0?'+':'−'}${money?R$(Math.abs(dif)):N(Math.abs(dif))}</span>`}</td>
    </tr>`;
  };

  /* A pode ser qualquer janela menos a mais recente; B, qualquer uma posterior a A */
  const opsA = JANELAS.map((j, i) => ({i, j})).filter(x => x.i > 0);
  const opsB = JANELAS.map((j, i) => ({i, j})).filter(x => x.i < state.cmpA);
  const deixou = j => somaJ(j,'alteradas') - somaJ(j,'paraElegivel');

  return `
    <div class="cmp-sel" data-new="seleção em destaque">
      <div class="cmp-box">
        <label for="c-a">${tv('Processamento A', 'Janela de processamento A')} · anterior</label>
        <select id="c-a" onchange="setCmpA(this.value)">
          ${opsA.map(x => `<option value="${x.i}" ${state.cmpA===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <div class="cmp-arrow" aria-hidden="true">→</div>
      <div class="cmp-box">
        <label for="c-b">${tv('Processamento B', 'Janela de processamento B')} · posterior</label>
        <select id="c-b" onchange="setCmpB(this.value)">
          ${opsB.map(x => `<option value="${x.i}" ${state.cmpB===x.i?'selected':''}>${x.j.rotulo}</option>`).join('')}
        </select>
      </div>
      <span class="count">só é possível comparar ${tv('um processamento com outro posterior a ele', 'uma janela de processamento com outra posterior a ela')}</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:40%">Indicador</th>
          <th class="r">A · ${a.rotulo}</th>
          <th class="r">B · ${b.rotulo}</th>
          <th class="r" style="width:160px">Variação</th>
        </tr></thead>
        <tbody>
          ${linha('Ciclos afetados', anosDa(a).length, anosDa(b).length)}
          ${linha('Matrículas processadas', somaJ(a,'processadas'), somaJ(b,'processadas'))}
          ${linha('Matrículas com situação de elegibilidade alterada', somaJ(a,'alteradas'), somaJ(b,'alteradas'))}
          ${linha('↳ passaram a ser elegíveis', somaJ(a,'paraElegivel'), somaJ(b,'paraElegivel'), false, true)}
          ${linha('↳ deixaram de ser elegíveis', deixou(a), deixou(b), false, true)}
          ${linha('Parcelas liberadas', parcelasJ(a), parcelasJ(b))}
          ${linha('Valor liberado', valorJ(a), valorJ(b), true)}
        </tbody>
      </table>
    </div>`;
}

function tabelaParcelas(ciclos, comTotal){

/* ══════════════════════════════════════════════════════════════════
   TELA — ELEGIBILIDADE
   ══════════════════════════════════════════════════════════════════ */
function telaElegibilidade(){
  const j = state.janela ? jan(state.janela) : null;
  if (!j) state.altF = false;
  const jid = j ? j.id : '';
  const anos = ciclosEmFoco(), anosC = anosRecorte();
  const r = retrato(anosC, jid);

  /* Base: uma linha por matrícula-ciclo, com a situação daquele processamento.
     "Só alteradas" restringe às que mudaram de situação nele. */
  const base = [];
  ALUNOS.forEach(a => { if (!naMod(a)) return; anos.forEach(ano => {
    if (!a.sit[ano]) return;
    const m = j ? a.alt.find(x => x.jan === j.id && x.ciclo === ano) : null;
    if (state.altF && !m) return;
    base.push({a, ano, m, s:sitEm(a, ano, jid), ks:motEm(a, ano, jid)});
  }); });
  /* o motivo pertence a uma situação: trocar a situação limpa o motivo */
  if (state.motF && SIT_DO_GRUPO[MOTIVOS[state.motF].g] !== state.sitF) state.motF = '';
  let lista = base.filter(x => casa(x.a, state.busca));
  if (state.mun) lista = lista.filter(x => x.a.mun === state.mun);
  if (state.sitF) lista = lista.filter(x => x.s === state.sitF);
  if (state.motF) lista = lista.filter(x => x.ks[0] === state.motF);

  /* total do recorte — o mesmo número dos cartões */
  const chave = {'Elegível':'eleg', 'Não elegível':'nao', 'Elegibilidade indefinida':'indef'}[state.sitF];
  let total, totMot;
  if (state.altF) {
    const cs = jMod(j).ciclos.filter(c => anosC.includes(c.ano));
    const alt = cs.reduce((s, c) => s + c.alteradas, 0), pe = cs.reduce((s, c) => s + c.paraElegivel, 0);
    totMot = {nao:alt - pe, indef:0};
    total = !state.sitF ? alt : state.sitF === 'Elegível' ? pe : state.sitF === 'Não elegível' ? alt - pe : 0;
  } else {
    totMot = {nao:r.nao, indef:r.indef};
    total = chave ? r[chave] : r.rede;
  }
  /* com um motivo escolhido, o total é a parte daquele motivo na situação */
  if (state.motF) { const M = MOTIVOS[state.motF]; total = qtdMotivos(M.g, totMot[M.g]).find(i => i.k === state.motF).q; }
  if (state.busca || state.mun) total = lista.length;
  const pagina = lista.slice(0, LIM);
  const sub = state.altF ? `Matrículas que mudaram de situação ${noProc()} ${j.rotulo}, com a situação anterior`
    : j ? `Situação ${noProc()} ${j.rotulo}` : 'Situação atual das matrículas da rede no recorte selecionado';
  const geral = state.mod === 'geral';

  return {
    crumbs:[{txt:'Status de elegibilidade'}],
    html:`
    <div class="page-head">
      <div><h1>Status de Elegibilidade</h1></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>

    ${abasMod()}
    ${filtros()}
    ${windowBar()}
    ${linkCalendario()}

    <div class="kpis">
      ${kpi('Matrículas na Rede', r.rede, 'var(--blue)', 'Total de matrículas da rede no recorte selecionado.')}
      ${kpi('Elegível', r.eleg, 'var(--green)', 'Matrículas que atendem às condições do Programa.')}
      ${kpi('Elegível (pendência bancária)', r.pend, 'var(--red)', 'Elegíveis com conta ainda não regularizada.')}
      ${kpi('Elegibilidade Indefinida', r.indef, 'var(--orange)', 'Aguardando informação que conclua a avaliação.')}
      ${kpi('Não elegível', r.nao, 'var(--ink)', 'Matrículas que não atendem às condições.')}
    </div>

    ${listHead('Matrículas', total, pagina.length, sub)}
    ${searchbar(PH_BUSCA)}
    <div class="filters" style="margin-bottom:10px">
      <div class="field"><label>Filtrar por</label><select disabled><option>Bahia</option></select></div>
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-sit">Situação</label>
        <select id="f-sit" onchange="state.sitF=this.value; render()">
          <option value="">Todas</option>
          ${['Elegível','Não elegível','Elegibilidade indefinida'].map(s => `<option ${state.sitF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      ${['Não elegível', 'Elegibilidade indefinida'].includes(state.sitF) ? `<div class="field" data-new="filtro novo"><label for="f-mot">Motivo</label>
        <select id="f-mot" style="max-width:300px" onchange="state.motF=this.value; render()">
          <option value="">Todos</option>
          ${Object.keys(MOTIVOS).filter(k => SIT_DO_GRUPO[MOTIVOS[k].g] === state.sitF && MOTIVOS[k].p > 0)
            .map(k => `<option value="${k}" ${state.motF === k ? 'selected' : ''}>${MOTIVOS[k].nome}</option>`).join('')}
        </select></div>` : ''}
      ${j ? `<label class="fcheck" data-new="filtro novo"><input type="checkbox" ${state.altF ? 'checked' : ''} onchange="state.altF=this.checked; render()">
        Só com situação alterada nesta janela de processamento</label>` : ''}
    </div>
    ${chipsFiltros()}

    <div class="tbl-wrap">
      ${lista.length === 0 ? `<div class="empty"><b>Nenhuma matrícula encontrada</b>
        Revise a busca ou os filtros em uso, logo acima. ${state.busca?`Termo pesquisado: “${state.busca.replace(/</g, '&lt;')}”.`:''}</div>` : `
      <table class="tquebra">
        <thead><tr>
          <th>Matrícula</th><th>CPF</th><th>NIS</th><th>Nome</th>
          <th>Unidade de Ensino e Código INEP</th>
          <th>Ciclo</th>
          ${geral ? '<th data-new="coluna nova">Modalidade</th>' : ''}
          <th>Situação no Pé-de-Meia</th>
          ${state.altF ? `<th data-new="coluna nova">Antes desta janela de processamento</th>` : ''}
          <th></th>
        </tr></thead>
        <tbody>
          ${pagina.map(x => `<tr>
            <td class="num">${x.a.mat}</td>
            <td class="num" style="white-space:nowrap">${x.a.cpf}</td>
            <td class="num">${x.a.nis || '–'}</td>
            <td>${x.a.nome}</td>
            <td style="min-width:160px"><div style="font-size:12.5px">${x.a.escola}</div><div class="sec">Código INEP: ${x.a.inep}</div></td>
            <td>${pillCiclo(x.ano)}</td>
            ${geral ? `<td>${pillMod(x.a)}</td>` : ''}
            <td style="min-width:150px"><span class="pill ${pillSitE(x.s)}">${x.s}</span>${itip(tipSituacao(x.a, x.ano, jid))}${x.ks.length ? `<div class="mot-l">${MOTIVOS[x.ks[0]].nome}</div>` : ''}</td>
            ${state.altF ? `<td><span class="pill ${pillSitE(x.m.de)}">${x.m.de}</span></td>` : ''}
            <td class="r"><button class="eye" title="Ver detalhes" onclick="abrirDetalhe('${x.a.mat}')">👁</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    ${j?`<p style="color:var(--ink-2); font-size:12.5px; margin-top:12px">
      ${state.altF ? `Amostra das matrículas que mudaram de situação na janela de processamento de ${j.rotulo}.`
        : `Exibindo a situação das matrículas ${noProc()} ${j.rotulo}. A lista é a mesma de sempre — ${tv('o processamento', 'a janela de processamento')} mostra como cada matrícula estava naquele momento.`}
    </p>`:''}

    ${exportRecorte('Exportar Dados de Elegibilidade', total, 'os status dos estudantes')}`
  };
}

/* ══════════════════════════════════════════════════════════════════
   TELA — FREQUÊNCIA
   As colunas são os meses já apurados até o processamento escolhido
   (sem processamento, todos); a lista traz as matrículas elegíveis naquele
   momento — o mesmo total do bloco de frequência do Início.
   ══════════════════════════════════════════════════════════════════ */
const fmtF = v => v == null ? '—' : pct(v);
const clsF = v => v == null ? '' : v >= 80 ? 'hi' : v >= 75 ? 'mid' : 'lo';
function acumF(a, meses){
  const vs = meses.map(m => a.freq[m]).filter(v => v != null);
  return vs.length ? Math.round(vs.reduce((s, v) => s + v, 0) / vs.length * 100) / 100 : null;
}
function telaFrequencia(){
  const j = state.janela ? jan(state.janela) : null, jid = j ? j.id : '';
  const anos = ciclosEmFoco(), anosC = anosRecorte();
  const meses = mesesAte(jid);
  const fq = freqResumo(anosC, jid);

  const valF = a => acumF(a, meses);
  const base = ALUNOS.filter(a => naMod(a) && anos.some(ano => sitEm(a, ano, jid) === 'Elegível'));
  let lista = base.filter(a => casa(a, state.busca));
  if (state.mun) lista = lista.filter(a => a.mun === state.mun);
  if (state.faixaF === 'acima') lista = lista.filter(a => valF(a) != null && valF(a) >= 80);
  if (state.faixaF === 'abaixo') lista = lista.filter(a => valF(a) != null && valF(a) < 80);
  const total = (state.busca || state.mun) ? lista.length
    : state.faixaF === 'acima' ? fq.acima : state.faixaF === 'abaixo' ? fq.abaixo : fq.eleg;
  const pagina = meses.length ? lista.slice(0, LIM) : [];
  const ultimo = meses[meses.length - 1];
  const geral = state.mod === 'geral';

  return {
    crumbs:[{txt:'Frequência de estudantes'}],
    html:`
    <div class="page-head">
      <div><h1>Frequência de Matrículas</h1></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>

    ${abasMod()}
    ${filtros()}
    ${windowBar()}
    ${linkCalendario()}

    ${listHead('Estudantes elegíveis', meses.length ? total : 0, pagina.length,
      meses.length ? `Frequência mensal e acumulada${j ? ` até a janela de processamento de ${j.rotulo}` : ''}`
        : `A janela de processamento de ${j.rotulo} tratou só a matrícula`)}
    ${searchbar(PH_BUSCA)}
    <div class="filters" style="margin-bottom:10px">
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-faixa">Frequência acumulada</label>
        <select id="f-faixa" onchange="state.faixaF=this.value; render()">
          <option value="">Todas</option>
          <option value="acima" ${state.faixaF==='acima'?'selected':''}>Igual ou acima de 80%</option>
          <option value="abaixo" ${state.faixaF==='abaixo'?'selected':''}>Abaixo de 80%</option>
        </select></div>
    </div>
    ${chipsFiltros()}

    <div class="tbl-wrap">
      ${!meses.length ? `<div class="empty"><b>Nenhuma frequência nesta janela</b>
        A janela de processamento de ${j.rotulo} tratou só a matrícula.</div>`
      : lista.length === 0 ? `<div class="empty"><b>Nenhuma matrícula encontrada</b>
        Revise a busca ou os filtros em uso, logo acima.</div>` : `
      <table>
        <thead><tr>
          <th>Nome, CPF e NIS do Estudante</th>
          <th>Unidade de Ensino e código INEP</th>
          <th>Matrícula SGP</th>
          ${geral ? '<th data-new="coluna nova">Modalidade</th>' : ''}
          ${meses.map(m => `<th class="r">${m.charAt(0).toUpperCase() + m.slice(1)}</th>`).join('')}
          <th class="r">Acumulado</th><th></th>
        </tr></thead>
        <tbody>
          ${pagina.map(a => { const ac = acumF(a, meses); return `<tr>
            <td><div class="prim">${a.nome}</div><div class="sec num">CPF: ${a.cpf}${a.nis?` | NIS: ${a.nis}`:''}</div></td>
            <td><div style="font-size:12.5px">${a.escola}</div><div class="sec">Código INEP: ${a.inep}</div></td>
            <td class="num">${a.mat}</td>
            ${geral ? `<td>${pillMod(a)}</td>` : ''}
            ${meses.map(m => `<td class="freq ${clsF(a.freq[m])}">${fmtF(a.freq[m])}</td>`).join('')}
            <td class="freq acc ${clsF(ac)}">${fmtF(ac)}</td>
            <td class="r"><button class="eye" title="Ver detalhes" onclick="abrirDetalhe('${a.mat}')">👁</button></td>
          </tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>

    ${exportRecorte('Exportar Dados de Frequência', meses.length ? total : 0, 'as frequências dos estudantes')}`
  };
}

/* ══════════════════════════════════════════════════════════════════
   TELA — PAGAMENTO
   ══════════════════════════════════════════════════════════════════ */
const SIT_PAG_F = ['Pago', 'Aguardando Pagamento', 'Bloqueado'];
function telaPagamento(){
  const j = state.janela ? jan(state.janela) : null;
  const anos = ciclosEmFoco(), anosC = anosRecorte();

  let base = PARCELAS.filter(p => anos.includes(p.ciclo) && naMod(aluno(p.mat)));
  if (j) base = base.filter(p => p.jan === j.id);

  let lista = base.filter(p => casa(aluno(p.mat), state.busca));
  if (state.mun) lista = lista.filter(p => aluno(p.mat).mun === state.mun);
  if (state.incF) lista = lista.filter(p => incDe(p.cod) === state.incF);
  if (state.sitPagF) lista = lista.filter(p => p.sit === state.sitPagF);

  /* situações: do processamento quando houver, senão o consolidado */
  const cards = pagResumo(anosC, state.janela);

  /* Total do recorte: o mesmo número das situações acima. */
  const total = (state.busca || state.mun || state.incF) ? lista.length
    : state.sitPagF === 'Pago' ? cards.pagos
    : state.sitPagF === 'Aguardando Pagamento' ? cards.aguard
    : state.sitPagF === 'Bloqueado' ? cards.bloq
    : cards.total;
  const pagina = lista.slice(0, LIM);

  /* gráfico: por ciclo quando há janela; por situação no consolidado */
  let donut, legenda;
  if (j) {
    const sel = jMod(j).ciclos.filter(c => anosC.includes(c.ano));
    const totalV = sel.reduce((s,c) => s + valorC(c), 0);
    let acc = 0;
    const fs = sel.map(c => {
      const pct = totalV ? valorC(c) / totalV * 100 : 0; const seg = `${CORC[c.ano]} ${acc}% ${acc+pct}%`; acc += pct;
      return {ano:c.ano, pct, seg, valor:valorC(c)};
    });
    donut = `conic-gradient(${fs.map(f => f.seg).join(', ')})`;
    legenda = fs.map(f => `<div class="lrow"><i style="background:${CORC[f.ano]}"></i>
      <span class="nm">Ciclo ${f.ano}</span><span class="vl">${f.pct.toFixed(1)}%</span>
      <span class="money">${R$(f.valor)}</span></div>`).join('');
  } else {
    /* as situações fecham com o total: pagos, depositados, aguardando e bloqueados */
    const fat = [['Pagos', cards.pagos, 'var(--green)'], ['Depositados', cards.depos, '#2670E8'],
      ['Aguardando Pagamento', cards.aguard, '#9B5DE5'], ['Bloqueados', cards.bloq, 'var(--yellow)']].filter(f => f[1] > 0);
    let acc = 0;
    donut = `conic-gradient(${fat.map(f => { const p = cards.total ? f[1] / cards.total * 100 : 0; const s = `${f[2]} ${acc}% ${acc + p}%`; acc += p; return s; }).join(', ')})`;
    legenda = fat.map(f => `<div class="lrow"><i style="background:${f[2]}"></i><span class="nm">${f[0]}</span>
      <span class="vl">${f[1] / cards.total < .0005 ? '< 0,1' : (f[1] / cards.total * 100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1})}%</span></div>`).join('');
  }
  const geral = state.mod === 'geral';
  const tipBloqs = `<div class="tt">Motivos de parcela bloqueada</div><ul>${Object.values(MOT_BLOQ).map(M => `<li>${M.nome}</li>`).join('')}</ul><p class="tc">O motivo de cada parcela aparece na lista e no 👁 do estudante.</p>`;

  return {
    crumbs:[{txt:'Visualizar pagamentos'}],
    html:`
    <div class="page-head">
      <div><h1>Visualizar Pagamentos</h1></div>
      <div class="mark">PÉ·DE·MEIA</div>
    </div>

    ${abasMod()}
    ${filtros()}
    ${windowBar()}
    ${linkCalendario()}

    <div class="panel" style="overflow:hidden">
      <div style="background:var(--blue); color:#fff; padding:11px 18px; font-weight:600; font-size:13.5px">▥ ${MODS.find(m => m.id === state.mod).nome}</div>
      <div style="display:grid; grid-template-columns:1.35fr 1fr">
        <div>
          <div style="background:#F0F5FC; color:var(--blue-dark); padding:9px 18px; font-size:12.5px; font-weight:600; border-bottom:1px solid var(--line-2)">Incentivos</div>
          <div class="panel-rows">
            <div class="cell wide" style="background:var(--surface)">
              <div class="lbl">Total <span class="info">i</span></div>
              <div style="display:flex; align-items:baseline; justify-content:space-between; gap:14px">
                <div class="val num" style="font-size:26px; font-weight:700">${N(cards.total)}</div>
                <div class="num" style="color:var(--ink-2)">${R$(cards.vTotal)}</div>
              </div>
            </div>
            ${cellPag('Pagos', cards.pagos, cards.vPagos)}
            ${cellPag('Depositados', cards.depos, cards.vDepos)}
            ${cellPag('Em Análise Mec', 0, 0)}
            ${cellPag('Em Processamento', 0, 0)}
            ${cellPag('Aguardando Pagamento', cards.aguard, cards.vAguard)}
            ${cellPag('Bloqueados', cards.bloq, cards.vBloq, itip(tipBloqs, 'Ver os motivos de bloqueio'))}
            ${cellPag('Rejeitados', 0, 0)}
            ${cellPag('Suspensos', 0, 0)}
          </div>
        </div>
        <div style="border-left:1px solid var(--line-2)">
          <div style="background:#F0F5FC; color:var(--blue-dark); padding:9px 18px; font-size:12.5px; font-weight:600; border-bottom:1px solid var(--line-2)">
            ${j ? 'Valor liberado por ciclo' : 'Percentual de incentivos por situação'}
          </div>
          <div style="display:flex; align-items:center; justify-content:center; gap:24px; padding:30px 20px; flex-wrap:wrap">
            <div class="donut" style="width:150px; height:150px; background:${donut}">
              <div class="hole" style="width:92px; height:92px">
                <b style="font-size:${j ? 14 : 12.5}px">${j ? curto(cards.vTotal) : N(cards.total)}</b>
                <small>${j ? 'liberados' : 'incentivos'}</small>
              </div>
            </div>
            <div class="legend">${legenda}</div>
          </div>
        </div>
      </div>
    </div>

    ${listHead('Parcelas', total, pagina.length,
      (state.sitPagF ? `Situação: <b>${state.sitPagF}</b> · ` : '') + (j ? `${tv('Processamento de', 'Janela de processamento de')} ${j.rotulo}` : 'Todos os pagamentos da rede no recorte'))}
    ${searchbar(PH_BUSCA)}
    <div class="filters" style="margin-bottom:10px">
      <div class="field"><label>Filtrar por</label><select disabled><option>Bahia</option></select></div>
      ${selMun(ALUNOS)}
      <div class="field"><label for="f-inc">Tipo de Incentivo</label>
        <select id="f-inc" onchange="state.incF=this.value; render()">
          <option value="">Todos</option>
          ${INCS.map(s => `<option ${state.incF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="field"><label for="f-sitp">Situação</label>
        <select id="f-sitp" onchange="state.sitPagF=this.value; render()">
          <option value="">Todas</option>
          ${SIT_PAG_F.map(s => `<option ${state.sitPagF===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
    </div>
    ${chipsFiltros()}

    <div class="tbl-wrap">
      ${pagina.length === 0 ? `<div class="empty"><b>Nenhum pagamento encontrado</b>
        Revise a busca ou os filtros em uso, logo acima.</div>` : `
      <table>
        <thead><tr>
          <th>Estudante</th>
          <th>Unidade de Ensino e código INEP</th>
          ${geral ? '<th data-new="coluna nova">Modalidade</th>' : ''}
          <th>Incentivo</th>
          <th>Ciclo</th>
          <th>Processado em</th>
          ${!state.janela?`<th data-new="coluna nova">${tv('Processamento', 'Janela de processamento')}</th>`:''}
          <th>Situação do Incentivo</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${pagina.map(p => {
            const a = aluno(p.mat);
            return `<tr>
              <td><div class="prim">${a.nome}</div><div class="sec num">CPF: ${a.cpf}</div></td>
              <td><div style="font-size:12.5px">${a.escola}</div><div class="sec">Código INEP: ${a.inep}</div></td>
              ${geral ? `<td>${pillMod(a)}</td>` : ''}
              <td><div class="prim">${incDe(p.cod)}</div></td>
              <td>${pillCiclo(p.ciclo)}</td>
              <td class="num">${p.proc}</td>
              ${!state.janela?`<td class="num"><a href="#/janela/${p.jan}" onclick="event.preventDefault(); irCom('#/janela/${p.jan}')">${jan(p.jan).rotulo}</a></td>`:''}
              <td style="min-width:190px">${sitParcela(p, 'Data do Pagamento: ')}</td>
              <td class="r"><button class="eye" title="Ver detalhes" onclick="abrirDetalhe('${p.mat}')">👁</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>

    ${exportRecorte('Exportar Dados de Pagamentos', total, 'os pagamentos dos estudantes')}

    ${j ? `<div class="section-title" style="margin-top:30px"><span class="ico">▤</span> Parcelas ${tv('deste processamento', 'desta janela de processamento')}, por ciclo</div>
    ${tabelaParcelas(jMod(j).ciclos.filter(c => anosC.includes(c.ano)), false)}` : ''}`
  };
}
/* Pedido do MEC (13/11): sem as cores nas categorias de pagamento */
function cellPag(lbl, qtd, valor, extra){
  return `<div class="cell">
    <div class="lbl">${lbl} ${extra || '<span class="info">i</span>'}</div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px">
      <div class="val num">${N(qtd)}</div>
      <div class="num" style="color:var(--ink-2); font-size:12.5px">${R$(valor)}</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   MODAL DE DETALHE DA MATRÍCULA
   ══════════════════════════════════════════════════════════════════ */
function abrirDetalhe(mat){ state.modal = mat; tipFixo = null; esconderTip(); renderModal(); }
function fecharDetalhe(){ state.modal = null; tipFixo = null; esconderTip(); renderModal(); }

function renderModal(){
  const box = document.getElementById('modal');
  if (!state.modal) { box.innerHTML = ''; return; }
  const a = aluno(state.modal);
  const ps = PARCELAS.filter(p => p.mat === a.mat).sort((x, y) => y.jan.localeCompare(x.jan) || x.cod - y.cod);
  const pagas = ps.filter(p => p.sit === 'Pago');
  const valor = pagas.reduce((s,p) => s + MARCO[+String(p.cod).slice(4)].valor, 0);
  /* visão por estudante: as outras matrículas da mesma pessoa (EMR e EJA) */
  const todas = ALUNOS.filter(x => x.cpf === a.cpf);
  const anos26 = !!a.sit[2026];
  const acum = acumF(a, MESES_F);

  box.innerHTML = `
  <div class="overlay" onclick="if(event.target===this) fecharDetalhe()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Detalhes da matrícula">
      <div class="modal-h">
        <div>
          <h3>${a.nome}</h3>
          <div class="sec num">Matrícula SGP ${a.mat} · ${MODS.find(m => m.id === a.mod).nome} · CPF ${a.cpf}${a.nis?` · NIS ${a.nis}`:''}</div>
        </div>
        <button title="Fechar" onclick="fecharDetalhe()">×</button>
      </div>
      <div class="modal-b">
        ${todas.length > 1 ? `<h4 data-new="visão por estudante">Matrículas do estudante — ${todas.length}</h4>
        <div class="outras">${todas.map(x => `<button class="${x.mat === a.mat ? 'on' : ''}" onclick="abrirDetalhe('${x.mat}')">${pillMod(x)} ${x.mat} · ciclo ${Object.keys(x.sit).join(', ')}
          <span class="pill ${pillSitE(Object.values(x.sit)[0])}">${Object.values(x.sit)[0]}</span></button>`).join('')}</div>` : ''}

        <h4>Identificação</h4>
        <div class="idgrid">
          <div><div class="k">Unidade de Ensino</div><div class="v" style="font-size:12.5px; font-variant-numeric:normal">${a.escola}</div></div>
          <div><div class="k">Código INEP</div><div class="v">${a.inep}</div></div>
          <div><div class="k">Município</div><div class="v" style="font-variant-numeric:normal">${a.mun}</div></div>
          <div><div class="k">Frequência acumulada</div><div class="v" style="color:${acum>=80?'var(--green)':'var(--red)'}">${fmtF(acum)}</div></div>
        </div>

        ${anos26 ? `<h4 data-new="frequência por mês">Frequência mensal — ciclo 2026</h4>
        <div class="fmes">${MESES_F.map(m => `<div class="${a.freq[m] == null ? 'na' : clsF(a.freq[m])}">
          <div class="m">${NOME_MES[m]}</div><div class="p">${fmtF(a.freq[m])}</div>
          </div>`).join('')}</div>` : ''}

        <h4>Situação por ciclo</h4>
        <div class="tbl-wrap">
          <table class="tquebra">
            <thead><tr><th>Ciclo</th><th>Situação no Pé-de-Meia</th><th>Situação anterior</th><th>${tv('Alterada no processamento', 'Alterada na janela de processamento')}</th><th data-new="coluna nova">Motivo da alteração</th></tr></thead>
            <tbody>
              ${Object.keys(a.sit).sort((x,y)=>y-x).map(ano => {
                const m = a.alt.find(x => x.ciclo === +ano);
                return `<tr>
                  <td>${pillCiclo(+ano)}</td>
                  <td style="white-space:nowrap"><span class="pill ${pillSitE(a.sit[ano])}">${a.sit[ano]}</span>${itip(tipSituacao(a, +ano, ''))}</td>
                  <td>${m?`<span class="pill ${pillSitE(m.de)}">${m.de}</span>`:'<span class="sec">sem alteração</span>'}</td>
                  <td>${m?`<a href="#/janela/${m.jan}" onclick="event.preventDefault(); fecharDetalhe(); irCom('#/janela/${m.jan}')">${jan(m.jan).rotulo}</a>`:'–'}</td>
                  <td style="font-size:12.5px; color:var(--ink-2)">${m ? motivoAlt(a, m) : '–'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${Object.keys(a.sit).sort((x,y)=>y-x).filter(ano => a.sit[ano] !== 'Elegível').map(ano => {
          const ks = (a.mot && a.mot[ano]) || [], g = a.sit[ano] === 'Não elegível' ? 'nao' : 'indef';
          const st = ks.length && MOTIVOS[ks[0]].st ? MOTIVOS[ks[0]].st : (g === 'nao' ? 402 : 200);
          const tcis = ks.filter(k => MOTIVOS[k].txt);
          return `<div class="sitbox" data-new="motivo da situação">
            <div class="sbt">${pillCiclo(+ano)} <span class="pill ${pillSitE(a.sit[ano])}">${a.sit[ano]}</span>
              <span class="cod">${typeof st === 'number' ? 'status ' + st : MOTIVOS[ks[0]].cod.toLowerCase()}</span></div>
            <p class="sbd">${ST_ELEG[st]}</p>
            ${tcis.length ? `<div class="sbl">${g === 'nao' ? 'Confira os critérios para a inelegibilidade:' : 'Confira o detalhamento da situação:'}</div>
              ${tcis.map(k => `<div class="crit"><span class="x">✕</span><div><b>${MOTIVOS[k].nome}</b> <span class="cod">${MOTIVOS[k].cod}</span>
                <p>${MOTIVOS[k].txt}</p></div></div>`).join('')}` : ''}
          </div>`;
        }).join('')}

        <h4>Pagamentos — ${N(ps.length)} ${ps.length===1?'parcela':'parcelas'}, ${R$(valor)} ${pagas.length===ps.length?'pagos':'já pagos'}</h4>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Ciclo</th><th>Incentivo</th><th>${tv('Processamento', 'Janela de processamento')}</th><th>Situação</th></tr></thead>
            <tbody>
              ${ps.length === 0 ? '<tr><td colspan="4" class="sec">Nenhuma parcela liberada.</td></tr>' :
                ps.map(p => `<tr>
                  <td>${pillCiclo(p.ciclo)}</td>
                  <td>${incDe(p.cod)}</td>
                  <td><a href="#/janela/${p.jan}" onclick="event.preventDefault(); fecharDetalhe(); irCom('#/janela/${p.jan}')">${jan(p.jan).rotulo}</a></td>
                  <td>${sitParcela(p, 'em ')}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════ */
function render(){
  TIPS.length = 0; tipFixo = null; esconderTip();
  const telas = {
    inicio: telaInicio,
    elegibilidade: telaElegibilidade,
    frequencia: telaFrequencia,
    pagamento: telaPagamento,
    processamentos: telaProcessamentos,
    janela: telaJanela
  };
  const t = (telas[state.rota] || telaInicio)();

  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('crumbs').innerHTML = crumbsHTML(t.crumbs);
  document.getElementById('app').innerHTML = t.html + `
    <div class="foot">
      <span>Protótipo de proposta — ${nomeProc()}</span><span>·</span>
      <span>Dados ilustrativos, ancorados nas telas atuais do Portal do Usuário</span><span>·</span>
      <span>Revisão 7 — novembro de 2026</span>
    </div>`;
  renderModal();
}

lerHash();
</script>
</body>
